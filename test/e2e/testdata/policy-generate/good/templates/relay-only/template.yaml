apiVersion: templates.gatekeeper.sh/v1
kind: ConstraintTemplate
metadata:
  name: relayonly
  annotations:
    specs.publicdomainrelay.dev/title: every ssh outside the guest goes through the relay
    specs.publicdomainrelay.dev/level: MUST
    specs.publicdomainrelay.dev/severity: error
spec:
  crd:
    spec:
      names:
        kind: RelayOnly
      validation:
        openAPIV3Schema:
          type: object
          properties:
            guestRole:
              type: string
            relayClass:
              type: string
  targets:
    - target: admission.k8s.gatekeeper.sh
      rego: ""
      libs: []
