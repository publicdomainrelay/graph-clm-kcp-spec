scope: >-
  Hand labels read from the source, not from the classifier. A true site is one
  a reader attributes to an effect kind the vocabulary covers (net.dial,
  http.request, http.handle, ssh.connect, container.exec, proc.exec,
  event.emit, event.receive, net.listen) for the four files below. A label
  counts as found when the classifier reports the same kind within one line.
  Shell commands written inside TypeScript strings are labelled per line only
  for curl and ssh; the other shell commands there are counted in gaps.
