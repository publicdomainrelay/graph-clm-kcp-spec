                  code: ["deploy/workspacetype-denoruntime.yaml:defaultAPIBindings", deploy/examples/atproto/market/00-workspaces.yaml]
                  children:
                    - id: tb.namespace
                      kind: namespace
                      enforced_by: [up.kcp, ov.runtime-rbac, ov.market-rbac, sc.kind.openbao]
                      code: [deploy/examples/atproto/market/10-rbac.yaml, "internal/provider/reconcile_openbao.go:authorityFor"]
                      children:
                        - id: tb.workload
                          kind: deno_sandbox
                          runs_in: tb.host
                          contains: [ov.deno-process-launch, ov.workload-env]
                          enforced_by: [type.DenoPermissions, cred.sa-token]
                          policy_from: type.DenoPodTemplate.permissions
                          code: ["internal/denoperm/denoperm.go:Args", "internal/runner/pod_exec.go:PermissionArgs"]
                          children:
                            - id: tb.child-process
