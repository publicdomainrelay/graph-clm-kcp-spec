                - id: tb.tenant-workspace
                  kind: logical_cluster
                  workspaces: [root:runtime, root:global, root:relay, root:alice, root:demo]
                  principals: [orch.demo-deno-runtime, orch.demo, orch.apply-market, sc.deno-kcp-provider]
