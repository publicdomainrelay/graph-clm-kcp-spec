                  enforced_by: [up.kcp]
                  code: ["deploy/install-provider.sh:PROVIDER_WORKSPACE", "internal/provider/watch.go:defaultProviderWorkspace"]
                  children:
                    - id: tb.apiexport-vw
                      kind: virtual_workspace
                      contains: [ov.apiexport-vw]
                      principals: [sc.provider.watch]
                      enforced_by: [ov.apiexport-vw]
                      spans: {workspaces: bound_to_export, namespaces: all}
