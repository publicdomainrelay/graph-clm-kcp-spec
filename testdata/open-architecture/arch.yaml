              code: ["deploy/examples/atproto/market/50-verifier.yaml:VERIFY_PLC"]
            x.verifier-watch-relay:
              from: tb.workload
              to: tb.child-process
              carries: [flow.market-e2e]
              auth: none
              gate: []
              route: "wss://relay.default.relay.svc.kcp.local/xrpc/com.atproto.sync.subscribeRepos"
              code: ["deploy/examples/atproto/market/50-verifier.yaml:watchRelay"]
          sc.demo.native-fire.script:
            x.workload-to-api:
              from: tb.workload
              to: tb.tenant-workspace
              carries: [sc.kind.policyworkflowrun, sc.kind.policyworkflowpod]
              into: ["sc.kind.policyworkflowrun.spec", "metadata.ownerReferences"]
              auth: cred.sa-token
              gate: [ov.runtime-rbac, sc.provider.admission]
              route: "<KCP_SERVER>/apis/deno.computer/v1alpha1/namespaces/<namespace>/policyworkflowruns, bearer KCP_TOKEN; the referenced PolicyWorkflowPod is read from the same path"
              code: ["deploy/examples/native-fire-pod.yaml:KCP_TOKEN", internal/provider/admission.go]
              src: adr_0002

        risks:
          r.permissions-self-declared:
            severity: high
            context: tb.workload
            crossing: x.spawn
            finding: "tenant spec.permissions is the sandbox; validation is syntax only and permissions.all yields -A"
            evidence: ["internal/denoperm/denoperm.go:Validate", "internal/denoperm/denoperm.go:p.All"]
          r.launcher-allow-all:
            severity: high
            context: tb.child-process
            finding: "market launcher spawns the service with deno run -A, escaping the pod's own permissions"
            evidence: ["deploy/examples/atproto/market/20-global-plc.yaml:Deno.execPath", "deploy/examples/atproto/market/30-relay-relay.yaml:Deno.execPath", "deploy/examples/atproto/market/40-alice-pds.yaml:Deno.execPath"]
            basis: example
          r.provider-environ-leak:
            severity: high
            context: tb.workload
            crossing: x.environ-leak
            finding: "pods, engines and probes start from provider os.Environ(); OPENBAO_TOKEN and KUBECONFIG reach every workload when set as env"
            evidence: ["internal/runner/pod_exec.go:os.Environ", "internal/runner/engine_exec.go:os.Environ"]
          r.probe-host-exec:
            severity: high
            context: tb.host
            crossing: [x.pod-probe-exec, x.engine-probe-exec]
            finding: "readinessProbe/livenessProbe command is exec'd on the host as the provider user, outside any Deno sandbox"
            evidence: ["internal/runner/pod_exec.go:exec.CommandContext", "internal/runner/engine_exec.go:exec.CommandContext", "internal/provider/reconcile_pod.go:probeCommand"]
          r.peer-workspace-tokens:
            severity: high
            context: tb.tenant-workspace
            crossing: x.mint-token
            finding: "KCP_TOKENS mints a token for the pod's serviceAccount name in every workspace in the DNS table, so a pod holds peer tenants' same-named SA rights"
            evidence: ["internal/provider/service_dns.go:dnsTokens", "internal/provider/service_dns.go:dnsTable"]
          r.pds-key-plain-env:
            severity: high
            context: tb.namespace
            crossing: x.secret-substitution
            finding: "PDS private key is sed-substituted into DenoPod spec.env, stored plain in kcp/kine, readable by any get denopods principal"
            evidence: ["deploy/examples/atproto/market/apply.sh:__PDS_PRIVATE_KEY_HEX__", "deploy/examples/atproto/market/40-alice-pds.yaml:PDS_PRIVATE_KEY_HEX", "deploy/examples/atproto/market/10-rbac.yaml:denopods"]
            basis: example
          r.no-os-isolation:
            severity: high
            context: tb.host
            finding: "workloads share the provider's OS user and filesystem; read access reaches admin.kubeconfig and other runs' files"
            evidence: ["internal/runner/pod_exec.go:Setpgid", "internal/runner/pod_exec.go:Start"]
          r.openbao-namespace-unscoped:
            severity: high
            context: tb.openbao-namespace
            crossing: x.provision-authority
            finding: "OpenBao spec.namespace is not checked against the workspace; a tenant can adopt another tenant's authority and its finalizer deletes that namespace"
            evidence: ["api/v1alpha1/types_openbao.go:OpenBaoSpec", "internal/provider/reconcile_openbao.go:reconcileOpenBao", "internal/provider/reconcile_openbao.go:deleteOpenBao"]
          r.engine-allow-all:
            severity: high
            context: tb.policy-engine
            crossing: x.engine-spawn
            finding: "PolicyEngine runs deno --allow-all and ignores spec.permissions; spec.env passes through"
            evidence: ["internal/runner/engine_exec.go:Start", "internal/provider/reconcile_engine.go:reconcileEngine"]
          r.kine-unauthenticated:
            severity: high
            context: tb.kine
            crossing: x.loopback-kine
            finding: "kine serves the etcd API over plain http on loopback with no auth; a workload with net reads and writes all kcp state"
            evidence: ["deploy/start-kcp.sh:KINE_ENDPOINT", "deploy/start-kcp.sh:KINE_HOSTPORT"]
          r.openbao-dev-root-token:
            severity: high
            context: tb.openbao
            crossing: x.loopback-openbao
            finding: "start-openbao.sh and baoembed run a dev server over http with root token default root; a workload with net can drive the whole PKI"
            evidence: ["deploy/start-openbao.sh:TOKEN", "deploy/start-openbao.sh:ADDR", "internal/baoembed/cmd/baoembed/main.go:rootToken"]
          r.sa-namespace-unchecked:
            severity: medium
            context: tb.tenant-workspace
            crossing: x.mint-token
            finding: "spec.serviceAccount.namespace is not tied to the pod's namespace; a pod can mint any SA's token in its workspace"
            evidence: ["internal/provider/registry_runtime.go:MintServiceAccountToken", "api/v1alpha1/types_shared.go:ServiceAccountRef"]
          r.leaf-role-domain-wide:
            severity: medium
            context: tb.openbao-namespace
            crossing: x.issue-leaf
            finding: "every namespace role allows any subdomain of --service-domain, so each intermediate can sign any service name"
            evidence: ["internal/baopki/baopki.go:AllowSubdomains", "internal/baopki/baopki.go:AllowedDomains"]
          r.tls-verifies-loopback:
            severity: medium
            context: tb.workload
            crossing: x.workload-tls
            finding: "shim rewrites to 127.0.0.1 and every leaf carries that SAN; any leaf under the root passes for any name"
            evidence: ["internal/provider/kcpdns/shim.ts:rewrite", "internal/baopki/baopki.go:Issue"]
          r.engine-endpoint-ssrf:
            severity: medium
            context: tb.provider-process
            crossing: x.evaluate-policy
            finding: "spec.engineEndpoint is a tenant URL the provider POSTs to from the host when no PolicyWorkflowPod endpoint is admitted"
            evidence: ["internal/provider/provider.go:run.Spec.EngineEndpoint", "internal/provider/policy_client.go:Submit"]
          r.provider-admin-credential:
            severity: medium
            context: tb.provider-process
            crossing: x.provider-write
            finding: "provider runs on the kcp admin kubeconfig and writes via /clusters/<lc>, not a least-privilege export identity"
            evidence: ["cmd/deno-kcp-provider/main.go:BuildConfigFromFlags", "internal/provider/registry.go:ApiPathPrefix"]
          r.runner-timeout-reads-succeeded:
            severity: medium
            context: tb.workload
            crossing: x.spawn
            finding: "a run the runner timed out or stopped is observed failed but still carries exitCode 0, so restartPolicy Never turns the pod Succeeded and its Complete condition reads exited successfully while status.message holds the timeout"
            evidence: ["internal/runner/pod_exec.go:Observe", "internal/provider/reconcile_pod.go:exitCodePtr", "internal/denopod/denopod.go:exited"]
          r.duplicate-start-after-restart:
            severity: medium
            context: tb.workload
            crossing: x.spawn
            finding: "run_refs is in memory only and Provider.Close stops no workload, so a crash between Start and the status write loses the once-per-run guard and the next pass starts a second workload for the same run"
            evidence: ["internal/provider/run_refs.go:runRefs", "internal/provider/run_refs.go:alreadyStarted", "internal/provider/provider.go:Close", "internal/provider/reconcile_run.go:reconcileRun"]
          r.spec-env-unfiltered:
            severity: medium
            context: tb.workload
            crossing: x.spawn
            finding: "spec.env keys go verbatim into the process env, so loader and runtime vars (LD_PRELOAD, DENO_DIR) apply before permissions"
            evidence: ["internal/runner/pod_exec.go:req.Env", "internal/runner/engine_exec.go:req.Env"]
            basis: inferred
          r.trigger-cross-namespace-run:
            severity: medium
            context: tb.namespace
            finding: "RunTrigger picks the newest terminal run by label across every namespace of its workspace; a run in another namespace labelled with the same pod name fires the job"
            evidence: ["internal/provider/reconcile_trigger.go:listWorkflowRuns", "internal/provider/reconcile_trigger.go:latestTerminalRun", "internal/provider/watch_cache.go:ListWorkflowRuns"]
          r.upstream-kcp-unpinned:
            severity: medium
            context: tb.kcp
            upstream: up.kcp
            finding: "the kcp binary is whatever kcp resolves to on PATH; its version is recorded nowhere, so the API server every boundary trusts can change without a file in this repo changing"
            evidence: ["deploy/start-kcp.sh:KCP_BIN", "Makefile:preflight"]
          r.upstream-kine-unpinned:
            severity: medium
            context: tb.kine
            upstream: up.kine
            finding: "the kine binary is whatever kine resolves to on PATH and its version is recorded nowhere, so the datastore holding every kcp object is unpinned"
            evidence: ["deploy/start-kcp.sh:KINE_BIN", "Makefile:preflight"]
          r.upstream-deno-unpinned:
            severity: medium
            context: tb.workload
            upstream: up.deno
            finding: "the deno binary is whatever deno resolves to on PATH; runner DenoBin defaults to it, so the runtime the sandbox permissions are enforced by is unpinned"
            evidence: ["internal/runner/pod_exec.go:DenoBin", "Makefile:preflight"]
          r.upstream-policy-engine-unpinned:
            severity: medium
            context: tb.policy-engine
            upstream: up.policy-engine
            finding: "the policy engine is a sibling checkout run with deno --allow-all; whichever commit the org-root checkout has is what decides every verdict, with nothing recording it"
            evidence: ["internal/runner/engine_exec.go:DenoBin", "cmd/deno-kcp-provider/main.go:policyEngineDir"]
          r.upstream-hono-plc-unpinned:
            severity: medium
            context: tb.child-process
            upstream: up.hono-plc
            finding: "the market PLC directory is a sibling checkout run by absolute path; whichever commit the org-root checkout has is what serves the directory, with nothing recording it"
            evidence: ["deploy/examples/atproto/market/20-global-plc.yaml:SERVICE_ENTRY", "deploy/examples/atproto/market/apply.sh:ORG_ROOT"]
            basis: example
          r.upstream-hono-pds-unpinned:
            severity: medium
            context: tb.child-process
            upstream: up.hono-pds
            finding: "the market PDS is a sibling checkout run by absolute path; whichever commit the org-root checkout has is what holds the account and signing key, with nothing recording it"
            evidence: ["deploy/examples/atproto/market/40-alice-pds.yaml:SERVICE_ENTRY", "deploy/examples/atproto/market/apply.sh:ORG_ROOT"]
            basis: example
          r.upstream-hono-atproto-relay-unpinned:
            severity: medium
            context: tb.child-process
            upstream: up.hono-atproto-relay
            finding: "the market relay is a sibling checkout run by absolute path; whichever commit the org-root checkout has is what crawls and serves commits, with nothing recording it"
            evidence: ["deploy/examples/atproto/market/30-relay-relay.yaml:SERVICE_ENTRY", "deploy/examples/atproto/market/apply.sh:ORG_ROOT"]
            basis: example
          r.dns-table-cross-tenant:
            severity: low
            context: tb.tenant-workspace
            finding: "KCP_DNS_TABLE lists every advertising DenoPod of every bound workspace into every pod"
            evidence: ["internal/provider/service_dns.go:dnsTable", "internal/provider/service_dns.go:KCP_DNS_TABLE"]
          r.service-name-path-fallback:
            severity: low
            context: tb.tenant-workspace
            crossing: x.cluster-path
            finding: "a failed kcp.io/path read is cached as empty and the FQDN is then built with no workspace labels, so the pod advertises and resolves under a name no peer looks up"
            evidence: ["internal/provider/cluster_path.go:lookup", "internal/provider/service_dns.go:serviceFQDN"]
          r.engine-unauthenticated:
            severity: low
            context: tb.policy-engine
            crossing: [x.evaluate-policy, x.engine-health]
            finding: "engine API on 127.0.0.1 has no auth; any workload with net reaches it"
            evidence: ["internal/runner/engine_exec.go:Start", "internal/provider/policy_client.go:Submit"]
          r.engine-port-toctou:
            severity: low
            context: tb.policy-engine
            crossing: x.engine-spawn
            finding: "freePort listens, closes, then the engine binds the port later; another local process can take it"
            evidence: ["internal/provider/reconcile_engine.go:freePort"]
          r.world-readable-run-dirs:
            severity: low
            context: tb.host
            finding: "run dirs are 0755 and every runner-written file 0644; ca.pem is public CA material, so the secret at rest is what the workload writes (the market launcher writes the leaf private key as tls.key with no mode set, and stdout/stderr/result.json may carry one)"
            evidence: ["internal/runner/pod_exec.go:MkdirAll", "internal/runner/pod_exec.go:WriteFile", "deploy/examples/atproto/market/40-alice-pds.yaml:writeTextFile"]
          r.run-dir-outlives-workload:
            severity: low
            context: tb.host
            finding: "no code path removes a per-workload run directory, so a stopped workload leaves its script, ca.pem and anything it wrote (the market launcher's leaf private key) on disk for whoever reads the shared OS user's files next"
            evidence: ["internal/runner/pod_exec.go:RunsDir"]
          r.pds-key-on-sed-argv:
            severity: low
            context: tb.host
            crossing: x.secret-substitution
            finding: "apply.sh substitutes the PDS private key into the manifest with sed -e, so the key value is on the sed process's command line for anything sharing the host user"
            evidence: ["deploy/examples/atproto/market/apply.sh:__PDS_PRIVATE_KEY_HEX__"]
            basis: example
          r.provider-openbao-token-on-argv:
            severity: low
            context: tb.provider-process
            finding: "the provider takes the OpenBao token as --openbao-token and the market README starts it that way, so the token sits in the provider process's argv for anything sharing the host user"
            evidence: ["cmd/deno-kcp-provider/main.go:openBaoToken", "deploy/examples/atproto/market/README.md:openbao"]
          r.probe-deno-from-path:
            severity: low
            context: tb.probe
            finding: "kcpdns ProbeCommand runs deno from PATH and ignores --deno-bin"
            evidence: ["internal/provider/kcpdns/embed.go:ProbeCommand"]
          r.service-entry-absolute-paths:
            severity: low
            context: tb.host
            crossing: x.org-root-paths
            finding: "market YAML hardcodes SERVICE_ENTRY/SERVICE_CWD under /home/johnandersen777/src/publicdomainrelay-kcp; only apply.sh rewrites that prefix to ORG_ROOT, so the guest is handed a path into the operator's org root and runs whatever checkout and node_modules sit there"
            evidence: ["deploy/examples/atproto/market/40-alice-pds.yaml:SERVICE_ENTRY", "deploy/examples/atproto/market/apply.sh:ORG_ROOT"]
            basis: example
          r.admission-lease-cross-namespace:
            severity: low
            context: tb.namespace
            finding: "admission leases are keyed by logical cluster and pod name, not namespace; same-named pods in one workspace share lease capacity for up to leaseTTL"
            evidence: ["internal/provider/admission.go:forPod"]
          r.suspended-run-holds-lease:
            severity: low
            context: tb.namespace
            finding: "a suspended run stays Pending, so admission re-grants its lease on every admitted pass and it holds a capacity slot until leaseTTL while its status reads Suspended"
            evidence: ["internal/provider/admission.go:forPod", "internal/provider/admission.go:admit", "internal/policyworkflowrun/policyworkflowrun.go:suspend"]
          r.install-writes-unchecked:
            severity: low
            context: tb.provider-workspace
            crossing: x.admin-install
            finding: "install-provider.sh applies APIResourceSchemas, APIExports and WorkspaceTypes into the provider workspace with the admin kubeconfig and gate [], so the credential is the whole check"
            evidence: ["deploy/install-provider.sh:KWA", "deploy/denoruntime-apiexport.yaml"]
          r.endpoint-discovery-unchecked:
            severity: low
            context: tb.provider-process
            crossing: x.endpoint-discovery
            finding: "the provider resolves APIExportEndpointSlices across every bound workspace with the admin kubeconfig and gate []"
            evidence: ["internal/provider/watch.go:discoverWorkspaces", "internal/provider/watch.go:awaitWorkspaces", "internal/provider/watch.go:watchEndpointSlices"]
          r.watch-reads-unchecked:
            severity: low
            context: tb.provider-process
            crossing: x.watch
            finding: "provider informers read every tenant object of every kind through the admin kubeconfig with gate [], no per-request check"
            evidence: ["internal/provider/watch.go:watchFactory", "internal/provider/watch.go:registerInformer"]
          r.watch-delete-not-watched:
            severity: low
            context: tb.provider-process
            finding: "informers register add and update handlers only, so a delete event wakes nothing; an owner whose child is deleted before its terminal update keeps its last status until its own requeue"
            evidence: ["internal/provider/watch.go:registerInformer", "internal/provider/watch.go:enqueueOwn"]
          r.intermediate-sign-unchecked:
            severity: low
            context: tb.openbao-root
            crossing: x.sign-intermediate
            finding: "the provider signs any namespace's intermediate with the OpenBao token and gate []; nothing checks the namespace against the workspace"
            evidence: ["internal/baopki/baopki.go:signIntermediate", "internal/openbao/openbao.go:SignIntermediate"]
          r.export-view-unchecked:
            severity: low
            context: tb.tenant-workspace
            crossing: x.export-view
            finding: "the export's virtual workspace serves every exported kind into the tenant workspace with auth none and no per-request credential; the APIBinding created wholesale by the WorkspaceType is the only gate"
            evidence: ["deploy/denoruntime-apiexport.yaml", "deploy/workspacetype-denoruntime.yaml:defaultAPIBindings"]
          r.kine-probe-tcp-only:
            severity: low
            context: tb.kine
            crossing: x.boot-kine
            finding: "start-kcp.sh takes any TCP acceptance on the kine port as the datastore and points kcp at that address, so a foreign listener is adopted as etcd"
            evidence: ["deploy/start-kcp.sh:kine_ready", "deploy/start-kcp.sh:KINE_HOSTPORT"]
          r.kcp-ready-unverified:
            severity: low
            context: tb.kcp
            crossing: x.boot-kcp
            finding: "the kcp readiness probe is curl -sk and no status code is checked, so anything answering https on the port with any response is accepted as kcp"
            evidence: ["deploy/start-kcp.sh:kcp_ready", "deploy/start-kcp.sh:KCP_SECURE_PORT"]
          r.vault-status-any-listener:
            severity: low
            context: tb.openbao
            crossing: x.boot-openbao
            finding: "start-openbao.sh decides the vault is up from the exit status of bao status, which presents no token and speaks plain http"
            evidence: ["deploy/start-openbao.sh:status", "deploy/start-openbao.sh:ADDR"]
          r.openbao-token-on-argv:
            severity: low
            context: tb.host
            finding: "start-openbao.sh and baoembed pass the root token to bao as -dev-root-token-id, so the value is on the process command line for anything sharing the host user"
            evidence: ["deploy/start-openbao.sh:TOKEN", "deploy/start-openbao.sh:nohup", "internal/baoembed/cmd/baoembed/main.go:rootToken"]
          r.market-applies-unchecked:
            severity: low
            context: tb.tenant-workspace
            crossing: [x.apply-openbao, x.apply-rbac]
            finding: "the market's OpenBao authority objects and its denopod peer-read ClusterRole and Binding go into each workspace with the admin kubeconfig and gate [], so the credential is the whole check"
            evidence: ["deploy/examples/atproto/market/apply.sh:apply_pod", "deploy/examples/atproto/market/10-rbac.yaml:ClusterRoleBinding"]
            basis: example
          r.runtime-applies-unchecked:
            severity: low
            context: tb.tenant-workspace
            crossing: [x.runtime-rbac, x.apply-policy-engine, x.apply-policy-workflow-pod, x.apply-native-fire-pod, x.apply-run-trigger, x.demo-policy-engine, x.demo-policy-workflow-run]
            finding: "the runtime and direct-run demos apply the run creator's RBAC and their example objects into the tenant workspace with the admin kubeconfig and gate [], so the credential is the whole check"
            evidence: ["deploy/demo-deno-runtime.sh:ClusterRoleBinding", "deploy/demo.sh:policyengine.yaml"]
            basis: code
          r.market-plc-writes-unauthenticated:
            severity: low
            context: tb.child-process
            crossing: [x.pds-register-did, x.pds-request-crawl]
            finding: "the PDS registers its DID at the PLC directory and announces itself to the relay with no credential configured, so any workload that can resolve either name writes into the market's directory and crawl list"
            evidence: ["deploy/examples/atproto/market/40-alice-pds.yaml:PDS_PLC_DIRECTORY_URL", "deploy/examples/atproto/market/40-alice-pds.yaml:PDS_CRAWLERS"]
            basis: example
          r.market-relay-subscribe-unauthenticated:
            severity: low
            context: tb.child-process
            crossing: x.relay-subscribe-repos
            finding: "the relay subscribes to each crawled PDS over a WebSocket with no credential, and the name must already be in its table, so whatever it crawls is readable by anything that can reach the subscription"
            evidence: ["deploy/examples/atproto/market/apply.sh:WebSocket", "deploy/examples/atproto/market/README.md:Ceilings"]
            basis: example
          r.market-verifier-reads-unauthenticated:
            severity: low
            context: tb.workload
            crossing: [x.verifier-read-did, x.verifier-watch-relay]
            finding: "the verifier reads a DID document from the PLC directory and watches a commit stream on the relay with no credential, the same reach every other workload in the table has"
            evidence: ["deploy/examples/atproto/market/50-verifier.yaml:VERIFY_PLC", "deploy/examples/atproto/market/50-verifier.yaml:VERIFY_RELAY"]
            basis: example
          r.market-verify-fixed-password:
            severity: low
            context: tb.workload
            crossing: x.verifier-create-account
            finding: "the verifier creates a real account on the PDS with a hardcoded password, and apply.sh prints a different fixed password for the operator's manual create"
            evidence: ["deploy/examples/atproto/market/50-verifier.yaml:password", "deploy/examples/atproto/market/apply.sh:hunter2"]
            basis: example
          r.market-access-jwt-in-outputs:
            severity: low
            context: tb.workload
            crossing: x.verifier-create-record
            finding: "the verifier writes the accessJwt it authenticates with into result.json, so the token lands in the DenoPod's status.outputs, which apply.sh prints"
            evidence: ["deploy/examples/atproto/market/50-verifier.yaml:accessJwt", "deploy/examples/atproto/market/apply.sh:outputs"]
            basis: example
          r.upstream-kubectl-unpinned:
            severity: low
            context: tb.kcp-admin
            upstream: up.kubectl
            finding: "kubectl is whatever kubectl resolves to on PATH; the deploy scripts and the live tier drive the cluster through it with no version recorded"
            evidence: ["deploy/install-provider.sh:KUBECTL", "Makefile:kubectl"]
          r.upstream-bundled-actions-unpinned:
            severity: low
            context: tb.policy-engine
            upstream: up.gha-lite-bundled-actions
            finding: "the bundled actions directory is read from the sibling policy-engine checkout at an unrecorded commit, so every action a verdict runs comes from an unpinned tree"
            evidence: ["cmd/deno-kcp-provider/main.go:bundledActionsDir"]
          r.openbao-embed-go-version:
            severity: low
            context: tb.openbao
            upstream: up.openbao
            finding: "internal/baoembed and the vendored openbao and sdk go.mod files declare go 1.27.0, while the repo root declares go 1.26.0, so the embedded build needs a newer toolchain than the repo itself declares"
            evidence: ["internal/baoembed/go.mod", "third_party/openbao/go.mod", "go.mod"]
          r.engine-timeout-unenforced:
            severity: info
            context: tb.policy-engine
            finding: "ExecEngine.Timeout defaults to 24h and is never enforced"
            evidence: ["internal/runner/engine_exec.go:NewExecEngine"]
          r.metrics-unauthenticated:
            severity: info
            context: tb.provider-process
            crossing: x.metrics-scrape
            finding: "/metrics has no auth on --metrics-listen"
            evidence: ["internal/provider/metrics.go:handleMetrics"]
          r.embedded-ready-any-status:
            severity: info
            context: tb.openbao
            crossing: x.embedded-health
            finding: "baoembed prints its ready line for any HTTP response from /v1/sys/health, so a non-200 answer counts as the vault being up"
            evidence: ["internal/baoembed/cmd/baoembed/main.go:client.Get", "internal/baoembed/cmd/baoembed/main.go:readyPrefix"]
          r.test-openbao-authority-unverified:
            severity: info
            context: tb.openbao
            crossing: x.test-openbao-authority
            finding: "the integration harness reads the embedded OpenBao's CA chain over loopback with the fixed dev root token and gate [], so nothing checks the announced authority beyond having started the process"
            evidence: ["test/integration/bao_test.go:startBao", "test/integration/openbao_live_test.go:readRootCA"]

        identity:
          systems:
            x509_leaf:
              system: x509
              proves: service_name_authority
              names: service_dns_name
              checked_by: [tb.child-process, tb.workload]
              minted_by: [sc.openbao-server]
              minted_at: pod_start
              implemented_here: true
              code: {authority: "internal/baopki/baopki.go:ensureAuthority", issue: "internal/provider/service_dns.go:podEnv", name: "internal/provider/service_dns.go:serviceFQDN"}
            did:
              system: did
              proves: account_registered
              names: account
              checked_by: [sc.market.verifier]
              minted_by: [up.hono-pds]
              minted_at: account_create
              signature_verified: false
              methods:
                plc: {implemented_here: false, code: "deploy/examples/atproto/market/40-alice-pds.yaml:PDS_PLC_DIRECTORY_URL"}
                web: {basis: Host, implemented_here: false, code: "deploy/examples/atproto/market/README.md:Host"}
              check:
                reads: [status, alsoKnownAs, service]
                decides: http_status
                records_only: [alsoKnownAs, service]
                code: "deploy/examples/atproto/market/50-verifier.yaml:verdict"
              code: {status: "deploy/examples/atproto/market/50-verifier.yaml:plcStatus", document: "deploy/examples/atproto/market/50-verifier.yaml:plcAlsoKnownAs", mint: "deploy/examples/atproto/market/50-verifier.yaml:out.did"}
          meets:
            - value_form: service_dns_name
              carries: [ov.baopki, sc.kind.denopod.spec.env]
              code: ["internal/provider/service_dns.go:serviceFQDN", "deploy/examples/atproto/market/50-verifier.yaml:VERIFY_PDS"]
            - value_form: account_identity
              carries: [sc.market.pds, sc.market.verifier]
              code: ["deploy/examples/atproto/market/50-verifier.yaml:repo", "deploy/examples/atproto/market/50-verifier.yaml:out.did"]
            - value_form: tenant_identity
              value: "did:plc:example"
              carries: [sc.kind.policyworkflowpod.spec.selfDid, sc.kind.policyworkflowrun.spec.selfDid, sc.kind.policyworkflowpod.spec.inputs, sc.kind.policyworkflowrun.spec.inputs]
              assumed_by: [ov.demo-open-policy-pod, ov.example-policy-workflow-run]
              forwarded_to: [up.policy-engine]
              unread_by: [sc.deno-kcp-provider]
              code: ["deploy/examples/policyworkflowpod.yaml:selfDid", "deploy/examples/policyworkflowpod.yaml:inputs", "deploy/examples/policy-workflow-run.yaml:inputs"]
    orchestrator: orch.demo-deno-runtime
    context: tb.host

