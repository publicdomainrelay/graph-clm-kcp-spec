              mount_conflict: {existing_type_differs: error, replaces_mount_in_use: false, code: "internal/openbao/openbao.go:EnsureMount"}
              idempotence: {root: reused_when_mount_and_serial_exist, namespace: reused_when_serial_exists, code: ["internal/baopki/baopki.go:ensureRoot", "internal/baopki/baopki.go:ensureAuthority"]}
              delete: {removes: openbao_namespace, cached_authority: dropped, already_gone: ok, code: ["internal/baopki/baopki.go:Delete", "internal/openbao/openbao.go:DeleteNamespace"]}
              renewal:
                provider: none
                reissue: pod_restart
                ttl_checked_while_running: false
                code: {issue: "internal/provider/service_dns.go:podEnv", defaults: "internal/baopki/baopki.go:DefaultLeafTTL", cache: "internal/baopki/baopki.go:EnsureAuthority"}
                evidence: ["internal/provider/live_ttl_test.go:TestPodRunTTLReapsTheRunOnRealKCP"]
                evidence_subject: denorun_reaping
                evidence_covers_certificate_lifetime: false
              root:
                openbao_namespace: "root (RootNamespace empty)"
                mount: --openbao-mount
                common_name: kcp-mesh-root
                ttl: 87600h
                key_type: unset
                role: none
                signs: intermediates_only
                paths: {namespace: sys/namespaces/<path>, mount: sys/mounts/<mount>, generate: <mount>/root/generate/internal, ca: <mount>/cert/ca, chain: <mount>/ca_chain, sign_intermediate: <mount>/root/sign-intermediate}
              intermediate:
                openbao_namespace: sc.kind.openbao.spec.namespace
                mount: --openbao-mount
                common_name: "<spec.namespace>.intermediate"
                ttl: --openbao-intermediate-ttl
                key_type: ec
                key_bits: 256
                per: openbao_object
                created_by: sc.kind.openbao
                cache_ttl: 5m
                paths: {namespace: sys/namespaces/<spec.namespace>, mount: sys/mounts/<mount>, ca: <mount>/cert/ca, chain: <mount>/ca_chain, generate: <mount>/intermediate/generate/internal, set_signed: <mount>/intermediate/set-signed, role: <mount>/roles/<role>, issue: <mount>/issue/<role>}
                role: {name: --openbao-role, allowed_domains: [--service-domain], allow_subdomains: true, allow_bare_domains: false, enforce_hostnames: true, allow_ip_sans: true, key_type: ec, key_bits: 256, max_ttl: --openbao-leaf-ttl}
              leaf: {common_name: "<name>.<ns>.<workspace labels>.svc.<service-domain>", alt_names: [common_name], ip_sans: ["127.0.0.1", "::1"], ttl: --openbao-leaf-ttl, issued_to: [sc.kind.denopod, sc.kind.denorun], when: "spec.env SERVICE_TLS=true", issuer: {kind: openbao_object, in: pod_namespace}}
        orchestrator: orch.start-openbao
        context: tb.openbao
        signs: [sc.market.openbao-global, sc.market.openbao-relay, sc.market.openbao-alice]
        optional: true
      - id: ov.living-threat-model
        contexts:
          id: tb.host
          kind: os_user
          principals: {}
          enforced_by: []
          isolation: {os_user: shared_by_all_children, filesystem: shared, setpgid: group_kill_only}
          code: ["internal/runner/pod_exec.go:Setpgid", "internal/runner/engine_exec.go:Setpgid"]
          children:
            - id: tb.kine
              kind: process
              principals: {}
              enforced_by: []
              listen: {addr: "KINE_ENDPOINT, default 127.0.0.1:23791", protocol: etcd, scheme: http, client_auth: none}
              storage: {kind: sqlite, at: "<ROOT>/kine.db"}
              code: ["deploy/start-kcp.sh:KINE_ENDPOINT"]
            - id: tb.kcp
              kind: api_server
              principals: {}
              enforced_by: [up.kcp]
              listen: {addr: "KCP_SECURE_PORT, default 6443", scheme: https, client_auth: "cred.admin-kubeconfig, cred.sa-token"}
              code: [deploy/start-kcp.sh]
              children:
                - id: tb.kcp-admin
                  kind: logical_cluster
                  workspaces: [root]
                  contains: [ov.market-workspaces, ov.runtime-workspace, ov.direct-run-workspace]
                  principals: {cred.admin-kubeconfig: [orch.install-provider, orch.demo-deno-runtime, orch.demo, orch.apply-market, orch.test-integration, orch.test-live]}
                  enforced_by: [up.kcp, cred.admin-kubeconfig]
                  code: ["deploy/install-provider.sh:KUBECONFIG_PATH", "cmd/deno-kcp-provider/main.go:BuildConfigFromFlags"]
                - id: tb.provider-workspace
                  kind: logical_cluster
                  workspaces: [root:deno-provider]
                  contains: [ov.deno-computer-api]
                  principals: {cred.admin-kubeconfig: [orch.install-provider, orch.test-integration, orch.test-live, sc.provider.watch]}
                  enforced_by: [up.kcp]
                  code: ["deploy/install-provider.sh:PROVIDER_WORKSPACE", "internal/provider/watch.go:defaultProviderWorkspace"]
                  children:
                    - id: tb.apiexport-vw
                      kind: virtual_workspace
                      contains: [ov.apiexport-vw]
                      principals: {cred.admin-kubeconfig: [sc.provider.watch]}
                      enforced_by: [ov.apiexport-vw]
                      spans: {workspaces: bound_to_export, namespaces: all}
                      code: ["internal/provider/watch.go:discoverWorkspaces", "internal/provider/watch.go:watchFactory", deploy/denoruntime-apiexport.yaml]
                - id: tb.tenant-workspace
                  kind: logical_cluster
                  workspaces: [root:runtime, root:global, root:relay, root:alice, root:demo]
                  principals:
                    cred.admin-kubeconfig: [orch.demo-deno-runtime, orch.demo, orch.apply-market, orch.test-integration, orch.test-live, sc.deno-kcp-provider]
                    cred.sa-token: [sc.demo.native-fire.script, sc.example.deno-run.script, sc.example.deno-job.script, sc.example.deno-pod.script]
                    cred.peer-tokens: [ov.kcpdns-shim]
                  enforced_by: [up.kcp, ov.deno-computer-api]
                  code: ["deploy/workspacetype-denoruntime.yaml:defaultAPIBindings", deploy/examples/atproto/market/00-workspaces.yaml]
                  children:
                    - id: tb.namespace
                      kind: namespace
                      principals: {}
                      enforced_by: [up.kcp, ov.runtime-rbac, ov.market-rbac, sc.kind.openbao]
                      code: [deploy/examples/atproto/market/10-rbac.yaml, deploy/demo-deno-runtime.sh, "internal/provider/reconcile_openbao.go:authorityFor"]
                      children:
                        - id: tb.workload
                          kind: deno_sandbox
                          runs_in: tb.host
                          contains: [ov.deno-process-launch, ov.workload-env]
                          principals: {}
                          enforced_by: [type.DenoPermissions, cred.sa-token]
                          policy_from: type.DenoPodTemplate.permissions
                          code: ["internal/denoperm/denoperm.go:Args", "internal/runner/pod_exec.go:PermissionArgs", "internal/provider/registry_runtime.go:MintServiceAccountToken"]
                          children:
                            - id: tb.child-process
                              kind: process
                              runs_in: tb.host
                              principals: {}
                              enforced_by: []
                              code: ["deploy/examples/atproto/market/20-global-plc.yaml:Deno.execPath", "deploy/examples/atproto/market/20-global-plc.yaml:childEnv", "deploy/examples/atproto/market/30-relay-relay.yaml:Deno.execPath", "deploy/examples/atproto/market/30-relay-relay.yaml:childEnv", "deploy/examples/atproto/market/40-alice-pds.yaml:Deno.execPath", "deploy/examples/atproto/market/40-alice-pds.yaml:childEnv"]
                              basis: example
                        - id: tb.policy-engine
                          kind: process
                          runs_in: tb.host
                          contains: [ov.engine-process-launch]
                          principals: {}
                          enforced_by: []
                          listen: {addr: "127.0.0.1:<free port>", protocol: policy_engine_api, scheme: http, client_auth: none}
                          code: ["internal/runner/engine_exec.go:Start", "internal/provider/reconcile_engine.go:freePort"]
            - id: tb.provider-process
              kind: process
              contains: [ov.provider-flags]
              principals: {}
              enforced_by: []
              listen: {addr: "METRICS_LISTEN, empty disables", scheme: http, client_auth: none}
              code: [cmd/deno-kcp-provider/main.go]
              children:
                - id: tb.probe
                  kind: deno_sandbox
                  runs_in: tb.host
                  principals: {}
                  enforced_by: [sc.provider.service-dns]
                  entered_when: {probe_command0: kcpdns}
                  code: ["internal/provider/kcpdns/embed.go:ProbeCommand"]
            - id: tb.openbao
              kind: vault
              contains: [ov.baopki]
              principals: {cred.openbao-token: [sc.deno-kcp-provider, orch.test-integration, tb.workload]}
              enforced_by: [cred.openbao-token]
              listen: {addr: "OPENBAO_LISTEN, default 127.0.0.1:8200", protocol: openbao_api, scheme: http, client_auth: cred.openbao-token}
              storage: {kind: memory, mode: dev, unsealed: true}
              code: {script: "deploy/start-openbao.sh:ADDR", embedded: "internal/baoembed/cmd/baoembed/main.go:devTLSCAFile", token: "internal/openbao/openbao.go:tokenHeader", tls_listener: "internal/baoembed/cmd/baoembed/main.go:tlsMode"}
              children:
                - id: tb.openbao-root
                  kind: vault_namespace
                  principals: {cred.openbao-token: [sc.deno-kcp-provider, orch.test-integration]}
                  enforced_by: [cred.openbao-token]
                  code: ["internal/baopki/baopki.go:ensureRoot"]
                  children:
                    - id: tb.openbao-namespace
                      kind: vault_namespace
                      principals: {cred.openbao-token: [sc.deno-kcp-provider]}
                      enforced_by: [cred.openbao-token, sc.kind.openbao.spec.namespace]
                      code: ["internal/baopki/baopki.go:ensureAuthority", "internal/baopki/baopki.go:Delete", "internal/openbao/openbao.go:namespaceHeader"]

        addresses:
          kcp_api:
            form: "/clusters/<logical cluster>/apis (grouped) or /clusters/<logical cluster>/api (core); the cluster segment also accepts the kcp.io/cluster id"
            written_by: [sc.deno-kcp-provider, ov.kcpdns-shim]
            read_by: [up.kcp, tb.kcp]
            precedence: ["--host or KCP_HOST", "kubeconfig cluster server, with any /clusters/ suffix stripped"]
            unresolved: "the server answers 404 NotFound"
            code: {prefix: "internal/provider/registry.go:ApiPathPrefix", base: "internal/provider/registry.go:baseHost", resource: "internal/provider/registry.go:resource", shim: "internal/provider/kcpdns/shim.ts:discover"}
          workspace_service:
            form: "<name>.<namespace|default>.<workspace labels>.svc.<service-domain>"
            written_by: [sc.provider.service-dns]
            read_by: [tb.workload, tb.probe, sc.kcpdns.probe]
            precedence: ["the kcp.io/path annotation on the workspace LogicalCluster, resolved from the kcp.io/cluster id", "--service-domain or KCP_SERVICE_DOMAIN, default kcp.local"]
            unresolved: "a failed path read is cached empty, the labels are dropped and the name becomes <name>.<namespace>.svc.<service-domain>"
            code: {fqdn: "internal/provider/service_dns.go:serviceFQDN", labels: "internal/provider/service_dns.go:serviceLabels", path: "internal/provider/cluster_path.go:lookup", default_domain: "internal/provider/service_dns.go:DefaultServiceDomain"}
          advertised_address:
            form: "<host>:<port> from a pod's own SERVICE_ARGS --port/--hostname or SERVICE_ENV PORT/HOSTNAME"
            written_by: [tb.workload]
            read_by: [sc.provider.service-dns]
            precedence: ["SERVICE_ARGS --port/--hostname", "SERVICE_ENV PORT/HOSTNAME"]
            unresolved: "no port advertised is no table entry; a blank, 0.0.0.0 or :: host becomes 127.0.0.1"
            code: {advertised: "internal/provider/service_dns.go:advertisedAddress"}
          service_dns_table:
            form: "KCP_DNS_TABLE, a JSON map of service name to host:port, looked up before the network"
            written_by: [sc.provider.service-dns]
            read_by: [ov.kcpdns-shim, sc.kcpdns.probe]
            precedence: ["KCP_DNS_TABLE", "GET <KCP_SERVER with /clusters/<target>>/apis/deno.computer/v1alpha1/namespaces/<ns>/denopods/<name>, bearer KCP_TOKENS[<target>]", "pass-through for a name outside .svc.<service-domain>"]
            unresolved: "a name inside the suffix that is absent from the table and that discovery misses throws; a WebSocket name is table-only and fails to resolve"
            code: {table: "internal/provider/service_dns.go:dnsTable", inject: "internal/provider/service_dns.go:podEnv", lookup: "internal/provider/kcpdns/shim.ts:addressFor", rewrite: "internal/provider/kcpdns/shim.ts:rewrite"}
          openbao_listener:
            form: "<scheme>://<host>:<port>, e.g. http://127.0.0.1:8200; the embedded server uses http://127.0.0.1:<free port>"
            written_by: [orch.start-openbao, orch.baoembed]
            read_by: [sc.deno-kcp-provider, tb.workload, orch.test-integration]
            precedence: ["--openbao-addr or OPENBAO_ADDR", "OPENBAO_LISTEN, default 127.0.0.1:8200", "BAOEMBED_ADDR, default 127.0.0.1:8200"]
            unresolved: "an empty address leaves workloads serving plain HTTP with no certificate"
            code: {script: "deploy/start-openbao.sh:ADDR", flag: "cmd/deno-kcp-provider/main.go:openBaoAddr", client: "internal/openbao/openbao.go:New", embedded: "internal/baoembed/cmd/baoembed/main.go:addr"}
          policy_engine:
            form: "http://127.0.0.1:<free port>"
            written_by: [sc.deno-kcp-provider]
            read_by: [sc.provider.policy-client]
            precedence: ["sc.kind.policyworkflowpod.status.endpoint", "sc.kind.policyworkflowrun.spec.engineEndpoint"]
            unresolved: "no endpoint leaves the run unadmitted with reason EngineNotReady"
            code: {free_port: "internal/provider/reconcile_engine.go:freePort", bind: "internal/runner/engine_exec.go:Start", submit: "internal/provider/policy_client.go:Submit"}
          kubeconfig_server:
            form: "https://127.0.0.1:<KCP_SECURE_PORT>, default 6443, with /clusters/<workspace> appended per request"
            written_by: [orch.start-kcp]
            read_by: [up.kubectl, sc.deno-kcp-provider, orch.install-provider, orch.apply-market]
            precedence: ["--host or KCP_HOST", "--kubeconfig or KUBECONFIG cluster server"]
            unresolved: "start-kcp refuses to run when a kcp answers on KCP_SECURE_PORT but the kubeconfig names a different port"
            code: {write: "deploy/start-kcp.sh:KCP_SECURE_PORT", port: "deploy/start-kcp.sh:kubeconfig_port", load: "cmd/deno-kcp-provider/main.go:BuildConfigFromFlags"}
          apiexport_endpoint:
            form: "<status.endpoints[].url>/clusters/*, the APIExport virtual workspace"
            written_by: [sc.kcp.apiexport-vw]
            read_by: [sc.provider.watch]
            precedence: ["apis.kcp.io/v1alpha1/apiexportendpointslices status.endpoints[].url"]
            unresolved: "the provider bounded-watches then re-lists until denoruntime and policyworkflowruns each have an endpoint"
            code: {discover: "internal/provider/watch.go:discoverWorkspaces", client: "internal/provider/watch.go:endpointSliceClient", watch: "internal/provider/watch.go:watchFactory"}
          provider_workspace:
            form: "<base host>/clusters/root:deno-provider"
            written_by: [sc.provider.watch]
            read_by: [sc.provider.watch]
            precedence: ["baseHost(Host) with the provider workspace, default root:deno-provider"]
            unresolved: "a slice list that never answers leaves the provider with no informer cache"
            code: {client: "internal/provider/watch.go:endpointSliceClient", workspace: "internal/provider/watch.go:defaultProviderWorkspace"}
          market_service:
            form: "<name>.<namespace>.<workspace label>.svc.<service-domain>, e.g. pds.default.alice.svc.kcp.local and relay.default.relay.svc.kcp.local"
            written_by: [tb.child-process, tb.workload]
            read_by: [tb.child-process, tb.workload]
            precedence: ["KCP_DNS_TABLE"]
            unresolved: "a WebSocket to a name absent from the table is passed through and fails to resolve, which is why apply.sh starts each producer before its consumer"
            code: {plc: "deploy/examples/atproto/market/20-global-plc.yaml:SERVICE_ENV", pds: "deploy/examples/atproto/market/40-alice-pds.yaml:PDS_PLC_DIRECTORY_URL", relay: "deploy/examples/atproto/market/30-relay-relay.yaml:SERVICE_ENV", crawler: "deploy/examples/atproto/market/40-alice-pds.yaml:PDS_CRAWLERS"}
          kine_endpoint:
            form: "http://127.0.0.1:23791, KINE_ENDPOINT default; kcp reaches it as --etcd-servers"
            written_by: [orch.start-kcp]
            read_by: [tb.kcp, tb.workload]
            precedence: ["KINE_ENDPOINT"]
            unresolved: "a kine that never becomes ready exits the start script 1"
            code: {endpoint: "deploy/start-kcp.sh:KINE_ENDPOINT", ready: "deploy/start-kcp.sh:kine_ready"}
          metrics_endpoint:
            form: "http://<--metrics-listen>/metrics, absent when the flag is empty"
            written_by: [sc.deno-kcp-provider]
            read_by: [tb.host]
            precedence: ["--metrics-listen or METRICS_LISTEN"]
            unresolved: "an empty flag serves nothing"
            code: {flag: "cmd/deno-kcp-provider/main.go:metricsListen", handler: "internal/provider/metrics.go:handleMetrics"}

        surfaces:
          provider-log:
            written_by: [sc.deno-kcp-provider]
            at: "<ROOT>/provider.log under a demo script, else the provider process stderr; ROOT default <repo>/.kcp-demo"
            when: demo_script_redirects_stdout_and_stderr
            contains: [startup_error, provider_stopped, watch_endpoint_wait, openbao_provision_failed, watch_reconcile_failed]
            survives: process_exit
            read_by: [orch.demo-deno-runtime, orch.demo, tb.host]
            code: {writer: "cmd/deno-kcp-provider/main.go:main", redirect: "deploy/demo-deno-runtime.sh:PROVIDER_PID", logger: "cmd/deno-kcp-provider/main.go:NewTextHandler"}
          openbao-log:
            written_by: [sc.openbao-server]
            at: "<OPENBAO_DIR>/bao.log, default <repo>/.kcp-openbao/bao.log"
            when: server_writes_stderr_at_level_warn
            contains: [openbao_server_log]
            survives: process_exit
            read_by: [tb.host]
            code: "deploy/start-openbao.sh:LOG"
          baoembed-ready:
            written_by: [sc.openbao-server]
            at: "stdout, one line prefixed BAOEMBED "
            when: development_server_answers_health
            contains: [address, token, ca_cert]
            survives: none
            read_by: [sc.test.integration-cluster]
            code: "internal/baoembed/cmd/baoembed/main.go:readyPrefix"
          metrics:
            written_by: [sc.deno-kcp-provider]
            at: "http://<--metrics-listen>/metrics, absent when the flag is empty"
            when: metrics_listen_flag_set
            contains: [denokcp_queue_depth, denokcp_cache_age_seconds, denokcp_reconciles_total, denokcp_conflicts_total, denokcp_errors_total, denokcp_reconcile_seconds, denokcp_active_runs, denokcp_max_active_runs]
            survives: none
            read_by: [tb.host]
            code: "internal/provider/metrics.go:handleMetrics"
          kcp-objects:
            written_by: [sc.deno-kcp-provider]
            at: "<workspace>/clusters/<logical cluster>/apis/deno.computer/v1alpha1"
            when: every_reconcile_that_writes_status
            contains: [status]
            survives: forever
            read_by: [tb.kcp, tb.host]
            code: "internal/provider/registry.go:resource"

        failures:
          reconcile-error:
            trigger: [decider_returns_error, watch_hook_returns_error]
            signal: [log.provider-log.watch_reconcile_failed, metric.denokcp_errors_total, requeue.rate_limited]
            alerts: []
            code: "internal/provider/watch.go:runWatchWorker"
          provider-startup-failure:
            trigger: [kubeconfig_unreadable, registry_build_failed, runner_build_failed]
            signal: [log.provider-log.startup_error, exit_code.1_or_2]
            alerts: []
            code: "cmd/deno-kcp-provider/main.go:main"
          workload-crash-loop:
            trigger: [denorun_fails_until_backoff_exceeded]
            signal: [condition.Failed.true.BackoffExceeded, phase.Failed, status.message, file.stderr.txt]
            alerts: []
            code: "internal/denorun/denorun.go:failed"
          deadline-exceeded:
            trigger: [activeDeadlineSeconds_passed]
            signal: [condition.Failed.true.DeadlineExceeded, condition.Complete.true.DeadlineExceeded, phase.Failed]
            alerts: []
            code: "internal/denorun/denorun.go:deadline"
          admitted-run-never-scheduled:
            trigger: [capacity_full, policyworkflowpod_missing, engine_not_ready]
            signal: [condition.Complete.false, phase.Pending, status.message, requeue.2s]
            alerts: []
            code: "internal/policyworkflowrun/policyworkflowrun.go:queued"
          openbao-unavailable:
            trigger: [no_openbao_addr, ensure_authority_failed]
            signal: [condition.Ready.false.NoOpenBao, condition.Ready.false.ProvisionFailed, log.provider-log.openbao_provision_failed]
            alerts: []
            code: "internal/provider/reconcile_openbao.go:reconcileOpenBao"
          openbao-ambiguous:
            trigger: [more_than_one_openbao_names_the_namespace]
            signal: [condition.Ambiguous.true.MultipleAuthorities, status.message]
            alerts: []
            code: "internal/provider/reconcile_openbao.go:reconcileOpenBao"
          engine-unreachable:
            trigger: [engine_endpoint_down, readiness_probe_failing]
            signal: [kind.policyengine.condition.Ready.false, kind.policyworkflowpod.condition.Ready.false.EngineNotReady, kind.policyworkflowrun.condition.Complete.false.EngineNotReady]
            alerts: []
            code: "internal/policyengine/policyengine.go:running"
          object-never-ready:
            trigger: [reconcile_never_succeeds_and_phase_never_terminal]
            signal: [log.provider-log.watch_reconcile_failed, metric.denokcp_errors_total, requeue.2s]
            alerts: []
            code: "internal/provider/watch.go:runWatchWorker"
          duplicate-workload-after-restart:
            trigger: [provider_crash_between_start_and_status_write]
            signal: []
            alerts: []
            risk: r.duplicate-start-after-restart
            code: "internal/provider/run_refs.go:alreadyStarted"
          dropped-delete-event:
            trigger: [informer_delete_event_not_handled]
            signal: []
            alerts: []
            risk: r.watch-delete-not-watched
            code: "internal/provider/watch.go:registerInformer"
          timed-out-workload-reads-succeeded:
            trigger: [runner_timeout_or_stop_with_exit_code_0]
            signal: [phase.Succeeded, condition.Complete.true.Complete, status.message]
            alerts: []
            risk: r.runner-timeout-reads-succeeded
            code: "internal/runner/pod_exec.go:Observe"

        credentials:
          cred.admin-kubeconfig:
            holder: [tb.host, tb.provider-process]
            grants: [tb.kcp]
            stored: [file, flag, env]
            secret: true
            issued_by: sc.kcp-local
            issued_at: cluster_start
            reissue: cluster_recreate
            renewal: none
            at: "<ROOT>/admin.kubeconfig"
            carried_as: [--kubeconfig, KUBECONFIG]
            code: {read: "deploy/start-kcp.sh:kubeconfig_port", loaded: "cmd/deno-kcp-provider/main.go:BuildConfigFromFlags", used: ["internal/provider/registry.go:resource", "internal/provider/watch.go:watchFactory"], test: "test/integration/fixture_test.go:BuildConfigFromFlags"}
          cred.openbao-token:
            holder: [tb.host, tb.provider-process, tb.workload]
            grants: [tb.openbao]
            stored: [flag, env]
            secret: true
            issued_by: orch.start-openbao
            issued_at: server_start
            reissue: server_restart
            renewal: none
            ttl: {never: true}
            default: root
            carried_as: [--openbao-token, OPENBAO_TOKEN, X-Vault-Token, -root-token, BAOEMBED_ROOT_TOKEN]
