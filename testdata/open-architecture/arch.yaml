              spawns: {bin: Deno.execPath(), argv: [run, -A, "<--preload KCP_SHIM, when set>", "<SERVICE_DENO_FLAGS>", "<SERVICE_ENTRY>", "<SERVICE_ARGS>", "<--tls-cert-file tls.crt --tls-key-file tls.key, when cert and key>"], cwd: SERVICE_CWD, env: {base: launcher_env, adds: [PATH, HOME, SERVICE_ENV], sets: {DENO_CERT: ca.pem}, when: KCP_CA_BUNDLE}}
