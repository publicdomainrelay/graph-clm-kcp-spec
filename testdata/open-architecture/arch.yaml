              into: ["<run dir>/main.ts", "<run dir>/deno.json", "<run dir>/deno.lock", "process env"]
              omits: [sc.kind.denopod.spec.serviceAccount, sc.kind.denopod.spec.restartPolicy, sc.kind.denopod.spec.readinessProbe, sc.kind.denopod.spec.livenessProbe, sc.kind.denopod.spec.activeDeadlineSeconds, sc.kind.denopod.spec.ttlSecondsAfterFinished]
              auth: none
              gate: [type.DenoPermissions]
              route: "local exec: <deno-bin> run <permission args> main.ts in <runs-dir>/<run id>"
              code: ["internal/runner/pod_exec.go:Start", "internal/denoperm/denoperm.go:Validate"]
            x.environ-leak:
              from: tb.provider-process
              to: tb.workload
              carries: [cred.openbao-token, cred.admin-kubeconfig]
              into: ["process env"]
              auth: none
              gate: []
              when: ["OPENBAO_TOKEN in the provider's env", "KUBECONFIG in the provider's env"]
              route: "local exec: the pod process inherits the provider's os.Environ()"
              code: ["internal/runner/pod_exec.go:os.Environ"]
            x.pod-probe-exec:
              from: tb.provider-process
              to: tb.host
              carries: [type.ExecProbe.command, ov.workload-env]
              auth: none
              gate: []
              route: {command0_kcpdns: sc.kcpdns.probe, otherwise: exec_command0_as_provider_user}
              code: ["internal/provider/reconcile_pod.go:runProbe", "internal/provider/service_dns.go:probeCommand", "internal/runner/pod_exec.go:Probe"]
          sc.runner.exec-engine:
            x.engine-spawn:
              from: tb.provider-process
              to: tb.policy-engine
              carries: [sc.kind.policyengine.spec.env, cred.openbao-token]
              into: ["process env"]
              omits: [sc.kind.policyengine.spec.permissions]
              auth: none
              gate: []
              route: "local exec: <deno-bin> run --allow-all main.ts api --bind 127.0.0.1:<free port> in <policy-engine-dir>"
              code: ["internal/runner/engine_exec.go:Start", "internal/runner/engine_exec.go:os.Environ"]
            x.engine-probe-exec:
              from: tb.provider-process
              to: tb.host
              carries: [type.ExecProbe.command]
              auth: none
              gate: []
              route: "local exec: the probe command in the engine run directory"
              code: ["internal/provider/reconcile_engine.go:runEngineProbe", "internal/runner/engine_exec.go:Probe"]
          sc.workload.deno-process:
            x.loopback-kine:
              from: tb.workload
              to: tb.kine
              carries: []
              returns: [sc.kine-local]
              auth: none
              gate: [type.DenoPermissions.net]
              route: "http://127.0.0.1:23791 (KINE_ENDPOINT default)"
              code: ["deploy/start-kcp.sh:KINE_ENDPOINT"]
            x.loopback-openbao:
              from: tb.workload
              to: tb.openbao
              carries: []
              returns: [cred.root-ca-key, cred.intermediate-ca-key]
              auth: cred.openbao-token
              gate: [type.DenoPermissions.net]
              route: "http://127.0.0.1:8200 (OPENBAO_LISTEN default)"
              code: ["deploy/start-openbao.sh:TOKEN"]
          ov.kcpdns-shim:
            x.peer-discovery:
              from: tb.workload
              to: tb.tenant-workspace
              carries: []
              returns: [sc.kind.denopod]
              auth: cred.peer-tokens
              gate: [ov.market-rbac]
              route: "KCP_SERVER with /clusters/<peer workspace>, bearer KCP_TOKENS[<peer workspace>]"
              code: ["internal/provider/kcpdns/shim.ts:discover"]
            x.workload-tls:
              from: tb.workload
              to: tb.workload
              carries: [flow.market-e2e]
              auth: cred.leaf-key
              gate: [ov.baopki]
              route: "service name rewritten to host:port from KCP_DNS_TABLE; TLS name checked: 127.0.0.1 SAN"
              code: ["internal/provider/kcpdns/shim.ts:rewrite"]
          sc.market.pds.service:
            x.pds-register-did:
              from: tb.child-process
              to: tb.child-process
              carries: [flow.market-e2e]
              auth: none
              gate: []
              when: [createAccount]
              route: "https://plc.default.global.svc.kcp.local, resolved through the kcpdns shim"
              code: ["deploy/examples/atproto/market/40-alice-pds.yaml:PDS_PLC_DIRECTORY_URL"]
            x.pds-request-crawl:
              from: tb.child-process
              to: tb.child-process
              carries: [flow.market-e2e]
              auth: none
              gate: []
              when: [first_write]
              route: "https://relay.default.relay.svc.kcp.local, resolved through the kcpdns shim"
              code: ["deploy/examples/atproto/market/40-alice-pds.yaml:PDS_CRAWLERS"]
          sc.market.relay.service:
            x.relay-subscribe-repos:
              from: tb.child-process
              to: tb.child-process
              carries: [flow.market-e2e]
              auth: none
              gate: []
              route: "wss://<PDS fqdn>/xrpc/com.atproto.sync.subscribeRepos, table only"
              code: ["deploy/examples/atproto/market/apply.sh:WebSocket", "deploy/examples/atproto/market/README.md:subscribes"]
          sc.market.verifier.check:
            x.verifier-create-account:
              from: tb.workload
              to: tb.child-process
              carries: [flow.market-e2e]
              auth: none
              gate: []
              route: "https://pds.default.alice.svc.kcp.local/xrpc/com.atproto.server.createAccount"
              code: ["deploy/examples/atproto/market/50-verifier.yaml:createAccount"]
            x.verifier-create-record:
              from: tb.workload
              to: tb.child-process
              carries: [flow.market-e2e]
              auth: cred.pds-access-jwt
              gate: []
              route: "https://pds.default.alice.svc.kcp.local/xrpc/com.atproto.repo.createRecord"
              code: ["deploy/examples/atproto/market/50-verifier.yaml:authorization"]
            x.verifier-read-did:
              from: tb.workload
              to: tb.child-process
              carries: [flow.market-e2e]
