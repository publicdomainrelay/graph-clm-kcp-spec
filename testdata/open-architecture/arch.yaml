$schema: arch.schema.json
apiVersion: open-architecture.dffml.github.io/v0alpha1
kind: OpenArchitecture
metadata:
  name: deno-kcp
  repo: github.com/johnandersen777/deno-kcp
  generated: 2026-09-28
  root: sc.deno-kcp
  axes:
    trust_boundaries: {prefix: tb}
    systems: {section: system_contexts}
    services: {suffix: ".service"}
    concepts: {prefix: [sc.kind, type]}
  format: oa
  layout: "system_contexts: list of trees read upstream to downstream; the first is the repo, the rest are downstream contexts (the examples, then the test tiers: the unit double, the integration cluster, the live cluster) with upstream sc.deno-kcp. A child is inline (with id) where first used, an id ref elsewhere. Overlay without target applies to the enclosing upstream. An instance = {upstream: kind, overlay: [its example manifest {id, manifest, data}, inner contexts], orchestrator: what runs it}; inner contexts ref that manifest overlay. An upstream that is a document or code in this repo is inline (the manifest itself); runtime names what executes it. context = execution context (tb.*), defined with credentials, crossings and risks in ov.living-threat-model."
  roots: [orch.test, orch.test-race]
  src:
    oa: https://github.com/dffml/dffml/blob/main/docs/arch/0009-Open-Architecture.rst
    pki: docs/OPENBAO_PKI.md
    adr_0001: docs/adrs/0001-cancel-policy-workflow-runs.md
    adr_0002: docs/adrs/0002-native-run-admission.md
    adr_0003: docs/adrs/0003-event-driven-reconcile-loop.md

upstreams:
  up.kcp: {repo: https://github.com/kcp-dev/kcp, bin: kcp, pin: {by: binary_on_path, override: KCP_BIN, preflight: path_only}, go_sdk: github.com/kcp-dev/sdk@v0.33.1, executes: [deploy/start-kcp.sh:KCP_BIN]}
  up.kine: {repo: https://github.com/k3s-io/kine, bin: kine, pin: {by: binary_on_path, override: KINE_BIN, preflight: path_only}, executes: [deploy/start-kcp.sh:KINE_BIN]}
  up.kubernetes: {modules: [k8s.io/api@v0.36.4, k8s.io/apimachinery@v0.36.4, k8s.io/client-go@v0.36.4, sigs.k8s.io/yaml@v1.6.0], pin: {by: go_mod, source: "go.mod:7"}, executes: [cmd/deno-kcp-provider/main.go:clientcmd]}
  up.kubectl: {bin: kubectl, pin: {by: binary_on_path, override: KUBECTL, preflight: path_only}, executes: [deploy/install-provider.sh:KUBECTL, internal/provider/live_helpers_test.go:kubectlTry]}
  up.deno: {bin: deno, pin: {by: binary_on_path, override: DENO_BIN, preflight: path_only}, executes: [internal/runner/pod_exec.go:DenoBin]}
  up.go: {version: "1.26.0", pin: {by: go_mod, source: "go.mod:3"}, executes: [Makefile:GO]}
  up.openbao: {repo: https://github.com/openbao/openbao, path: third_party/openbao, go: "1.27.0", pin: {by: git_submodule, rev: v2.7.0, commit: ca305a02daa68b203325daa1b25c18d7a252d4b3, override: BAO_BIN, order: [BAO_BIN, bao_on_path, submodule_build]}, executes: [internal/baoembed/cmd/baoembed/main.go:command.Run]}
  up.policy-engine: {path: ../policy-engine/lib/policy-engine-server-gha-lite, entry: main.ts, lang: typescript, pin: {by: sibling_path, override: POLICY_ENGINE_DIR}, executes: [internal/runner/engine_exec.go:DenoBin, cmd/deno-kcp-provider/main.go:policyEngineDir]}
  up.gha-lite-bundled-actions: {path: "<policy-engine-dir>/../policies/gha-lite/bundled-actions", pin: {by: sibling_path, override: BUNDLED_ACTIONS_DIR}, executes: [cmd/deno-kcp-provider/main.go:bundledActionsDir]}
  up.hono-plc: {path: ../atproto-market/hono-plc, entry: mod.ts, lang: typescript, pin: {by: sibling_path}, executes: [deploy/examples/atproto/market/20-global-plc.yaml:SERVICE_ENTRY, deploy/examples/atproto/market/apply.sh:ORG_ROOT]}
  up.hono-pds: {path: ../hono-pds, entry: main.ts, lang: typescript, pin: {by: sibling_path}, executes: [deploy/examples/atproto/market/40-alice-pds.yaml:SERVICE_ENTRY, deploy/examples/atproto/market/apply.sh:ORG_ROOT]}
  up.hono-atproto-relay: {path: ../atproto-relay/hono-atproto-relay, entry: mod.ts, lang: typescript, pin: {by: sibling_path}, executes: [deploy/examples/atproto/market/30-relay-relay.yaml:SERVICE_ENTRY, deploy/examples/atproto/market/apply.sh:ORG_ROOT]}

orchestrators:
  orch.start-kcp: {path: deploy/start-kcp.sh, state: .kcp/, stop: deploy/stop-kcp.sh, stop_state: .kcp-demo/}
  orch.start-openbao: {path: deploy/start-openbao.sh, bin: {order: [BAO_BIN, bao_on_path, submodule_build]}, state: .kcp-openbao/, env: [BAO_BIN, OPENBAO_DIR, OPENBAO_LISTEN, OPENBAO_TOKEN], cmd: "\"$BIN\" server -dev -dev-root-token-id=\"$TOKEN\" -dev-listen-address=\"$ADDR\" -log-level=warn", detached: nohup, ready: "\"$BIN\" status -address=http://$ADDR, polled 120x1s", already_up: pidfile_alive}
  orch.baoembed: {path: internal/baoembed/cmd/baoembed, module: internal/baoembed, imports: github.com/openbao/openbao/v2/internal/command, builds: up.openbao, use: live_tests, used_by: test/integration/bao_test.go, requires: [up.go], env: [BAOEMBED_ADDR, BAOEMBED_ROOT_TOKEN, BAOEMBED_TLS, BAOEMBED_TLS_DIR], cmd: ["baoembed -addr <BAOEMBED_ADDR, default 127.0.0.1:8200> -root-token <BAOEMBED_ROOT_TOKEN, default root>", "baoembed -tls -tls-dir <BAOEMBED_TLS_DIR>"], ready: "BAOEMBED <json address, token, ca_cert>, after /v1/sys/health answers"}
  orch.install-provider: {path: deploy/install-provider.sh, env: [PROVIDER_WORKSPACE, KUBECONFIG_PATH, WAIT_SECONDS], requires: [up.kubectl]}
  orch.demo-deno-runtime: {path: deploy/demo-deno-runtime.sh, state: [.kcp-demo/, runs/], composes: [orch.start-kcp, orch.install-provider], sets_env: {ROOT: .kcp-demo, KCP_SECURE_PORT: "16443", KINE_ENDPOINT: "http://127.0.0.1:23791"}, workspace: {env: WORKSPACE, default: runtime}, requires: [up.kubectl, up.go]}
  orch.demo: {path: deploy/demo.sh, state: [.kcp-demo/, runs/], composes: [orch.start-kcp, orch.install-provider], sets_env: {ROOT: .kcp-demo, KCP_SECURE_PORT: "16444", KINE_ENDPOINT: "http://127.0.0.1:23792"}, workspace: root:demo, requires: [up.kubectl, up.go]}
  orch.apply-market: {path: deploy/examples/atproto/market/apply.sh, composes: [orch.start-openbao], env: [KUBECONFIG, ORG_ROOT, KUBECTL, WAIT_SECONDS, KEY_FILE, PDS_PRIVATE_KEY_HEX, START_OPENBAO, OPENBAO_LISTEN, KCACHE], per_workspace: [10-rbac.yaml, 15-openbao-<ws>.yaml], requires: [up.kubectl]}
  orch.market-readme:
    path: deploy/examples/atproto/market/README.md
    composes: [orch.start-kcp, orch.install-provider, orch.start-openbao, orch.apply-market]
    cmd: ["go build -o deno-kcp-provider ./cmd/deno-kcp-provider", "RUNS_DIR=$PWD/runs ./deno-kcp-provider --kubeconfig=$KUBECONFIG --openbao-addr http://127.0.0.1:8200 --openbao-token root &"]
    requires: [up.go, up.kubectl]
  orch.livegate: {path: internal/livegate, env: DENO_KCP_REQUIRE_LIVE, funcs: [RequiresLive, Require, Short], decides: {"1": fatal, other: skip}, used_by: [test/integration/fixture_test.go, test/integration/bao_test.go, internal/provider/live_helpers_test.go, internal/provider/live_denoruntime_test.go, internal/provider/live_denojob_drain_test.go, internal/provider/live_maxconcurrent_test.go, internal/provider/live_native_admission_test.go, internal/provider/live_ttl_test.go]}
  orch.preflight: {path: Makefile, target: preflight, requires: [up.kcp, up.kine, up.deno, up.policy-engine], cmd: "command -v each of $(LIVE_PREREQS); test -d $(POLICY_ENGINE_DIR)", fails: "exit 1 naming every missing binary and the policy-engine checkout"}
  orch.preflight-integration: {path: Makefile, target: preflight-integration, cmd: "test -d test/integration", fails: "exit 1 when test/integration is absent, so make test cannot pass having skipped the tier"}
  orch.test-race: {path: Makefile, target: test-race, cmd: "go test -race -count=1 ./...", requires: [up.go], gate: orch.livegate, cluster: none, fails: "go test exit status; a live test under ./... skips through the gate", tests: [api, internal, cmd, test]}
  orch.test-integration: {path: Makefile, target: test-integration, needs: [preflight, preflight-integration], cmd: "go test -v ./test/integration/", sets_env: {DENO_KCP_REQUIRE_LIVE: "1"}, requires: [up.go, up.kcp, up.kine, up.deno, up.policy-engine, up.gha-lite-bundled-actions], gate: orch.livegate, cluster: own, fails: "go test exit status; a missing live prerequisite is fatal through the gate", composes: [orch.preflight, orch.preflight-integration, orch.baoembed], tests: test/integration}
  orch.test-live: {path: Makefile, target: test-live, needs: [preflight, preflight-kubectl], cmd: "go test -p 1 -count=1 ./...", sets_env: {DENO_KCP_REQUIRE_LIVE: "1"}, requires: [up.go, up.kcp, up.kine, up.deno, up.kubectl, up.policy-engine, up.gha-lite-bundled-actions], gate: orch.livegate, cluster: own, fails: "go test exit status; a missing live prerequisite is fatal through the gate", composes: [orch.preflight, {id: orch.preflight-kubectl, path: Makefile, target: preflight-kubectl, requires: [up.kubectl], cmd: "command -v kubectl", fails: "exit 1, saying test-integration needs no kubectl"}, orch.baoembed], tests: [internal/provider, test/integration]}
  orch.test:
    path: Makefile
    target: test
    needs: [check, preflight-integration, test-live]
    cluster: own
    fails: "the first prerequisite target that exits non-zero"
    composes:
      - {id: orch.make-check, path: Makefile, target: check, needs: [fmt, vet, tidy], cmd: ["gofmt -l $(git ls-files '*.go')", "go vet ./...", "go mod tidy -diff"], requires: [up.go]}
      - orch.preflight-integration
      - orch.test-live

types:
  type.DenoPodTemplate:
    fields: [denoJson, denoLock, script, permissions, serviceAccount, apiServer, env]
    required: [script]
    field_types: {denoJson: "runtime.RawExtension", permissions: type.DenoPermissions, serviceAccount: type.ServiceAccountRef, env: "map[string]string"}
    zero_default: true
    code: api/v1alpha1/types_shared.go
  type.DenoPermissions:
    fields: [all, noPrompt, hrtime, read, write, net, env, run, ffi, sys, import, ignoreEnv, allowScripts]
    permission: {type: DenoPermission, fields: [allow, allowList, deny, denyList], used_by: [read, write, net, env, run, ffi, sys, import, ignoreEnv]}
    gate: internal/denoperm
    validate: {rejects: [empty_value, comma_in_value, ignoreEnv.allow, ignoreEnv.deny], code: "internal/denoperm/denoperm.go:Validate"}
    held_by: [sc.kind.policyengine.spec.permissions]
    zero_default: true
    default: no_flags
    code: api/v1alpha1/types_shared.go
  type.ServiceAccountRef:
    fields: [name, namespace]
    held_by: [sc.kind.policyengine.spec.serviceAccount]
    default: no_token
    defaults: {namespace: default}
    code: {type: api/v1alpha1/types_shared.go, default: internal/provider/registry_runtime.go:DefaultServiceAccountNamespace, absent: api/v1alpha1/deno_types_test.go:TestServiceAccountAbsentDistinguishesFromZero}
  type.ExecProbe:
    fields: [command, periodSeconds, failureThreshold, timeoutSeconds]
    held_by: [sc.kind.denopod.spec.readinessProbe, sc.kind.denopod.spec.livenessProbe, sc.kind.policyengine.spec.readinessProbe, sc.kind.policyengine.spec.livenessProbe]
    defaults: {failureThreshold: "3", timeoutSeconds: "5s"}
    unread: [periodSeconds]
    code: {type: api/v1alpha1/types_shared.go, defaults: [internal/provider/provider_runtime.go:thresholdOf, internal/provider/provider_runtime.go:DefaultProbeTimeout]}
  type.DenoRestartPolicy:
    enum: [Always, OnFailure, Never]
    held_by: [sc.kind.denopod.spec.restartPolicy, sc.kind.policyengine.spec.restartPolicy]
    default: Always
    code: {type: api/v1alpha1/types_shared.go, default: [internal/denopod/denopod.go:Reconcile, internal/policyengine/policyengine.go:Reconcile]}
  type.conditions:
    enum: [Ready, Complete, Failed, Suspended, Cancelled]
    held_by: [sc.kind.denopod.status.conditions, sc.kind.denorun.status.conditions, sc.kind.denojob.status.conditions, sc.kind.policyengine.status.conditions, sc.kind.policyworkflowpod.status.conditions, sc.kind.policyworkflowrun.status.conditions, sc.kind.runtrigger.status.conditions]
    code: api/v1alpha1/types_shared.go

system_contexts:

  - id: sc.deno-kcp
    upstream:
      id: sc.kcp-local
      upstream: up.kcp
      overlay:
        - id: ov.kcp-local-config
          source: deploy/start-kcp.sh
          data:
            secure_port: {env: KCP_SECURE_PORT, default: 6443}
            bind_address: 127.0.0.1
            feature_gates: {env: KCP_FEATURE_GATES, default: [WorkspaceMounts=true]}
            etcd_servers: {env: KINE_ENDPOINT, default: "http://127.0.0.1:23791"}
            root_directory: {env: ROOT, default: "$PWD/.kcp"}
            bin: {env: KCP_BIN, default: kcp}
            writes_under_root: {kcp: [admin.kubeconfig], script: [kcp.log, kcp.pid]}
            used_by_scripts: [admin.kubeconfig]
            ready_if: ["<ROOT>/admin.kubeconfig exists", "GET https://127.0.0.1:<secure_port>/readyz succeeds"]
            refuses: [kcp_on_port_but_kubeconfig_names_other_port, kcp_on_port_without_kubeconfig]
        - id: sc.kine-local
          upstream: up.kine
          overlay:
            - {id: ov.kine-sqlite, source: deploy/start-kcp.sh, data: {endpoint: "sqlite://$ROOT/kine.db", listen: {env: KINE_ENDPOINT, default: 127.0.0.1:23791}, bin: {env: KINE_BIN, default: kine}, metrics_bind_address: "0", writes_under_root: {kine: [kine.db], script: [kine.log, kine.pid]}, started_if: port_not_answering}}
          orchestrator: orch.start-kcp
          context: tb.kine
      orchestrator: orch.start-kcp
      context: tb.kcp
    overlay:
      - id: ov.deno-computer-api
        source: deploy/install-provider.sh
        applied_by: orch.install-provider
        data:
          workspace: {path: root:deno-provider, env: PROVIDER_WORKSPACE, type: root:universal}
          install:
            - sc.kind.policyworkflowrun
            - {apiexport: policyworkflowruns, file: deploy/policyworkflowrun-apiexport.yaml}
            - sc.kind.denopod
            - sc.kind.denorun
            - sc.kind.denojob
            - sc.kind.runtrigger
            - sc.kind.policyengine
            - sc.kind.policyworkflowpod
            - sc.kind.openbao
            - {apiexport: denoruntime, file: deploy/denoruntime-apiexport.yaml}
            - {workspacetype: workflow, in: root, file: deploy/workspacetype-workflow.yaml, extends: [root:universal], default_bindings: [root:deno-provider:policyworkflowruns]}
            - {workspacetype: denoruntime, in: root, file: deploy/workspacetype-denoruntime.yaml, extends: [root:workflow, root:universal], default_bindings: [root:deno-provider:policyworkflowruns, root:deno-provider:denoruntime]}
          ready_when: {apiexport_condition: IdentityValid=True, order: [policyworkflowruns, denoruntime], timeout_env: WAIT_SECONDS}
      - id: sc.kind.denopod
        upstream:
          manifest: deploy/denopod-apiresourceschema.yaml
          types: api/v1alpha1/types_denopod.go
          api: {group: deno.computer, version: v1alpha1, kind: DenoPod, resource: denopods, schema: v1alpha1-3.denopods.deno.computer, export: denoruntime, scope: Namespaced, short: dpod}
          spec: [restartPolicy, readinessProbe, livenessProbe, activeDeadlineSeconds, ttlSecondsAfterFinished]
          embeds: type.DenoPodTemplate
          status: [phase, runID, restarts, startTime, completionTime, exitCode, message, outputs, ready, conditions]
          field_types: {restartPolicy: type.DenoRestartPolicy, readinessProbe: type.ExecProbe, livenessProbe: type.ExecProbe, conditions: type.conditions}
          phases: [Pending, Running, Succeeded, Failed]
          unset_phases: [Pending]
          conditions: [Ready, Complete, Failed]
          condition_facts:
            Ready: {by: internal/denopod/denopod.go:Reconcile, true_reasons: [Ready], false_reasons: [Starting, NotReady, Terminating, Terminal, DeadlineExceeded, LivenessProbeFailed, Restarting, Complete, ProcessFailed]}
            Complete: {by: internal/denopod/denopod.go:Reconcile, true_reasons: [Complete], false_reasons: [Running, ProcessFailed]}
            Failed: {by: internal/denopod/denopod.go:Reconcile, true_reasons: [DeadlineExceeded]}
          status_facts:
            phase: {by: internal/denopod/denopod.go:Reconcile, when: on_start, decides: self}
            runID: {by: internal/denopod/denopod.go:Reconcile, when: on_start, decides: none}
            restarts: {by: internal/denopod/denopod.go:Reconcile, when: on_restart, decides: none}
            startTime: {by: internal/denopod/denopod.go:Reconcile, when: on_start, decides: none}
            completionTime: {by: internal/denopod/denopod.go:Reconcile, when: on_exit, decides: none}
            exitCode: {by: internal/denopod/denopod.go:Reconcile, when: on_exit, decides: none}
            message: {by: internal/denopod/denopod.go:Reconcile, when: on_exit, decides: none}
            outputs: {by: internal/denopod/denopod.go:Reconcile, when: on_exit, decides: none}
            ready: {by: internal/denopod/denopod.go:Reconcile, when: on_running, decides: Ready, also: conditions}
            conditions: {by: internal/denopod/denopod.go:Reconcile, when: on_every_pass, decides: self}
          finalizer: {name: denopod.deno.computer/run, set_by: [manifest], code: ["api/v1alpha1/types_denopod.go:FinalizerDenoPod", "internal/provider/registry_pod.go:RemovePodFinalizer"]}
        overlay: []
        orchestrator: sc.deno-kcp-provider
        context: tb.provider-workspace
        axis: long_running
        code: {logic: internal/denopod, registry: internal/provider/registry_pod.go}
      - id: sc.kind.policyengine
        upstream:
          manifest: deploy/policyengine-apiresourceschema.yaml
          types: api/v1alpha1/types_policyengine.go
          api: {group: deno.computer, version: v1alpha1, kind: PolicyEngine, resource: policyengines, schema: v1alpha1-2.policyengines.deno.computer, export: denoruntime, scope: Namespaced, short: peng}
          spec: [denoJson, denoLock, permissions, serviceAccount, env, restartPolicy, readinessProbe, livenessProbe]
          status: [phase, runID, endpoint, restarts, ready, startTime, completionTime, message, conditions]
          field_types: {denoJson: "runtime.RawExtension", permissions: type.DenoPermissions, serviceAccount: type.ServiceAccountRef, env: "map[string]string", restartPolicy: type.DenoRestartPolicy, readinessProbe: type.ExecProbe, livenessProbe: type.ExecProbe, conditions: type.conditions}
          phases: [Pending, Running, Failed]
          unset_phases: [Pending]
          conditions: [Ready]
          condition_facts:
            Ready: {by: internal/policyengine/policyengine.go:Reconcile, true_reasons: [Ready], false_reasons: [Starting, LivenessProbeFailed, NotReady, Terminating, Restarting, ProcessExited]}
          status_facts:
            phase: {by: internal/policyengine/policyengine.go:Reconcile, when: on_start, decides: self}
            runID: {by: internal/policyengine/policyengine.go:Reconcile, when: on_start, decides: none}
            endpoint: {by: internal/policyengine/policyengine.go:Reconcile, when: on_ready, decides: Ready}
            restarts: {by: internal/policyengine/policyengine.go:Reconcile, when: on_restart, decides: none}
            ready: {by: internal/policyengine/policyengine.go:Reconcile, when: on_ready, decides: Ready, also: conditions}
            startTime: {by: internal/policyengine/policyengine.go:Reconcile, when: on_start, decides: none}
            completionTime: {by: internal/policyengine/policyengine.go:Reconcile, when: on_exit, decides: none}
            message: {by: internal/policyengine/policyengine.go:Reconcile, when: on_restart, decides: none}
            conditions: {by: internal/policyengine/policyengine.go:Reconcile, when: on_every_pass, decides: Ready}
          finalizer: {name: policyengine.deno.computer/run, set_by: [manifest], code: ["api/v1alpha1/types_policyengine.go:FinalizerPolicyEngine", "internal/provider/registry_engine.go:RemoveEngineFinalizer"]}
        overlay: []
        orchestrator: sc.deno-kcp-provider
        context: tb.provider-workspace
        axis: long_running
        binds: up.policy-engine
        code: {logic: internal/policyengine, registry: internal/provider/registry_engine.go}
      - id: sc.kind.policyworkflowpod
        upstream:
          manifest: deploy/policyworkflowpod-apiresourceschema.yaml
          types: api/v1alpha1/types_policyworkflowpod.go
          api: {group: deno.computer, version: v1alpha1, kind: PolicyWorkflowPod, resource: policyworkflowpods, schema: v1alpha1-5.policyworkflowpods.deno.computer, export: denoruntime, scope: Namespaced, short: pwpod}
          spec: [workflow, inputs, args, perspective, selfDid, policyEngine, concurrencyPolicy, maxConcurrent, runTTLSecondsAfterFinished]
          status: [phase, endpoint, active, conditions]
          field_types: {workflow: "runtime.RawExtension", inputs: "map[string]string", args: "map[string]string", concurrencyPolicy: {id: type.ConcurrencyPolicy, enum: [Allow, Forbid, Replace], default: Forbid, code: {type: api/v1alpha1/types_shared.go, default: internal/provider/admission.go:buildPodAdmissions}}, conditions: type.conditions}
          refs: {policyEngine: sc.kind.policyengine}
          phases: [Pending, Running, Failed]
          conditions: [Ready]
          condition_facts:
            Ready: {by: internal/policyworkflowpod/policyworkflowpod.go:Reconcile, true_reasons: [Ready], false_reasons: [EngineNotReady]}
          status_facts:
            phase: {by: internal/policyworkflowpod/policyworkflowpod.go:Reconcile, when: on_every_pass, decides: self}
            endpoint: {by: internal/policyworkflowpod/policyworkflowpod.go:Reconcile, when: on_ready, decides: Ready}
            active: {by: internal/policyworkflowpod/policyworkflowpod.go:Reconcile, when: on_every_pass, decides: none}
            conditions: {by: internal/policyworkflowpod/policyworkflowpod.go:Reconcile, when: on_every_pass, decides: Ready}
        overlay: []
        orchestrator: sc.deno-kcp-provider
        context: tb.provider-workspace
        axis: long_running
        code: {logic: internal/policyworkflowpod, registry: internal/provider/registry_workflowpod.go}
      - id: sc.kind.policyworkflowrun
        upstream:
          manifest: deploy/policyworkflowrun-apiresourceschema.yaml
          types: api/v1alpha1/types_policyworkflowrun.go
          api: {group: deno.computer, version: v1alpha1, kind: PolicyWorkflowRun, resource: policyworkflowruns, schema: v1alpha1-4.policyworkflowruns.deno.computer, export: policyworkflowruns, scope: Namespaced, short: pwr}
          spec: [workflow, inputs, args, perspective, selfDid, policyWorkflowPod, engineEndpoint, suspend, cancel, backoffLimit, activeDeadlineSeconds, ttlSecondsAfterFinished]
          status: [phase, runID, startTime, completionTime, active, succeeded, failed, retries, exitStatus, outputs, conditions]
          field_types: {workflow: "runtime.RawExtension", inputs: "map[string]string", args: "map[string]string", conditions: type.conditions}
          refs: {policyWorkflowPod: sc.kind.policyworkflowpod, engineEndpoint: sc.kind.policyengine.status.endpoint}
          phases: [Pending, Running, Succeeded, Failed, Cancelled]
          conditions: [Cancelled, Complete, Failed, Suspended]
          condition_facts:
            Cancelled: {by: internal/policyworkflowrun/policyworkflowrun.go:Reconcile, true_reasons: [Cancelled, Deleted]}
