      - id: sc.deno-kcp-provider
        upstream:
          code: {bin: cmd/deno-kcp-provider, pkgs: [internal/provider, internal/runner, internal/denoperm, internal/denopod, internal/denorun, internal/denojob, internal/policyengine, internal/policyworkflowpod, internal/policyworkflowrun, internal/trigger, internal/openbao, internal/baopki, internal/provider/kcpdns]}
          libs: [up.kubernetes, up.kcp]
          reconcile:
            reconcilers:

              rec.policyengine:
                kind: sc.kind.policyengine
                mode: reconcile
                reads:
                  sc.kind.policyengine.spec: {fields: [env, restartPolicy, readinessProbe, livenessProbe], from: [applied]}
                  sc.kind.policyengine.status: {fields: [phase, runID, endpoint, restarts, ready, startTime, completionTime, message, conditions], from: [{rec: rec.policyengine, wake: [informer]}]}
                unread: [denoJson, denoLock, permissions, serviceAccount]
                writes: [sc.kind.policyengine.status]
                runner: sc.runner.exec-engine
                target: sc.workload.engine-process
                crossings: [x.engine-spawn, x.engine-probe-exec, x.engine-health]
                rules:
                  readiness: {with_probe_command: x.engine-probe-exec, without: x.engine-health, health_get: "<status.endpoint>/health", health_timeout: 2s, ready_if_status_below: 400, exec_probe_timeout: {from: spec.probe.timeoutSeconds, default: 5s}}
                  liveness: {threshold_from: spec.livenessProbe.failureThreshold, default_threshold: 3, on_exceed: {reason: LivenessProbeFailed, op: stop-engine, phase: Running, increments: status.restarts}}
                  exit: {gone: {default_restart_policy: Always, restart_policy_never: {phase: Failed, reason: ProcessExited}, otherwise: restart}, exit_code: unread, message: "runner wait error"}
                  restart: {clears: status.runID, increments: status.restarts, stops_running_process: true, phase: Running}
                code: {reconcile: "internal/provider/reconcile_engine.go:reconcileEngine", decide: "internal/policyengine/policyengine.go:Reconcile", probes: "internal/provider/reconcile_engine.go:observeEngineProbes"}

              rec.policyworkflowpod:
                kind: sc.kind.policyworkflowpod
                mode: reconcile
                reads:
                  sc.kind.policyworkflowpod.spec: {fields: [policyEngine], from: [applied]}
                  sc.kind.policyengine.status: {fields: [ready, endpoint], from: [{rec: rec.policyengine, wake: [requeue-policyworkflowpod]}]}
                  sc.kind.policyworkflowrun.spec: {fields: [policyWorkflowPod], from: [applied], scope: namespace}
                  sc.kind.policyworkflowrun.status: {fields: [phase], from: [{rec: rec.policyworkflowrun, wake: [direct-queued-runs, requeue-policyworkflowpod]}], scope: namespace}
                  sc.kind.policyworkflowpod.status: {fields: [phase, endpoint, active, conditions], from: [{rec: rec.policyworkflowpod, wake: [informer]}]}
                unread: [args, perspective, selfDid]
                writes: [sc.kind.policyworkflowpod.status]
                runner: sc.deno-kcp-provider
                code: {reconcile: "internal/provider/reconcile_workflowpod.go:reconcileWorkflowPod", decide: "internal/policyworkflowpod/policyworkflowpod.go:Reconcile"}

              rec.policyworkflowrun:
                kind: sc.kind.policyworkflowrun
                mode: reconcile
                reads:
                  sc.kind.policyworkflowrun.spec: {fields: [workflow, inputs, policyWorkflowPod, engineEndpoint, suspend, cancel, backoffLimit, activeDeadlineSeconds, ttlSecondsAfterFinished], from: [applied]}
                  sc.kind.policyworkflowpod.spec: {fields: [workflow, inputs, concurrencyPolicy, maxConcurrent, runTTLSecondsAfterFinished], from: [applied]}
                  sc.kind.policyworkflowpod.status: {fields: [endpoint], from: [{rec: rec.policyworkflowpod, wake: [requeue-policyworkflowrun]}]}
                  sc.kind.policyworkflowrun.status: {fields: [phase, runID, startTime, completionTime, active, succeeded, failed, retries, exitStatus, outputs, conditions], from: [{rec: rec.policyworkflowrun, wake: [direct-queued-runs, requeue-policyworkflowrun]}], scope: namespace}
                unread: [args, perspective, selfDid]
                writes: [sc.kind.policyworkflowrun.status]
                admission: {by: sc.provider.admission, capacity: sc.kind.policyworkflowpod.spec.maxConcurrent, policy: sc.kind.policyworkflowpod.spec.concurrencyPolicy, lease: counting}
                runner: sc.deno-kcp-provider
                target: sc.workload.engine-process
                crossings: [x.evaluate-policy]
                rules:
                  precedence: {workflow: [sc.kind.policyworkflowrun.spec.workflow, sc.kind.policyworkflowpod.spec.workflow], inputs: [sc.kind.policyworkflowrun.spec.inputs, sc.kind.policyworkflowpod.spec.inputs]}
                  ignored_op: {op: OpStopRun, emitted_on: [cancel, suspend, deadline, teardown], acted_on: false, engine_cancel_endpoint: none, code: "internal/policyworkflowrun/policyworkflowrun.go:OpStopRun"}
                  cancel: {field: spec.cancel, op: OpStopRun, writes: {phase: Cancelled, runID: "", completionTime: now}, conditions: [{type: Cancelled, status: "True", reason: Cancelled}, {type: Complete, status: "True", reason: Cancelled}], releases_finalizer: true, polling_stops: true, engine_task: keeps_running}
                  deletion: {on: deletionTimestamp, op: OpStopRun, writes: {phase: Cancelled}, reason: Deleted, when_not_terminal: true, releases_finalizer: true}
                  suspend: {field: spec.suspend, op: OpStopRun, writes: {phase: Pending, runID: ""}, condition: {type: Suspended, status: "True", reason: Suspended}}
                  deadline: {from: spec.activeDeadlineSeconds, base: status.startTime, on_exceed: {op: OpStopRun, phase: Failed, reason: DeadlineExceeded, failed_at_least: 1}}
                  backoff: {default: 6, from: spec.backoffLimit, counted_by: status.retries, on_exceed: {phase: Failed, reason: BackoffLimitExceeded}, otherwise: {phase: Pending, reason: Retrying}}
                deletes:
                  - {what: sc.kind.policyworkflowrun, by: sibling_pass, when: [policy_replace, this_run_is_newest_pending], siblings: older_non_terminal_of_same_pod, then: [delete_siblings, submit_run], process: keeps_running, already_gone: ok, code: ["internal/provider/provider.go:reconcileWorkflowRun", "internal/provider/registry.go:Delete"]}
                  - {what: sc.kind.policyworkflowrun, by: own_pass, when: [run_terminal, terminal_ttl_expired], trigger: [sc.kind.policyworkflowrun.spec.ttlSecondsAfterFinished, sc.kind.policyworkflowpod.spec.runTTLSecondsAfterFinished, "--run-ttl-seconds"], default: "3600", negative: run_field_immediate_else_disables, base: status.completionTime, process: keeps_running, already_gone: ok, code: "internal/policyworkflowrun/policyworkflowrun.go:finish"}
                code: {reconcile: "internal/provider/provider.go:reconcileWorkflowRun", decide: "internal/policyworkflowrun/policyworkflowrun.go:Reconcile", admit: "internal/provider/admission.go:buildPodAdmissions", leases: "internal/provider/admission.go:admissionLeases"}

              rec.runtrigger:
                kind: sc.kind.runtrigger
                mode: reconcile
                reads:
                  sc.kind.runtrigger.spec: {fields: [policyWorkflowPod, match, jobTemplate], from: [applied]}
                  sc.kind.policyworkflowrun.status: {fields: [phase, outputs], from: [{rec: rec.policyworkflowrun, wake: [fanout-terminal-policyworkflowrun, backstop-trigger]}], scope: logical_cluster}
                  sc.kind.runtrigger.status: {fields: [phase, matched, jobName, lastRun, conditions], from: [{rec: rec.runtrigger, wake: [informer]}]}
                writes: [sc.kind.runtrigger.status, sc.kind.denojob.spec]
                select: {label: deno.computer/policyworkflowpod, equals: sc.kind.runtrigger.spec.policyWorkflowPod, pick: newest_terminal}
                runner: sc.deno-kcp-provider
                crossings: [x.verdict-to-job]
                rules:
                  select: {label: deno.computer/policyworkflowpod, newest_by: metadata.creationTimestamp, terminal_phases: [Succeeded, Failed, Cancelled], scope: logical_cluster}
                  match: {for_each: sc.kind.runtrigger.spec.match, equals: "status.outputs[key]", all_required: true, empty_matches_everything: true}
                  fire: {when: [run_phase == Succeeded, match_all_true], writes: {phase: Triggered, matched: true, jobName: "<trigger>-<run>"}, on_new_run: {when: [run != status.lastRun], writes: {lastRun: "<run>"}, creates: denojob, condition: {type: Complete, status: "True", reason: Triggered}}}
                  skip: {run_phase: {Failed: {reason: WorkflowFailed}, Cancelled: {reason: WorkflowCancelled}}, writes: {phase: Skipped, matched: false}, condition: {type: Failed, status: "True"}}
                  pending: {when: [no_terminal_run, run_phase not terminal], writes: {phase: Pending}, condition: {type: Complete, status: "False", reason: Pending}}
                  requeue: {decider_asks: none, driver: backstop}
                  backstop: {after: 1m, code: "internal/provider/watch.go:triggerBackstop"}
                  created_job: {name: "<trigger>-<run>", label: "deno.computer/trigger=<trigger>", owner: RunTrigger, spec: sc.kind.runtrigger.spec.jobTemplate, code: "internal/provider/reconcile_job.go:newJobForTrigger"}
                code: {reconcile: "internal/provider/reconcile_trigger.go:reconcileTrigger", decide: "internal/trigger/trigger.go:Reconcile", create: "internal/provider/reconcile_job.go:newJobForTrigger"}

              rec.denojob:
                kind: sc.kind.denojob
                mode: reconcile
                reads:
                  sc.kind.denojob.spec: {fields: [template, completions, parallelism, backoffLimit, suspend, activeDeadlineSeconds, ttlSecondsAfterFinished], from: [applied, {rec: rec.runtrigger, wake: [informer]}]}
                  sc.kind.denorun.status: {fields: [phase, exitCode, message, outputs], from: [{rec: rec.denorun, wake: [fanout-denorun-phase, direct-run-terminal-job]}], scope: namespace}
                  sc.kind.denojob.status: {fields: [phase, runName, runs, startTime, completionTime, active, ready, succeeded, failed, retries, exitCode, outputs, conditions], from: [{rec: rec.denojob, wake: [informer]}]}
                writes: [sc.kind.denojob.status, sc.kind.denorun.spec]
                select: {label: deno.computer/job, equals: metadata.name, pick: all}
                runner: sc.deno-kcp-provider
                rules:
                  runs: {labelled: "deno.computer/job=<job name>", named: "<job>-<n>", created_by: "internal/provider/reconcile_run.go:newRunForJob"}
                  template: {from: sc.kind.runtrigger.spec.jobTemplate, copied_verbatim: true}
                  completions: {default: 1, from: spec.completions}
                  parallelism: {default: 1, from: spec.parallelism, negative: 0}
                  backoff_limit: {default: 6, from: spec.backoffLimit, counted_by: status.retries, on_exceed: {phase: Failed, reason: BackoffLimitExceeded}}
                deletes:
                  - {what: sc.kind.denorun, by: own_pass, when: [job_terminal, child_not_terminal], siblings: active_children, process: stopped_by_child_teardown, already_gone: ok, code: "internal/denojob/denojob.go:finish"}
                  - {what: sc.kind.denorun, by: own_pass, when: [job_suspended], siblings: active_children, process: stopped_by_child_teardown, already_gone: ok, code: "internal/denojob/denojob.go:suspend"}
                  - {what: sc.kind.denorun, by: own_pass, when: [job_deadline_exceeded], siblings: active_children, process: stopped_by_child_teardown, already_gone: ok, code: "internal/denojob/denojob.go:deadline"}
                  - {what: sc.kind.denorun, by: own_pass, when: [job_terminal, terminal_ttl_expired], siblings: all_children, trigger: [sc.kind.denojob.spec.ttlSecondsAfterFinished], base: status.completionTime, process: stopped_by_child_teardown, already_gone: ok, code: "internal/denojob/denojob.go:finish"}
                  - {what: sc.kind.denojob, by: own_pass, when: [job_terminal, terminal_ttl_expired], trigger: [sc.kind.denojob.spec.ttlSecondsAfterFinished], base: status.completionTime, then: [delete_all_children, delete_job], process: none, already_gone: ok, code: ["internal/denojob/denojob.go:finish", "internal/provider/reconcile_job.go:reconcileJob"]}
                code: {reconcile: "internal/provider/reconcile_job.go:reconcileJob", decide: "internal/denojob/denojob.go:Reconcile", create: "internal/provider/reconcile_run.go:newRunForJob"}

              rec.denorun:
                kind: sc.kind.denorun
                mode: reconcile
                reads:
                  sc.kind.denorun.spec: {fields: [backoff, activeDeadlineSeconds, ttlSecondsAfterFinished, denoJson, denoLock, script, permissions, serviceAccount, apiServer, env], from: [applied, {rec: rec.denojob, wake: [direct-job-created-run, informer]}]}
                  sc.kind.openbao.spec: {fields: [namespace], from: [applied], scope: namespace}
                  sc.kind.denopod.spec: {fields: [env], from: [applied], scope: all_workspaces}
                  sc.kind.denorun.status: {fields: [phase, runID, startTime, completionTime, exitCode, message, outputs, retries, conditions], from: [{rec: rec.denorun, wake: [informer]}]}
                writes: [sc.kind.denorun.status]
                runner: sc.runner.exec-pod
                target: sc.workload.deno-process
                crossings: [x.spawn, x.mint-token, x.issue-leaf]
                rules:
                  exit: {state_passthrough: {from: runner.State, to: denorun.RunState}, exit_code_always_set: true, source: "internal/provider/reconcile_run.go:exitCodePtr"}
                  backoff: {limit_from: spec.backoff, default: 0, counted_by: status.retries, on_exceed: {phase: Failed, reason: BackoffExceeded}, otherwise: {phase: Pending, reason: Retrying}, clears: status.runID, requeue: 2s}
                  deadline: {from: spec.activeDeadlineSeconds, base: status.startTime, on_exceed: {phase: Failed, op: stop-run, reason: DeadlineExceeded}}
                  single_start: {max_workloads_per_run: 1, code: "internal/provider/run_refs.go:alreadyStarted"}
                deletes:
                  - {what: sc.kind.denorun, by: own_pass, when: [run_terminal, terminal_ttl_expired], trigger: [sc.kind.denorun.spec.ttlSecondsAfterFinished], base: status.completionTime, process: already_exited, already_gone: ok, code: ["internal/denorun/denorun.go:finish", "internal/provider/reconcile_run.go:reconcileRun"]}
                code: {reconcile: "internal/provider/reconcile_run.go:reconcileRun", decide: "internal/denorun/denorun.go:Reconcile", request: "internal/provider/reconcile_pod.go:podRequest"}

              rec.denopod:
                kind: sc.kind.denopod
                mode: reconcile
                reads:
                  sc.kind.denopod.spec: {fields: [restartPolicy, readinessProbe, livenessProbe, activeDeadlineSeconds, ttlSecondsAfterFinished, denoJson, denoLock, script, permissions, serviceAccount, apiServer, env], from: [applied], scope: all_workspaces}
                  sc.kind.openbao.spec: {fields: [namespace], from: [applied], scope: namespace}
                  sc.kind.denopod.status: {fields: [phase, runID, restarts, startTime, completionTime, exitCode, message, outputs, ready, conditions], from: [{rec: rec.denopod, wake: [informer]}]}
                writes: [sc.kind.denopod.status]
                runner: sc.runner.exec-pod
                target: sc.workload.deno-process
                crossings: [x.spawn, x.mint-token, x.issue-leaf, x.pod-probe-exec]
                rules:
                  exit: {exit_code_always_set: true, observed_from: exitCodePtr, code_0: success, code_nonzero: failure}
                  restart_policy: {default: Always, Always: {exit_0: restart, exit_nonzero: restart}, OnFailure: {exit_0: complete_succeeded, exit_nonzero: restart}, Never: {exit_0: complete_succeeded, exit_nonzero: {phase: Failed, reason: ProcessFailed}}}
                  restart: {clears: status.runID, increments: status.restarts, stops_running_process: true, phase: Running, requeue: 2s}
                  liveness: {threshold_from: spec.livenessProbe.failureThreshold, default_threshold: 3, reset_on_pass: true, on_exceed: {reason: LivenessProbeFailed, op: stop-run}}
                  deadline: {from: spec.activeDeadlineSeconds, base: status.startTime, on_exceed: {phase: Failed, op: stop-run, reason: DeadlineExceeded}}
                deletes:
                  - {what: sc.kind.denopod, by: own_pass, when: [pod_terminal, terminal_ttl_expired], trigger: [sc.kind.denopod.spec.ttlSecondsAfterFinished], base: status.completionTime, process: already_exited, already_gone: ok, code: ["internal/denopod/denopod.go:finish", "internal/provider/reconcile_pod.go:reconcilePod"]}
                code: {reconcile: "internal/provider/reconcile_pod.go:reconcilePod", decide: "internal/denopod/denopod.go:Reconcile", request: "internal/provider/reconcile_pod.go:podRequest", peers: "internal/provider/service_dns.go:allPods"}

              rec.openbao:
                kind: sc.kind.openbao
                mode: reconcile
                reads:
                  sc.kind.openbao.spec: {fields: [namespace], from: [applied], scope: namespace}
                  sc.kind.openbao.status: {fields: [namespace, serial, chain, ready, message, conditions], from: [{rec: rec.openbao, wake: [informer]}]}
                writes: [sc.kind.openbao.status]
                runner: sc.deno-kcp-provider
                target: sc.openbao-server
                crossings: [x.provision-authority, x.sign-intermediate]
                code: {reconcile: "internal/provider/reconcile_openbao.go:reconcileOpenBao"}

              rec.policyengine.finalize:
                kind: sc.kind.policyengine
                mode: finalize
                reads:
                  sc.kind.policyengine.status: {fields: [runID], from: [{rec: rec.policyengine, wake: [informer]}]}
                writes: [sc.kind.policyengine.status]
                runner: sc.runner.exec-engine
                target: sc.workload.engine-process
                teardown:
                  order: [stop-process, write-status, release-finalizer]
                  deletes: [{what: process, code: "internal/provider/reconcile_engine.go:EngineRunner.Stop"}]
                  if_gone: [process, finalizer, object]
                code: {decide: "internal/policyengine/policyengine.go:teardown", act: "internal/provider/reconcile_engine.go:EngineRunner.Stop"}

              rec.policyworkflowrun.finalize:
                kind: sc.kind.policyworkflowrun
                mode: finalize
                reads:
                  sc.kind.policyworkflowrun.status: {fields: [phase], from: [{rec: rec.policyworkflowrun, wake: [informer]}]}
                writes: [sc.kind.policyworkflowrun.status]
                runner: none
                rules:
                  engine_task: {after_finalizer_release: keeps_running, missing_call: PolicyClient.Cancel}
                  status_write: {when: phase_not_terminal, phase: Cancelled, reason: Deleted}
                teardown:
                  order: [write-status, release-finalizer]
                  if_gone: [finalizer, object]
                code: {decide: "internal/policyworkflowrun/policyworkflowrun.go:teardown"}

              rec.denorun.finalize:
                kind: sc.kind.denorun
                mode: finalize
                reads:
                  sc.kind.denorun.status: {fields: [runID], from: [{rec: rec.denorun, wake: [informer]}]}
                writes: []
                runner: sc.runner.exec-pod
                target: sc.workload.deno-process
                teardown:
                  order: [stop-process, release-finalizer]
                  deletes: [{what: process, code: "internal/provider/reconcile_run.go:PodRunner.Stop"}]
                  if_gone: [process, finalizer]
                code: {decide: "internal/denorun/denorun.go:teardown", act: "internal/provider/reconcile_run.go:PodRunner.Stop"}

              rec.denopod.finalize:
                kind: sc.kind.denopod
                mode: finalize
                reads:
                  sc.kind.denopod.status: {fields: [runID], from: [{rec: rec.denopod, wake: [informer]}]}
                writes: [sc.kind.denopod.status]
                runner: sc.runner.exec-pod
                target: sc.workload.deno-process
                teardown:
                  order: [stop-process, write-status, release-finalizer]
                  deletes: [{what: process, code: "internal/provider/reconcile_pod.go:PodRunner.Stop"}]
                  if_gone: [process, finalizer, object]
                code: {decide: "internal/denopod/denopod.go:teardown", act: "internal/provider/reconcile_pod.go:PodRunner.Stop"}

              rec.openbao.finalize:
                kind: sc.kind.openbao
                mode: finalize
                reads:
                  sc.kind.openbao.spec: {fields: [namespace], from: [applied]}
                writes: []
                runner: sc.deno-kcp-provider
                target: sc.openbao-server
                teardown:
                  order: [delete-authority, release-finalizer]
                  deletes: [{what: openbao-namespace, code: "internal/provider/reconcile_openbao.go:deleteOpenBao"}]
                  if_gone: [finalizer, openbao-namespace, object]
                code: {act: "internal/provider/reconcile_openbao.go:deleteOpenBao"}

            wakes:
              informer: {by: informer, when: "own object add or update", code: "internal/provider/watch.go:enqueueOwn"}
              fanout-denorun-phase: {by: fanout, key: deno.computer/job, when: "DenoRun add, or update that changes phase", code: "internal/provider/watch.go:enqueueJobForRun"}
              fanout-terminal-policyworkflowrun: {by: fanout, key: deno.computer/policyworkflowpod, when: "PolicyWorkflowRun add or update in a terminal phase", scope: namespace, code: "internal/provider/watch.go:enqueueTriggersForRun"}
              direct-job-created-run: {by: direct, when: "DenoJob creates a DenoRun", code: "internal/provider/reconcile_job.go:reconcileJob"}
              direct-run-terminal-job: {by: direct, when: "DenoRun terminal", code: "internal/provider/reconcile_run.go:reconcileRun"}
              direct-queued-runs: {by: direct, when: "PolicyWorkflowRun leaves Running", code: "internal/provider/admission.go:wakeQueuedRuns"}
              requeue-policyworkflowpod: {by: requeue, after: 2s, code: "internal/policyworkflowpod/policyworkflowpod.go:RequeueAfter"}
              requeue-policyworkflowrun: {by: requeue, after: 2s, code: "internal/policyworkflowrun/policyworkflowrun.go:RequeueAfter"}
              backstop-trigger: {by: requeue, after: 1m, code: "internal/provider/watch.go:triggerBackstop"}

            applied:
              objects: true
              by: [orch.demo-deno-runtime, orch.demo, orch.apply-market, orch.test-integration, orch.test-live]
              also:
                - {object: sc.kind.policyworkflowrun.spec, from: sc.demo.native-fire.script, via: x.workload-to-api}
              basis: example

            model:
              per_kind: {reconcilers_per_kind: 1, decider: {default: "internal/<kind>", runtrigger: internal/trigger}, io: internal/provider, memory: own_status, code: ["internal/provider/watch.go:process", "internal/provider/watch.go:denoRuntimeResources", "internal/provider/driver.go:workKind"]}
              decider_input: {type: Observed, per: decider_pass, code: ["internal/denojob/denojob.go:Observed"]}
              workers: {code: ["internal/provider/watch.go:runWatchWorker", "internal/provider/watch.go:watchWorkers"]}
              cache: {informer_cache_per: apiexport_endpoint_url, code: ["internal/provider/watch_cache.go:cacheReader"]}
              runners: {code: ["internal/provider/provider.go:PodRunner", "internal/provider/provider.go:EngineRunner", internal/provider/policy_client.go, internal/baopki/baopki.go]}
              idempotence: {second_workload_per_run: false, rewrites_identical_status: false, queue_dedups_keys: true, code: ["internal/provider/reconcile_run.go:alreadyStarted", "internal/provider/reconcile_pod.go:reflect.DeepEqual"]}
              object_scope: {key: [logical_cluster, namespace, name], reads_crossing_it: [logical_cluster, all_workspaces], code: ["internal/provider/registry.go:Ref"]}
              finalize: {mode_reconcile: one_pass, mode_finalize: finalizer_teardown, code: ["internal/denopod/denopod.go:teardown"]}
              deletions: {non_teardown_home: reconciler.deletes, never_in: teardown, decided_by: ["internal/denojob/denojob.go:finish", "internal/denorun/denorun.go:finish", "internal/denopod/denopod.go:finish", "internal/policyworkflowrun/policyworkflowrun.go:finish", "internal/denojob/denojob.go:suspend", "internal/denojob/denojob.go:deadline", "internal/provider/admission.go:buildPodAdmissions"], acted_by: ["internal/provider/reconcile_job.go:reconcileJob", "internal/provider/reconcile_run.go:reconcileRun", "internal/provider/reconcile_pod.go:reconcilePod", "internal/provider/provider.go:reconcileWorkflowRun", "internal/provider/registry_run.go:DeleteRun", "internal/provider/registry_job.go:DeleteJob", "internal/provider/registry_pod.go:DeletePod", "internal/provider/registry.go:Delete"], already_gone: ok, code: ["internal/provider/reconcile_job.go:reconcileJob", "internal/provider/registry_run.go:DeleteRun"]}
              run_dirs:
                created_by: sc.runner.exec-pod
                removed_by: none
                dir: "<--runs-dir>/pod-<UTC yyyymmddThhmmss>-<seq>"
                dir_mode: "0755"
                engine_dir: "<--runs-dir>/engine-<UTC yyyymmddThhmmss>-<seq>"
                files:
                  main.ts: {by: sc.runner.exec-pod, mode: "0644", secret: may, when: every_start}
                  deno.json: {by: sc.runner.exec-pod, mode: "0644", secret: false, when: spec.denoJson_set}
                  deno.lock: {by: sc.runner.exec-pod, mode: "0644", secret: false, when: spec.denoLock_set}
                  ca.pem: {by: sc.runner.exec-pod, mode: "0644", secret: false, when: trust_bundle_non_empty}
                  stdout.txt: {by: workload_process, mode: "0644", secret: may, when: every_start}
                  stderr.txt: {by: workload_process, mode: "0644", secret: may, when: every_start}
                  state.json: {by: sc.runner.exec-pod, mode: "0644", secret: false, when: on_start}
                  done.json: {by: sc.runner.exec-pod, mode: "0644", secret: false, when: on_exit}
                  result.json: {by: workload_process, mode: "0644", secret: may, when: workload_writes_it}
                  ".deno": {by: workload_process, secret: false, when: DENO_DIR_unset}
                workload_written:
                  files: [tls.key, tls.crt]
                  mode: default
                  secret: true
                  holds: [leaf_private_key, leaf_certificate]
                  example: {by: sc.market.pds.service, code: "deploy/examples/atproto/market/40-alice-pds.yaml:writeTextFile"}
                engine_files: [stdout.txt, stderr.txt, state.json]
                survives: workload_exit
                read_by: [tb.host, tb.workload]
                consequence: a stopped workload leaves its script and any secret it wrote on disk, readable by every process sharing the provider OS user
                code: "internal/runner/pod_exec.go:RunsDir"
        overlay:
          - id: ov.provider-flags
            source: cmd/deno-kcp-provider/main.go
            data:
              precedence: [flag, env, default]
              flags:
                kubeconfig: {env: KUBECONFIG}
                host: {env: KCP_HOST}
                deno-bin: {env: DENO_BIN, default: deno}
                runs-dir: {env: RUNS_DIR, default: runs}
                policy-engine-dir: {env: POLICY_ENGINE_DIR, default: ../policy-engine/lib/policy-engine-server-gha-lite, binds: up.policy-engine}
                bundled-actions-dir: {env: BUNDLED_ACTIONS_DIR, binds: up.gha-lite-bundled-actions}
                service-domain: {env: KCP_SERVICE_DOMAIN, default: kcp.local}
                token-ttl: {default: 1h}
                pod-timeout: {default: 5m}
                write-status: {default: true}
                run-ttl-seconds: {env: RUN_TTL_SECONDS, default: 3600, negative: disables}
                metrics-listen: {env: METRICS_LISTEN}
                openbao-addr: {env: OPENBAO_ADDR}
                openbao-token: {env: OPENBAO_TOKEN, secret: true}
                openbao-ca-cert: {env: OPENBAO_CACERT}
                openbao-mount: {env: OPENBAO_MOUNT, default: pki}
                openbao-role: {env: OPENBAO_ROLE, default: denopod}
                openbao-intermediate-ttl: {env: OPENBAO_INTERMEDIATE_TTL, default: 43800h}
                openbao-leaf-ttl: {env: OPENBAO_LEAF_TTL, default: 720h}
          - id: sc.provider.watch
            upstream:
              code: {loop: internal/provider/watch.go, cache: internal/provider/watch_cache.go, driver: internal/provider/driver.go, job_cooldown: "internal/provider/provider_runtime.go:jobStatusCooldown"}
              libs: [up.kubernetes]
              model: event_driven
              discover: {resource: apis.kcp.io/v1alpha1/apiexportendpointslices, reads: [spec.export.name, "status.endpoints[].url"], when: startup_until_ready, ready_if: [denoruntime, policyworkflowruns], ready_min_urls: 1, bounded_watch: 2s, retry_after: 1s, rediscovery_after_start: none, crossing: x.endpoint-discovery}
              informers:
                client: k8s.io/client-go/dynamic/dynamicinformer
                per: endpoint_url
                resync: 0
                denoruntime: [policyengines, policyworkflowpods, runtriggers, denoruns, denojobs, denopods, openbaos]
                policyworkflowruns: [policyworkflowruns]
                handlers: [add, update]
                delete_handler: none
                store_drops_deleted: true
                code: "internal/provider/watch.go:registerInformer"
              cache:
                reader: cacheReader
                indexes: [by-cluster, by-cluster-name, by-cluster-pod, by-cluster-job, by-cluster-trigger-pod]
                cluster_annotation: kcp.io/cluster
                all_pods: {lists: every_denopods_indexer, feeds: sc.provider.service-dns}
              queue: {type: workqueue.TypedRateLimitingQueue, limiter: DefaultTypedControllerRateLimiter, key: [kind, logical_cluster, namespace, name]}
              workers: {count: GOMAXPROCS, max: 16, min: 1, code: "internal/provider/watch.go:watchWorkers"}
              wake:
                informer: {own_object: {events: [add, update], code: "internal/provider/watch.go:enqueueOwn"}}
                fanout:
                  denorun_to_job: {key: deno.computer/job, when: "add, or update that changes phase", code: "internal/provider/watch.go:enqueueJobForRun"}
                  terminal_policy_run_to_triggers: {key: deno.computer/policyworkflowpod, scope: namespace, code: "internal/provider/watch.go:enqueueTriggersForRun"}
                direct:
                  job_created_run: {code: "internal/provider/reconcile_job.go:reconcileJob"}
                  run_terminal_to_job: {code: "internal/provider/reconcile_run.go:reconcileRun"}
                  run_left_running_to_pending: {code: "internal/provider/admission.go:wakeQueuedRuns"}
                requeue: {decider_result: {code: "internal/provider/watch.go:process"}, trigger_backstop: {after: 1m, code: "internal/provider/watch.go:triggerBackstop"}}
              timings:
                min_transition_poll: {after: 25ms, applies_to: [sc.kind.denorun], when: non_terminal, code: "internal/provider/driver.go:minTransitionPoll"}
                default_requeue: {after: 2s, when: "the decider returned 0 and the key is not terminal", code: "internal/provider/watch.go:defaultRequeueAfter"}
                decider_requeue: {after: 2s, per_kind: [sc.kind.denojob, sc.kind.denorun, sc.kind.denopod, sc.kind.policyengine, sc.kind.policyworkflowpod, sc.kind.policyworkflowrun], code: ["internal/denojob/denojob.go:RequeueAfter", "internal/denorun/denorun.go:RequeueAfter", "internal/denopod/denopod.go:RequeueAfter", "internal/policyengine/policyengine.go:RequeueAfter", "internal/policyworkflowpod/policyworkflowpod.go:RequeueAfter", "internal/policyworkflowrun/policyworkflowrun.go:RequeueAfter"]}
                job_status_cooldown: {after: 500ms, applies_to: [sc.kind.denojob], when: non_essential_status_write, code: "internal/provider/provider_runtime.go:jobStatusCooldown"}
                trigger_backstop: {after: 1m, applies_to: [sc.kind.runtrigger], code: "internal/provider/watch.go:triggerBackstop"}
                openbao: {after: "max(30s, provider interval, default 2s)", applies_to: [sc.kind.openbao], code: "internal/provider/reconcile_openbao.go:openBaoRequeueAfter"}
                endpoint_slice_poll: {after: 2s, during: startup_wait, code: "internal/provider/watch.go:endpointSlicePoll"}
              conflict:
                detect: apierrors.IsConflict
                then: [forget, requeue_after_min_transition_poll]
                counted: denokcp_conflicts_total
                code: ["internal/provider/watch.go:runWatchWorker", "internal/provider/metrics.go:recordConflict"]
              error:
                then: [log, requeue_rate_limited]
                limiter: DefaultTypedControllerRateLimiter
                counted: denokcp_errors_total
                code: "internal/provider/watch.go:runWatchWorker"
              ordering:
                within_key: one_worker_at_a_time
                dedup: queue_dirty
                forget_before_requeue: true
                across_keys: none
                parent_and_child: can_reconcile_at_once
                code: "internal/provider/watch.go:runWatchWorker"
              not_guaranteed:
                - {what: delete_event, look_at: "the store drops the object, so the next pass for that key reads NotFound and stops", recovery: "none in process: the owner is woken only by its own requeue or another event", risk: r.watch-delete-not-watched, code: "internal/provider/watch.go:registerInformer"}
                - {what: crash_between_side_effect_and_status_write, look_at: "run_refs and admissionLeases are in memory only", recovery: "none: a restart loses the once-per-run start guard", risk: r.duplicate-start-after-restart, code: ["internal/provider/run_refs.go:alreadyStarted", "internal/provider/reconcile_run.go:reconcileRun"]}
                - {what: requeue_delay, look_at: "the delaying queue holds it while the process lives", recovery: "a restarted process refills the queue from the informers' initial list", code: "internal/provider/watch.go:RunWatch"}
              src: adr_0003
            overlay: []
