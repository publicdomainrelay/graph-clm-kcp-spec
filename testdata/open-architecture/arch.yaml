                SERVICE_ARGS: [--port, "2587", --hostname, 127.0.0.1]
                SERVICE_DENO_FLAGS: []
                SERVICE_ENV: {PORT: "2587", HOSTNAME: 127.0.0.1}
                SERVICE_TLS: "true"
              permissions:
                read: {allow: true}
                write: {allowList: [result.json, tls.crt, tls.key, ca.pem]}
                run: {allow: true}
                env: {allowList: [SERVICE_ENTRY, SERVICE_CWD, SERVICE_ARGS, SERVICE_DENO_FLAGS, SERVICE_ENV, SERVICE_TLS, KCP_SHIM, KCP_TLS_CERT, KCP_TLS_KEY, KCP_CA_BUNDLE, KCP_SERVICE_NAME, KCP_SERVICE_DOMAIN, KCP_DNS_TABLE, KCP_TOKENS, KCP_SERVER, KCP_NAMESPACE, PATH, HOME]}
