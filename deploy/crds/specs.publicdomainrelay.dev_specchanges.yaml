apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: specchanges.specs.publicdomainrelay.dev
spec:
  group: specs.publicdomainrelay.dev
  scope: Namespaced
  names:
    kind: SpecChange
    listKind: SpecChangeList
    plural: specchanges
    singular: specchange
    shortNames: [change]
    categories: [specs]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Context
          type: string
          jsonPath: .spec.systemContext
        - name: Direction
          type: string
          jsonPath: .spec.direction
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Commit
          type: string
          jsonPath: .status.commit
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [systemContext, direction]
              properties:
                systemContext:
                  type: string
                direction:
                  type: string
                  enum: [SpecToCode, CodeToSpec]
                fromSpecHash:
                  type: string
                toSpecHash:
                  type: string
                fromCommit:
                  type: string
                toCommit:
                  type: string
                delta:
                  type: object
                  description: What the change asks for, never the whole spec.
                  properties:
                    intent:
                      type: object
                      properties:
                        from:
                          type: string
                        to:
                          type: string
                    upstream:
                      type: object
                      properties:
                        from:
                          type: string
                        to:
                          type: string
                    orchestrator:
                      type: object
                      properties:
                        from:
                          type: string
                        to:
                          type: string
                    overlay:
                      type: object
                      properties:
                        added:
                          type: array
                          x-kubernetes-list-type: set
                          items:
                            type: string
                        removed:
                          type: array
                          x-kubernetes-list-type: set
                          items:
                            type: string
                    dependsOn:
                      type: object
                      properties:
                        added:
                          type: array
                          x-kubernetes-list-type: set
                          items:
                            type: string
                        removed:
                          type: array
                          x-kubernetes-list-type: set
                          items:
                            type: string
                    introduces:
                      type: object
                      properties:
                        added:
                          type: array
                          x-kubernetes-list-type: set
                          items:
                            type: string
                        removed:
                          type: array
                          x-kubernetes-list-type: set
                          items:
                            type: string
                    codeRefs:
                      type: object
                      properties:
                        added:
                          type: array
                          x-kubernetes-list-type: set
                          items:
                            type: string
                        removed:
                          type: array
                          x-kubernetes-list-type: set
                          items:
                            type: string
                    requirements:
                      type: array
                      x-kubernetes-list-type: map
                      x-kubernetes-list-map-keys: [id]
                      items:
                        type: object
                        required: [op, id]
                        properties:
                          op:
                            type: string
                            enum: [added, removed, changed]
                          id:
                            type: string
                          from:
                            type: object
                            required: [id, level, text]
                            properties:
                              id:
                                type: string
                              level:
                                type: string
                                enum: [MUST, SHOULD, MAY]
                              text:
                                type: string
                              codeRefs:
                                type: array
                                x-kubernetes-list-type: set
                                items:
                                  type: string
                          to:
                            type: object
                            required: [id, level, text]
                            properties:
                              id:
                                type: string
                              level:
                                type: string
                                enum: [MUST, SHOULD, MAY]
                              text:
                                type: string
                              codeRefs:
                                type: array
                                x-kubernetes-list-type: set
                                items:
                                  type: string
                          fields:
                            type: array
                            x-kubernetes-list-type: set
                            items:
                              type: string
                    interfaces:
                      type: array
                      x-kubernetes-list-type: map
                      x-kubernetes-list-map-keys: [name]
                      items:
                        type: object
                        required: [op, name]
                        properties:
                          op:
                            type: string
                            enum: [added, removed, changed]
                          name:
                            type: string
                          from:
                            type: object
                            required: [name]
                            properties:
                              name:
                                type: string
                              kind:
                                type: string
                              signature:
                                type: string
                              file:
                                type: string
                          to:
                            type: object
                            required: [name]
                            properties:
                              name:
                                type: string
                              kind:
                                type: string
                              signature:
                                type: string
                              file:
                                type: string
                          fields:
                            type: array
                            x-kubernetes-list-type: set
                            items:
                              type: string
                    interactions:
                      type: array
                      x-kubernetes-list-type: map
                      x-kubernetes-list-map-keys: [id]
                      items:
                        type: object
                        required: [op, id]
                        properties:
                          op:
                            type: string
                            enum: [added, removed, changed]
                          id:
                            type: string
                          from:
                            type: object
                            required: [id, peer, initiator]
                            properties:
                              id:
                                type: string
                              peer:
                                type: string
                              initiator:
                                type: string
                              channel:
                                type: string
                              carries:
                                type: array
                                x-kubernetes-list-type: set
                                items:
                                  type: string
                              purpose:
                                type: string
                              level:
                                type: string
                                enum: [MUST, SHOULD, MAY]
                              forbidden:
                                type: boolean
                          to:
                            type: object
                            required: [id, peer, initiator]
                            properties:
                              id:
                                type: string
                              peer:
                                type: string
                              initiator:
                                type: string
                              channel:
                                type: string
                              carries:
                                type: array
                                x-kubernetes-list-type: set
                                items:
                                  type: string
                              purpose:
                                type: string
                              level:
                                type: string
                                enum: [MUST, SHOULD, MAY]
                              forbidden:
                                type: boolean
                          fields:
                            type: array
                            x-kubernetes-list-type: set
                            items:
                              type: string
                    observed:
                      type: object
                      properties:
                        files:
                          type: object
                          properties:
                            added:
                              type: array
                              x-kubernetes-list-type: set
                              items:
                                type: string
                            removed:
                              type: array
                              x-kubernetes-list-type: set
                              items:
                                type: string
                        fingerprint:
                          type: object
                          properties:
                            from:
                              type: string
                            to:
                              type: string
                        interfaces:
                          type: array
                          x-kubernetes-list-type: map
                          x-kubernetes-list-map-keys: [name]
                          items:
                            type: object
                            required: [op, name]
                            properties:
                              op:
                                type: string
                                enum: [added, removed, changed]
                              name:
                                type: string
                              from:
                                type: object
                                properties:
                                  name:
                                    type: string
                                  kind:
                                    type: string
                                  signature:
                                    type: string
                                  file:
                                    type: string
                                  line:
                                    type: integer
                                  codegraphId:
                                    type: string
                              to:
                                type: object
                                properties:
                                  name:
                                    type: string
                                  kind:
                                    type: string
                                  signature:
                                    type: string
                                  file:
                                    type: string
                                  line:
                                    type: integer
                                  codegraphId:
                                    type: string
                              fields:
                                type: array
                                x-kubernetes-list-type: set
                                items:
                                  type: string
            status:
              type: object
              properties:
                phase:
                  type: string
                  enum: [Pending, Running, Succeeded, Failed]
                branch:
                  type: string
                commit:
                  type: string
                verifyExitCode:
                  type: integer
                filesTouched:
                  type: array
                  x-kubernetes-list-type: set
                  items:
                    type: string
                agentLog:
                  type: string
                message:
                  type: string
                attempt:
                  type: integer
                  description: which attempt of the episode this change is; a manual retry records the number it took
                policy:
                  type: object
                  description: What the realize policy gate recorded, bucketed by the action the repository cap and the operator's overrides left.
                  properties:
                    denied:
                      type: array
                      items:
                        type: object
                        properties:
                          policy: {type: string}
                          constraint: {type: string}
                          enforcementAction: {type: string}
                          severity: {type: string}
                          msg: {type: string}
                          object: {type: string}
                          file: {type: string}
                          line: {type: integer}
                    warned:
                      type: array
                      items:
                        type: object
                        properties:
                          policy: {type: string}
                          constraint: {type: string}
                          enforcementAction: {type: string}
                          severity: {type: string}
                          msg: {type: string}
                          object: {type: string}
                          file: {type: string}
                          line: {type: integer}
                    dryRun:
                      type: array
                      items:
                        type: object
                        properties:
                          policy: {type: string}
                          constraint: {type: string}
                          enforcementAction: {type: string}
                          severity: {type: string}
                          msg: {type: string}
                          object: {type: string}
                          file: {type: string}
                          line: {type: integer}
                    waived:
                      type: array
                      items:
                        type: object
                        properties:
                          policy: {type: string}
                          constraint: {type: string}
                          enforcementAction: {type: string}
                          severity: {type: string}
                          msg: {type: string}
                          object: {type: string}
                          file: {type: string}
                          line: {type: integer}
                    capped:
                      type: array
                      items:
                        type: object
                        properties:
                          policy: {type: string}
                          constraint: {type: string}
                          enforcementAction: {type: string}
                          severity: {type: string}
                          msg: {type: string}
                          object: {type: string}
                          file: {type: string}
                          line: {type: integer}
                    inherited:
                      type: array
                      description: violations the base already carried; reported, never blocking
                      items:
                        type: object
                        properties:
                          policy: {type: string}
                          constraint: {type: string}
                          enforcementAction: {type: string}
                          severity: {type: string}
                          msg: {type: string}
                          object: {type: string}
                          file: {type: string}
                          line: {type: integer}
                    message:
                      type: string
                retryReason:
                  type: string
                  description: why an operator retried the episode; its presence makes this a deliberate attempt the attempt cap does not apply to
                retryBy:
                  type: string
                  description: who asked for the retry
                acceptance:
                  type: array
                  description: the acceptance steps the realize ran after verify, one entry per step, on every member of the batch
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys: [name]
                  items:
                    type: object
                    required: [name, passed]
                    properties:
                      name:
                        type: string
                      exitCode:
                        type: integer
                      durationSeconds:
                        type: number
                      passed:
                        type: boolean
                      outputTail:
                        type: string
                      overridden:
                        type: boolean
                        description: True when a gating step failed and an operator's override let the commit land.
                      overrideBy:
                        type: string
                      overrideReason:
                        type: string
                progress:
                  type: array
                  description: what the host running the change reported while it ran
                  items:
                    type: object
                    properties:
                      turn:
                        type: integer
                      tool:
                        type: string
                      files:
                        type: array
                        x-kubernetes-list-type: set
                        items:
                          type: string
                      note:
                        type: string
                      at:
                        type: string
                requirementCoverage:
                  type: array
                  description: the requirement-coverage judgment of the realized diff, one entry per added or changed requirement
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys: [id]
                  items:
                    type: object
                    required: [id, implemented]
                    properties:
                      id:
                        type: string
                      implemented:
                        type: boolean
                      evidence:
                        type: string
                conditions:
                  type: array
                  description: RequirementsUnimplemented is True when the realized diff does not implement every added or changed requirement; FilesOutsideContext is True when the realize touched files a context outside the batch owns; AcceptanceOverridden is True when a gating acceptance step failed and an operator's override let the commit land
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys: [type]
                  items:
                    type: object
                    required: [type, status, reason, lastTransitionTime]
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      reason:
                        type: string
                      message:
                        type: string
                      observedGeneration:
                        type: integer
                        format: int64
                      lastTransitionTime:
                        type: string
                        format: date-time
