apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: specchanges.specs.publicdomainrelay.dev
spec:
  group: specs.publicdomainrelay.dev
  scope: Namespaced
  names:
    kind: SpecChange
    listKind: SpecChangeList
    plural: specchanges
    singular: specchange
    shortNames: [change]
    categories: [specs]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Context
          type: string
          jsonPath: .spec.systemContext
        - name: Direction
          type: string
          jsonPath: .spec.direction
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [systemContext, direction]
              properties:
                systemContext:
                  type: string
                direction:
                  type: string
                  enum: [SpecToCode, CodeToSpec]
                fromSpecHash:
                  type: string
                toSpecHash:
                  type: string
                fromCommit:
                  type: string
                toCommit:
                  type: string
            status:
              type: object
              properties:
                phase:
                  type: string
                  enum: [Pending, Running, Succeeded, Failed]
                branch:
                  type: string
                commit:
                  type: string
                verifyExitCode:
                  type: integer
                agentLog:
                  type: string
                message:
                  type: string
