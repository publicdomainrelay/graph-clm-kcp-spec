apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: repositories.specs.publicdomainrelay.dev
spec:
  group: specs.publicdomainrelay.dev
  scope: Namespaced
  names:
    kind: Repository
    listKind: RepositoryList
    plural: repositories
    singular: repository
    shortNames: [repo, repos]
    categories: [specs]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Path
          type: string
          jsonPath: .spec.path
        - name: Branch
          type: string
          jsonPath: .spec.branch
        - name: Head
          type: string
          jsonPath: .status.headCommit
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [path]
              properties:
                path:
                  type: string
                  description: Absolute path to the git working tree under management.
                branch:
                  type: string
                  default: main
                verify:
                  type: array
                  description: Command that must exit zero before spec to code lands.
                  items:
                    type: string
                agent:
                  type: object
                  properties:
                    command:
                      type: string
                    args:
                      type: array
                      items:
                        type: string
            status:
              type: object
              properties:
                observedGeneration:
                  type: integer
                  format: int64
                headCommit:
                  type: string
                indexedCommit:
                  type: string
                conditions:
                  type: array
                  items:
                    type: object
                    required: [type, status]
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                        enum: ["True", "False", "Unknown"]
                      reason:
                        type: string
                      message:
                        type: string
                      lastTransitionTime:
                        type: string
                        format: date-time
                      observedGeneration:
                        type: integer
                        format: int64
