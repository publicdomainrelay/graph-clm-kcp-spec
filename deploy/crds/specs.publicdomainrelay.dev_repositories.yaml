apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: repositories.specs.publicdomainrelay.dev
spec:
  group: specs.publicdomainrelay.dev
  scope: Namespaced
  names:
    kind: Repository
    listKind: RepositoryList
    plural: repositories
    singular: repository
    shortNames: [repo, repos]
    categories: [specs]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Source
          type: string
          jsonPath: .spec.source.path
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Contexts
          type: string
          jsonPath: .status.contexts.total
        - name: Head
          type: string
          jsonPath: .status.headCommit
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              properties:
                path:
                  type: string
                  description: Local working tree; the phase 1 form of spec.source.path.
                source:
                  type: object
                  description: Where the working tree comes from. A path is used as it is; a git url is cloned into the controller's cache.
                  properties:
                    path:
                      type: string
                    git:
                      type: object
                      required: [url]
                      properties:
                        url:
                          type: string
                          description: Any url git can clone, including file:// for a local bare repository.
                        ref:
                          type: string
                          description: Branch, tag or commit to check out; empty is the remote's default branch.
                branch:
                  type: string
                  default: main
                verify:
                  type: array
                  description: Command that must exit zero before spec to code lands.
                  items:
                    type: string
                acceptance:
                  type: array
                  description: Commands run in the realize worktree after verify passes; a gate step that fails blocks the commit like verify, a report step records its result only.
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys: [name]
                  items:
                    type: object
                    required: [name, command]
                    properties:
                      name:
                        type: string
                        description: Short name of the step; it names the step in the commit trailer and in the change status.
                      command:
                        type: array
                        description: The command and its arguments, run in the realize worktree and in the current tree for specctl accept.
                        items:
                          type: string
                      timeoutSeconds:
                        type: integer
                        description: How long the step may run; zero or unset is the same ten minutes verify gets.
                      gate:
                        type: boolean
                        description: True blocks the commit when the step fails; false records the result only.
                      env:
                        type: object
                        description: Extra environment variables for the step, on top of the controller's own environment.
                        additionalProperties:
                          type: string
                agent:
                  type: object
                  description: Per repository agent selection for spec to code; it wins over the controller's --agent.
                  properties:
                    kind:
                      type: string
                      description: "claude, or scripted:<scenario file>. Empty keeps the controller's choice."
                    command:
                      type: string
                    args:
                      type: array
                      items:
                        type: string
                populate:
                  type: object
                  description: What the controller does with the tree once it has one.
                  properties:
                    partition:
                      type: string
                      enum: [directory, package]
                      default: directory
                      description: directory is one SystemContext per directory that holds a source file; package is one per package or module root.
                    include:
                      type: array
                      description: Globs of repository-relative paths to keep; empty keeps every file. ** crosses directories, and a pattern without a slash also matches a base name.
                      items:
                        type: string
                    exclude:
                      type: array
                      description: Globs of repository-relative paths to drop; an exclude wins over an include.
                      items:
                        type: string
                    summarize:
                      type: boolean
                      description: Send a model over every new context, one CodeToSpec change per context.
                    agent:
                      type: object
                      description: Agent of the populate step; it wins over spec.agent and the controller's --agent for code to spec.
                      properties:
                        kind:
                          type: string
                        command:
                          type: string
                        args:
                          type: array
                          items:
                            type: string
            status:
              type: object
              properties:
                observedGeneration:
                  type: integer
                  format: int64
                resolvedPath:
                  type: string
                  description: The working tree the controller resolved the source to.
                headCommit:
                  type: string
                indexedCommit:
                  type: string
                populateRequest:
                  type: string
                  description: The specs.publicdomainrelay.dev/populate-request annotation value this status answers.
                openArchitecture:
                  type: object
                  description: The orphan open-architecture branch this repository persists to, the last commit specd wrote or adopted, the last commit pushed, and the contexts a branch edit could not merge.
                  properties:
                    branch:
                      type: string
                    commit:
                      type: string
                    pushed:
                      type: string
                    conflicts:
                      type: array
                      items:
                        type: string
                phase:
                  type: string
                  enum: [Cloning, Indexing, Populating, Populated, Failed]
                contexts:
                  type: object
                  properties:
                    total:
                      type: integer
                    summarized:
                      type: integer
                    failed:
                      type: integer
                conditions:
                  type: array
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys: [type]
                  items:
                    type: object
                    required: [type, status]
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                        enum: ["True", "False", "Unknown"]
                      reason:
                        type: string
                      message:
                        type: string
                      lastTransitionTime:
                        type: string
                        format: date-time
                      observedGeneration:
                        type: integer
                        format: int64
