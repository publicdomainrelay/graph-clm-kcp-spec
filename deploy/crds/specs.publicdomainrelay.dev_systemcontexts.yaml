apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: systemcontexts.specs.publicdomainrelay.dev
spec:
  group: specs.publicdomainrelay.dev
  scope: Namespaced
  names:
    kind: SystemContext
    listKind: SystemContextList
    plural: systemcontexts
    singular: systemcontext
    shortNames: [sc]
    categories: [specs]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Repository
          type: string
          jsonPath: .spec.repository
        - name: Valid
          type: string
          jsonPath: '.status.conditions[?(@.type=="SpecValid")].status'
        - name: Synced
          type: string
          jsonPath: '.status.conditions[?(@.type=="CodeSynced")].status'
        - name: Drifted
          type: string
          jsonPath: '.status.conditions[?(@.type=="Drifted")].status'
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [repository]
              properties:
                repository:
                  type: string
                  description: Name of the Repository this context belongs to.
                upstream:
                  type: string
                  description: "self, sc.<name> or up.<name>."
                  default: self
                overlay:
                  type: array
                  description: Refs this context overlays. A set, so a patch edits one entry without rewriting the list.
                  x-kubernetes-list-type: set
                  items:
                    type: string
                orchestrator:
                  type: string
                dependsOn:
                  type: array
                  description: Refs this context depends on. A set.
                  x-kubernetes-list-type: set
                  items:
                    type: string
                introduces:
                  type: array
                  description: Refs this context introduces. A set.
                  x-kubernetes-list-type: set
                  items:
                    type: string
                codeRefs:
                  type: array
                  description: CodeGraph ids anchoring this context. A set, so a patch edits one entry without rewriting the list.
                  x-kubernetes-list-type: set
                  items:
                    type: string
                arch:
                  type: object
                  description: The open architecture view of this context, written by specctl import-arch.
                  x-kubernetes-preserve-unknown-fields: true
                intent:
                  type: string
                  description: One paragraph of what this context is and why.
                requirements:
                  type: array
                  description: Machine first requirements, keyed by id, each citing code.
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys: [id]
                  items:
                    type: object
                    required: [id, level, text]
                    properties:
                      id:
                        type: string
                      level:
                        type: string
                        enum: [MUST, SHOULD, MAY]
                      text:
                        type: string
                      codeRefs:
                        type: array
                        x-kubernetes-list-type: set
                        items:
                          type: string
                interfaces:
                  type: array
                  description: Declared public surface, keyed by name.
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys: [name]
                  items:
                    type: object
                    required: [name]
                    properties:
                      name:
                        type: string
                      kind:
                        type: string
                      signature:
                        type: string
                      file:
                        type: string
            status:
              type: object
              properties:
                observedGeneration:
                  type: integer
                  format: int64
                observedCommit:
                  type: string
                syncedCommit:
                  type: string
                  description: The commit whose facts the spec was last synced against.
                syncedFingerprint:
                  type: string
                  description: The observed fingerprint recorded when the spec was last synced.
                observed:
                  type: object
                  description: The code facts the index reports, deterministic.
                  properties:
                    files:
                      type: array
                      x-kubernetes-list-type: set
                      items:
                        type: string
                    interfaces:
                      type: array
                      x-kubernetes-list-type: map
                      x-kubernetes-list-map-keys: [name]
                      items:
                        type: object
                        required: [name]
                        properties:
                          name:
                            type: string
                          kind:
                            type: string
                          signature:
                            type: string
                          file:
                            type: string
                          line:
                            type: integer
                          codegraphId:
                            type: string
                    fingerprint:
                      type: string
                syncedObserved:
                  type: object
                  description: The facts the synced baseline was taken from, the old side of a code to spec delta.
                  properties:
                    files:
                      type: array
                      x-kubernetes-list-type: set
                      items:
                        type: string
                    interfaces:
                      type: array
                      x-kubernetes-list-type: map
                      x-kubernetes-list-map-keys: [name]
                      items:
                        type: object
                        required: [name]
                        properties:
                          name:
                            type: string
                          kind:
                            type: string
                          signature:
                            type: string
                          file:
                            type: string
                          line:
                            type: integer
                          codegraphId:
                            type: string
                    fingerprint:
                      type: string
                realizedSpecHash:
                  type: string
                realizedSpec:
                  type: object
                  description: The last spec that was realized or absorbed, the old side of a spec to code delta.
                  required: [repository]
                  properties:
                    repository:
                      type: string
                    upstream:
                      type: string
                    overlay:
                      type: array
                      x-kubernetes-list-type: set
                      items:
                        type: string
                    orchestrator:
                      type: string
                    dependsOn:
                      type: array
                      x-kubernetes-list-type: set
                      items:
                        type: string
                    introduces:
                      type: array
                      x-kubernetes-list-type: set
                      items:
                        type: string
                    codeRefs:
                      type: array
                      x-kubernetes-list-type: set
                      items:
                        type: string
                    arch:
                      type: object
                      x-kubernetes-preserve-unknown-fields: true
                    intent:
                      type: string
                    requirements:
                      type: array
                      x-kubernetes-list-type: map
                      x-kubernetes-list-map-keys: [id]
                      items:
                        type: object
                        required: [id, level, text]
                        properties:
                          id:
                            type: string
                          level:
                            type: string
                            enum: [MUST, SHOULD, MAY]
                          text:
                            type: string
                          codeRefs:
                            type: array
                            x-kubernetes-list-type: set
                            items:
                              type: string
                    interfaces:
                      type: array
                      x-kubernetes-list-type: map
                      x-kubernetes-list-map-keys: [name]
                      items:
                        type: object
                        required: [name]
                        properties:
                          name:
                            type: string
                          kind:
                            type: string
                          signature:
                            type: string
                          file:
                            type: string
                conditions:
                  type: array
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys: [type]
                  items:
                    type: object
                    required: [type, status]
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                        enum: ["True", "False", "Unknown"]
                      reason:
                        type: string
                      message:
                        type: string
                      lastTransitionTime:
                        type: string
                        format: date-time
                      observedGeneration:
                        type: integer
                        format: int64
