apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: agentruns.specs.publicdomainrelay.dev
spec:
  group: specs.publicdomainrelay.dev
  scope: Namespaced
  names:
    kind: AgentRun
    listKind: AgentRunList
    plural: agentruns
    singular: agentrun
    categories: [specs]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Purpose
          type: string
          jsonPath: .spec.purpose
        - name: Change
          type: string
          jsonPath: .spec.change
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Seconds
          type: number
          jsonPath: .status.durationSeconds
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [purpose]
              properties:
                purpose:
                  type: string
                  enum: [summarize, realize]
                change:
                  type: string
                context:
                  type: string
                agent:
                  type: string
                command:
                  type: string
            status:
              type: object
              properties:
                phase:
                  type: string
                  enum: [Running, Succeeded, Failed]
                startedAt:
                  type: string
                finishedAt:
                  type: string
                durationSeconds:
                  type: number
                message:
                  type: string
