# The APIExport a tenant workspace binds. It is applied inside the provider
# workspace (root:specs-provider), not at the root, and it publishes the three
# APIResourceSchemas generated from deploy/crds/. A test holds its schema names
# to the generator, so the API a tenant binds cannot drift from the API the
# single workspace serves.
apiVersion: apis.kcp.io/v1alpha2
kind: APIExport
metadata:
  name: specs.publicdomainrelay.dev
spec:
  resources:
    - group: specs.publicdomainrelay.dev
      name: repositories
      schema: v1alpha1-9.repositories.specs.publicdomainrelay.dev
      storage:
        crd: {}
    - group: specs.publicdomainrelay.dev
      name: systemcontexts
      schema: v1alpha1-9.systemcontexts.specs.publicdomainrelay.dev
      storage:
        crd: {}
    - group: specs.publicdomainrelay.dev
      name: specchanges
      schema: v1alpha1-9.specchanges.specs.publicdomainrelay.dev
      storage:
        crd: {}
    - group: specs.publicdomainrelay.dev
      name: policychanges
      schema: v1alpha1-9.policychanges.specs.publicdomainrelay.dev
      storage:
        crd: {}
    - group: specs.publicdomainrelay.dev
      name: plans
      schema: v1alpha1-9.plans.specs.publicdomainrelay.dev
      storage:
        crd: {}
    - group: specs.publicdomainrelay.dev
      name: findings
      schema: v1alpha1-9.findings.specs.publicdomainrelay.dev
      storage:
        crd: {}
    - group: specs.publicdomainrelay.dev
      name: agentruns
      schema: v1alpha1-9.agentruns.specs.publicdomainrelay.dev
      storage:
        crd: {}
