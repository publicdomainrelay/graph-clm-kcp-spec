                              codeRefs:
                                items:
                                  type: string
                                type: array
                              id:
                                type: string
                              level:
                                enum:
                                - MUST
                                - SHOULD
                                - MAY
                                type: string
                              text:
                                type: string
                            required:
                            - id
                            - level
                            - text
                            type: object
                          type: array
                      required:
                      - context
                      type: object
                    type: array
                  findings:
                    items:
                      type: string
                    type: array
                    x-kubernetes-list-type: set
                  id:
                    type: string
