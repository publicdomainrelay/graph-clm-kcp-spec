apiVersion: apis.kcp.io/v1alpha1
kind: APIResourceSchema
metadata:
  name: v1alpha1-6.repositories.specs.publicdomainrelay.dev
spec:
  group: specs.publicdomainrelay.dev
  names:
    categories:
    - specs
    kind: Repository
    listKind: RepositoryList
    plural: repositories
    shortNames:
    - repo
    - repos
    singular: repository
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.source.path
      name: Source
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.contexts.total
      name: Contexts
      type: string
    - jsonPath: .status.headCommit
      name: Head
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      properties:
        spec:
          properties:
            acceptance:
              description: Commands run in the realize worktree after verify passes;
                a gate step that fails blocks the commit like verify, a report step
                records its result only.
              items:
                properties:
                  command:
                    description: The command and its arguments, run in the realize
                      worktree and in the current tree for specctl accept.
                    items:
                      type: string
                    type: array
                  env:
                    additionalProperties:
                      type: string
                    description: Extra environment variables for the step, on top
                      of the controller's own environment.
                    type: object
                  gate:
                    description: True blocks the commit when the step fails; false
                      records the result only.
                    type: boolean
                  name:
                    description: Short name of the step; it names the step in the
                      commit trailer and in the change status.
                    type: string
                  timeoutSeconds:
                    description: How long the step may run; zero or unset is the same
                      ten minutes verify gets.
                    type: integer
                required:
                - name
                - command
                type: object
              type: array
              x-kubernetes-list-map-keys:
              - name
              x-kubernetes-list-type: map
            acceptanceOverrides:
              description: One-shot operator overrides that let a realize land past
                a red gating acceptance step; specd removes an entry after the commit
                it let through lands.
              items:
                properties:
                  at:
                    description: When the override was recorded.
                    type: string
                  by:
                    description: Who overrode the step.
                    type: string
                  reason:
                    description: Why the step is overridden; recorded in the commit
                      trailer and the change condition.
                    type: string
                  step:
                    description: The name of the acceptance step whose failure is
                      overridden.
                    type: string
                required:
                - step
                - reason
                type: object
              type: array
              x-kubernetes-list-map-keys:
              - step
              x-kubernetes-list-type: map
            agent:
              description: Per repository agent selection for spec to code; it wins
                over the controller's --agent.
              properties:
                args:
                  items:
                    type: string
                  type: array
                command:
                  type: string
                kind:
                  description: claude, or scripted:<scenario file>. Empty keeps the
                    controller's choice.
                  type: string
              type: object
            branch:
              default: main
              type: string
            path:
              description: Local working tree; the phase 1 form of spec.source.path.
              type: string
            populate:
              description: What the controller does with the tree once it has one.
              properties:
                agent:
                  description: Agent of the populate step; it wins over spec.agent
                    and the controller's --agent for code to spec.
                  properties:
                    args:
                      items:
                        type: string
                      type: array
                    command:
                      type: string
                    kind:
                      type: string
                  type: object
                arch:
                  description: Path of the in-repo architecture document whose facts
                    seed the generated contexts; empty uses .tools/open-architecture/arch.yaml
                    when it is there.
                  type: string
                exclude:
                  description: Globs of repository-relative paths to drop; an exclude
                    wins over an include.
                  items:
                    type: string
                  type: array
                include:
                  description: Globs of repository-relative paths to keep; empty keeps
                    every file. ** crosses directories, and a pattern without a slash
                    also matches a base name.
                  items:
                    type: string
                  type: array
                partition:
                  default: directory
                  description: directory is one SystemContext per directory that holds
                    a source file; package is one per package or module root.
                  enum:
                  - directory
                  - package
                  type: string
                root:
                  description: Add a context for the repository root (the files at
                    the top level and docs/); the other contexts depend on it.
                  type: boolean
                summarize:
                  description: Send a model over every new context, one CodeToSpec
                    change per context.
                  type: boolean
              type: object
            source:
              description: Where the working tree comes from. A path is used as it
                is; a git url is cloned into the controller's cache.
              properties:
                git:
                  properties:
                    ref:
                      description: Branch, tag or commit to check out; empty is the
                        remote's default branch.
                      type: string
                    url:
                      description: Any url git can clone, including file:// for a
                        local bare repository.
                      type: string
                  required:
                  - url
                  type: object
                path:
                  type: string
              type: object
            verify:
              description: Command that must exit zero before spec to code lands.
              items:
                type: string
              type: array
          type: object
        status:
          properties:
            conditions:
              items:
                properties:
                  lastTransitionTime:
                    format: date-time
                    type: string
                  message:
                    type: string
                  observedGeneration:
                    format: int64
                    type: integer
                  reason:
                    type: string
                  status:
                    enum:
                    - "True"
                    - "False"
                    - Unknown
                    type: string
                  type:
                    type: string
                required:
                - type
                - status
                type: object
              type: array
              x-kubernetes-list-map-keys:
              - type
              x-kubernetes-list-type: map
            contexts:
              properties:
                failed:
                  type: integer
                summarized:
                  type: integer
                total:
                  type: integer
              type: object
            headCommit:
              type: string
            indexedCommit:
              type: string
            observedGeneration:
              format: int64
              type: integer
            openArchitecture:
              description: The orphan open-architecture branch this repository persists
                to, the last commit specd wrote or adopted, the last commit pushed,
                and the contexts a branch edit could not merge.
              properties:
                branch:
                  type: string
                commit:
                  type: string
                conflicts:
                  items:
                    type: string
                  type: array
                pushed:
                  type: string
              type: object
            phase:
              enum:
              - Cloning
              - Indexing
              - Populating
              - Populated
              - Failed
              type: string
            populateRequest:
              description: The specs.publicdomainrelay.dev/populate-request annotation
                value this status answers.
              type: string
            resolvedPath:
              description: The working tree the controller resolved the source to.
              type: string
          type: object
      required:
      - spec
      type: object
    served: true
    storage: true
    subresources:
      status: {}
