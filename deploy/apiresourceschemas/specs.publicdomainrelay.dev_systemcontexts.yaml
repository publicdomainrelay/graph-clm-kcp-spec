apiVersion: apis.kcp.io/v1alpha1
kind: APIResourceSchema
metadata:
  name: v1alpha1-7.systemcontexts.specs.publicdomainrelay.dev
spec:
  group: specs.publicdomainrelay.dev
  names:
    categories:
    - specs
    kind: SystemContext
    listKind: SystemContextList
    plural: systemcontexts
    shortNames:
    - sc
    singular: systemcontext
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.repository
      name: Repository
      type: string
    - jsonPath: .status.conditions[?(@.type=="SpecValid")].status
      name: Valid
      type: string
    - jsonPath: .status.conditions[?(@.type=="CodeSynced")].status
      name: Synced
      type: string
    - jsonPath: .status.conditions[?(@.type=="Drifted")].status
      name: Drifted
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      properties:
        spec:
          properties:
            arch:
              description: The open architecture view of this context, written by
                specctl import-arch.
              type: object
              x-kubernetes-preserve-unknown-fields: true
            codeRefs:
              description: CodeGraph ids anchoring this context. A set, so a patch
                edits one entry without rewriting the list.
              items:
                type: string
              type: array
              x-kubernetes-list-type: set
            dependsOn:
              description: Refs this context depends on. A set.
              items:
                type: string
              type: array
              x-kubernetes-list-type: set
            intent:
              description: One paragraph of what this context is and why.
              type: string
            interactions:
              description: Declared flows with a peer, keyed by id. peer names a role
                from policies.yaml or a SystemContext the binding gives a role; initiator
                is self or peer; carries lists payload classes or event:<class>. A
                flow marked forbidden is a declared must-never, kept in the ArchitectureModel
                as a declared-forbidden entry.
              items:
                properties:
                  carries:
                    items:
                      type: string
                    type: array
                    x-kubernetes-list-type: set
                  channel:
                    type: string
                  forbidden:
                    type: boolean
                  id:
                    type: string
                  initiator:
                    enum:
                    - self
                    - peer
                    type: string
                  level:
                    default: SHOULD
                    enum:
                    - MUST
                    - SHOULD
                    - MAY
                    type: string
                  peer:
                    type: string
                  purpose:
                    type: string
                required:
                - id
                - peer
                - initiator
                type: object
              type: array
              x-kubernetes-list-map-keys:
              - id
              x-kubernetes-list-type: map
            interfaces:
              description: Declared public surface, keyed by name. A method is keyed
                by its qualified name, Type.Method (the Go receiver type or the TypeScript
                class), so two types that share a method name are two entries; every
                other symbol keeps its bare name.
              items:
                properties:
                  file:
                    type: string
                  kind:
                    type: string
                  name:
                    type: string
                  signature:
                    type: string
                required:
                - name
                type: object
              type: array
              x-kubernetes-list-map-keys:
              - name
              x-kubernetes-list-type: map
            introduces:
              description: Refs this context introduces. A set.
              items:
                type: string
              type: array
              x-kubernetes-list-type: set
            orchestrator:
              type: string
            overlay:
              description: Refs this context overlays. A set, so a patch edits one
                entry without rewriting the list.
              items:
                type: string
              type: array
              x-kubernetes-list-type: set
            repository:
              description: Name of the Repository this context belongs to.
              type: string
            requirements:
              description: Machine first requirements, keyed by id, each citing code.
              items:
                properties:
                  codeRefs:
                    items:
                      type: string
                    type: array
                    x-kubernetes-list-type: set
                  id:
                    type: string
                  level:
                    enum:
                    - MUST
                    - SHOULD
                    - MAY
                    type: string
                  text:
                    type: string
                required:
                - id
                - level
                - text
                type: object
              type: array
              x-kubernetes-list-map-keys:
              - id
              x-kubernetes-list-type: map
            upstream:
              default: self
              description: self, sc.<name> or up.<name>.
              type: string
          required:
          - repository
          type: object
        status:
          properties:
            conditions:
              items:
                properties:
                  lastTransitionTime:
                    format: date-time
                    type: string
                  message:
                    type: string
                  observedGeneration:
                    format: int64
                    type: integer
                  reason:
                    type: string
                  status:
                    enum:
                    - "True"
                    - "False"
                    - Unknown
                    type: string
                  type:
                    type: string
                required:
                - type
                - status
                type: object
              type: array
              x-kubernetes-list-map-keys:
              - type
              x-kubernetes-list-type: map
            observed:
              description: 'The code facts the index reports, deterministic. Interfaces
                are keyed the same way the declared surface is: a method by its qualified
                name Type.Method, everything else by its bare name.'
              properties:
                files:
                  items:
                    type: string
                  type: array
                  x-kubernetes-list-type: set
                fingerprint:
                  type: string
                interfaces:
                  items:
                    properties:
                      codegraphId:
                        type: string
                      file:
                        type: string
                      kind:
                        type: string
                      line:
                        type: integer
                      name:
                        type: string
                      signature:
                        type: string
                    required:
                    - name
                    type: object
                  type: array
                  x-kubernetes-list-map-keys:
                  - name
                  x-kubernetes-list-type: map
                treeFiles:
                  description: Tracked files under this context that the code index
                    does not cover; a file code ref resolves against these too.
                  items:
                    type: string
                  type: array
                  x-kubernetes-list-type: set
              type: object
            observedCommit:
              type: string
            observedGeneration:
              format: int64
              type: integer
            realizedSpec:
              description: The last spec that was realized or absorbed, the old side
                of a spec to code delta.
              properties:
                arch:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
                codeRefs:
                  items:
                    type: string
                  type: array
                  x-kubernetes-list-type: set
                dependsOn:
                  items:
                    type: string
                  type: array
                  x-kubernetes-list-type: set
                intent:
                  type: string
                interactions:
                  items:
                    properties:
                      carries:
                        items:
                          type: string
                        type: array
                        x-kubernetes-list-type: set
                      channel:
                        type: string
                      forbidden:
                        type: boolean
                      id:
                        type: string
                      initiator:
                        enum:
                        - self
                        - peer
                        type: string
                      level:
                        default: SHOULD
                        enum:
                        - MUST
                        - SHOULD
                        - MAY
                        type: string
                      peer:
                        type: string
                      purpose:
                        type: string
                    required:
                    - id
                    - peer
                    - initiator
                    type: object
                  type: array
                  x-kubernetes-list-map-keys:
                  - id
                  x-kubernetes-list-type: map
                interfaces:
                  items:
                    properties:
                      file:
                        type: string
                      kind:
                        type: string
                      name:
                        type: string
                      signature:
                        type: string
                    required:
                    - name
                    type: object
                  type: array
                  x-kubernetes-list-map-keys:
                  - name
                  x-kubernetes-list-type: map
                introduces:
                  items:
                    type: string
                  type: array
                  x-kubernetes-list-type: set
                orchestrator:
                  type: string
                overlay:
                  items:
                    type: string
                  type: array
                  x-kubernetes-list-type: set
                repository:
                  type: string
                requirements:
                  items:
                    properties:
                      codeRefs:
                        items:
                          type: string
                        type: array
                        x-kubernetes-list-type: set
                      id:
                        type: string
                      level:
                        enum:
                        - MUST
                        - SHOULD
                        - MAY
                        type: string
                      text:
                        type: string
                    required:
                    - id
                    - level
                    - text
                    type: object
                  type: array
                  x-kubernetes-list-map-keys:
                  - id
                  x-kubernetes-list-type: map
                upstream:
                  type: string
              required:
              - repository
              type: object
            realizedSpecHash:
              type: string
            syncedCommit:
              description: The commit whose facts the spec was last synced against.
              type: string
            syncedFingerprint:
              description: The observed fingerprint recorded when the spec was last
                synced.
              type: string
            syncedObserved:
              description: The facts the synced baseline was taken from, the old side
                of a code to spec delta.
              properties:
                files:
                  items:
                    type: string
                  type: array
                  x-kubernetes-list-type: set
                fingerprint:
                  type: string
                interfaces:
                  items:
                    properties:
                      codegraphId:
                        type: string
                      file:
                        type: string
                      kind:
                        type: string
                      line:
                        type: integer
                      name:
                        type: string
                      signature:
                        type: string
                    required:
                    - name
                    type: object
                  type: array
                  x-kubernetes-list-map-keys:
                  - name
                  x-kubernetes-list-type: map
                treeFiles:
                  description: Tracked files under this context that the code index
                    does not cover; a file code ref resolves against these too.
                  items:
                    type: string
                  type: array
                  x-kubernetes-list-type: set
              type: object
          type: object
      required:
      - spec
      type: object
    served: true
    storage: true
    subresources:
      status: {}
