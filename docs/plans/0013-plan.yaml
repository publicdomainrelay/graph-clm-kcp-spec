apiVersion: specs.publicdomainrelay.dev/v1alpha1
kind: Plan
metadata:
  name: p0013
  namespace: default
spec:
  repository: hydradb-0013
  title: the graph hybrid
  objective: >-
    Every item of docs/plans/0013-graph-hybrid.md, tracked by its acceptance:
    the package tests of the change each item names.
  approved: false
  items:
    - id: ingest-scope
      summary: A1 default excludes for sample, vendored and generated trees
      acceptance:
        - name: packages
          command: ["go", "test", "-count=1", "./impl/ingest/"]
    - id: ingest-partitions
      summary: A2 a partition is made from source code only
      acceptance:
        - name: packages
          command: ["go", "test", "-count=1", "./impl/ingest/"]
    - id: app-contexts
      summary: A3 a command is an orchestrator context
      acceptance:
        - name: packages
          command: ["go", "test", "-count=1", "./impl/ingest/"]
    - id: dependencies
      summary: A4 and A4b dependsOn is production only, test imports are TEST_IMPORTS
      acceptance:
        - name: packages
          command: ["go", "test", "-count=1", "./abc/sync/"]
    - id: scope-prune
      summary: A5 the populate scope is persistent and out-of-scope contexts are pruned
      acceptance:
        - name: packages
          command: ["go", "test", "-count=1", "./impl/populate/"]
    - id: ingest-authority
      summary: B1 the ingest never clobbers an edit it did not make
      acceptance:
        - name: packages
          command: ["go", "test", "-count=1", "./impl/ingest/"]
    - id: removal-guard
      summary: B2 specd holds an undeclared removal from any writer
      acceptance:
        - name: packages
          command: ["go", "test", "-count=1", "./factory/specd/"]
    - id: injection-guard
      summary: B3 an agent directive in a model zone is quarantined
      acceptance:
        - name: packages
          command: ["go", "test", "-count=1", "./impl/clm/"]
    - id: proposals
      summary: B4 proposals are semantic and deduplicated
      acceptance:
        - name: packages
          command: ["go", "test", "-count=1", "./abc/authority/"]
    - id: search-index
      summary: C1 a task finds its entry points by text
      acceptance:
        - name: packages
          command: ["go", "test", "-count=1", "./impl/searchindex/"]
    - id: context-pack
      summary: C2 and C4 the context pack is the prompt, in a fixed order
      acceptance:
        - name: packages
          command: ["go", "test", "-count=1", "./abc/contextpack/"]
    - id: pack-cli
      summary: C5 specctl context pack reads the live graph
      acceptance:
        - name: packages
          command: ["go", "test", "-count=1", "./cmd/specctl/"]
    - id: memory
      summary: D1 and D2 memory notes become vertices and the recall tools share the core
      acceptance:
        - name: packages
          command: ["go", "test", "-count=1", "./impl/clm/"]
    - id: skill
      summary: D3 the context-management skill text is versioned
      acceptance:
        - name: packages
          command: ["go", "test", "-count=1", "./abc/clm/"]
    - id: mod
      summary: E the mod injects the owner card and the task card
      acceptance:
        - name: mod
          command: ["bash", "-c", "cd cc-clm-mod && npm test"]
    - id: swarm
      summary: F the pack carries the blackboard and the scoreboard
      acceptance:
        - name: packages
          command: ["go", "test", "-count=1", "./abc/contextpack/"]
    - id: history-eval
      summary: G1 the context is measured on the repository's own history
      acceptance:
        - name: packages
          command: ["go", "test", "-count=1", "./impl/eval/"]
