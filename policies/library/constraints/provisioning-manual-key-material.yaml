apiVersion: constraints.gatekeeper.sh/v1beta1
kind: ProvisioningManualKeyMaterial
metadata:
  name: provisioning-manual-key-material
spec:
  enforcementAction: deny
  match:
    kinds:
    - apiGroups:
      - specs.publicdomainrelay.dev
      kinds:
      - CodeDiff
  parameters:
    patterns:
    - \bauthorized_keys\b
    - \bssh-keygen\b
    allowPatterns:
    - authorized_keys:\s*\[
