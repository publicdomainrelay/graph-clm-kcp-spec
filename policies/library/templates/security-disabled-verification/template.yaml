apiVersion: templates.gatekeeper.sh/v1
kind: ConstraintTemplate
metadata:
  name: securitydisabledverification
  annotations:
    specs.publicdomainrelay.dev/title: "an added line turns off certificate verification"
    specs.publicdomainrelay.dev/level: MUST
    specs.publicdomainrelay.dev/severity: error
    specs.publicdomainrelay.dev/origin: "deno-kcp opa-first-stab policies/change_security/security-disabled-verification and the disabled_verification_pattern its policy.rego defines"
    specs.publicdomainrelay.dev/calibration: "the pattern is the origin's disabled_verification_pattern with the curl arm trimmed to the -k flag cluster; RESULTS.md found the real instance at accept.sh:141, curl -skS, in a change whose whole purpose was to move two host checks from http to https, so a fetch that trusts any certificate proves what the http fetch proved. One addition: a comment line is skipped, because the origin's code.is_comment guard had no counterpart here; patterns, commentPatterns and allowPatterns are parameters. The same rule has a known intentional case, a self-signed probe of a local kcp with curl -sk, which a repository silences with allowPatterns."
spec:
  crd:
    spec:
      names:
        kind: SecurityDisabledVerification
      validation:
        openAPIV3Schema:
          type: object
          properties:
            disabledVerificationPatterns:
              type: array
              items:
                type: string
            commentPatterns:
              type: array
              items:
                type: string
            allowPatterns:
              type: array
              items:
                type: string
  targets:
    - target: admission.k8s.gatekeeper.sh
