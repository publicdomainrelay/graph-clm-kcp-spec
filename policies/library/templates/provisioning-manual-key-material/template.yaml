apiVersion: templates.gatekeeper.sh/v1
kind: ConstraintTemplate
metadata:
  name: provisioningmanualkeymaterial
  annotations:
    specs.publicdomainrelay.dev/title: "ssh key material is made by hand instead of by the RFP cloud-init"
    specs.publicdomainrelay.dev/level: MUST
    specs.publicdomainrelay.dev/severity: error
    specs.publicdomainrelay.dev/origin: "deno-kcp opa-first-stab policies/code_safety provisioning-manual-authorized-keys and provisioning-ssh-keygen"
    specs.publicdomainrelay.dev/calibration: "the origin's two rules were substring tests on added lines, authorized_keys and ssh-keygen, with no escape hatch; RESULTS.md raised both families on the change under review. The two are one concern here, so one template carries both patterns in the patterns parameter, and allowPatterns is added because a cloud-init UserDataModule that legitimately names authorized_keys would otherwise be a false positive on every run."
spec:
  crd:
    spec:
      names:
        kind: ProvisioningManualKeyMaterial
      validation:
        openAPIV3Schema:
          type: object
          properties:
            patterns:
              type: array
              items:
                type: string
            allowPatterns:
              type: array
              items:
                type: string
  targets:
    - target: admission.k8s.gatekeeper.sh
