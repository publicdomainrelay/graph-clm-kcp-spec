apiVersion: templates.gatekeeper.sh/v1
kind: ConstraintTemplate
metadata:
  name: provisioningnewguesttransport
  annotations:
    specs.publicdomainrelay.dev/title: "a guest transport is added outside cloud-init-common"
    specs.publicdomainrelay.dev/level: MUST
    specs.publicdomainrelay.dev/severity: error
    specs.publicdomainrelay.dev/origin: "deno-kcp opa-first-stab policies/code_safety provisioning-new-guest-transport"
    specs.publicdomainrelay.dev/calibration: "the origin fired on an added line naming websocat, wstunnel, chisel, frpc/frps, autossh, rathole or socat unless the same line named UserDataModule, user_data, userData, cloud-init or cloud_config. RESULTS.md did not raise it on the change under review. The transport and module lists are parameters, and the module marker defaults are kept, because a missing parameter must not turn the rule into one that fires on every transport line."
spec:
  crd:
    spec:
      names:
        kind: ProvisioningNewGuestTransport
      validation:
        openAPIV3Schema:
          type: object
          properties:
            transportPatterns:
              type: array
              items:
                type: string
            modulePatterns:
              type: array
              items:
                type: string
            allowPatterns:
              type: array
              items:
                type: string
  targets:
    - target: admission.k8s.gatekeeper.sh
