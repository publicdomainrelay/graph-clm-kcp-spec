apiVersion: templates.gatekeeper.sh/v1
kind: ConstraintTemplate
metadata:
  name: rfpkeymaterialprovenance
  annotations:
    specs.publicdomainrelay.dev/title: "ssh key material is placed by the guest's user_data, never assembled by hand"
    specs.publicdomainrelay.dev/level: MUST
    specs.publicdomainrelay.dev/origin: "plan 0009 G4, pack rfp-guest-isolation v1"
    specs.publicdomainrelay.dev/calibration: "the model-form replacement for the library's provisioning-manual-key-material CodeDiff rule: an added line that names key material is denied only when it is executed or written and the file's component is not the guest role, so the user_data that installs the root key and a test that asserts on it are not violations"
spec:
  crd:
    spec:
      names:
        kind: RfpKeyMaterialProvenance
      validation:
        openAPIV3Schema:
          type: object
          properties:
            guestRole:
              type: string
            keyPatterns:
              type: array
              items:
                type: string
            writtenKinds:
              type: array
              items:
                type: string
            ignoredPaths:
              type: array
              items:
                type: string
  targets:
    - target: admission.k8s.gatekeeper.sh
