apiVersion: test.gatekeeper.sh/v1alpha1
kind: Suite
metadata:
  name: rfp-relay-only-guest-ssh
tests:
- name: rfp-relay-only-guest-ssh
  template: ../../dist/rfp-relay-only-guest-ssh.yaml
  constraint: ../../constraints/rfp-relay-only-guest-ssh.yaml
  cases:
  - name: allowed-relayed-ssh
    object: inventory/model-allowed.yaml
    inventory:
    - inventory/model-allowed.yaml
    assertions:
    - violations: 0
  - name: allowed-an-unnamed-proxy-is-still-a-relay
    object: inventory/model-allowed-unnamed-proxy.yaml
    inventory:
    - inventory/model-allowed-unnamed-proxy.yaml
    assertions:
    - violations: 0
  - name: allowed-iroh-is-a-relay
    object: inventory/model-allowed-iroh-proxy.yaml
    inventory:
    - inventory/model-allowed-iroh-proxy.yaml
    assertions:
    - violations: 0
  - name: denied-ssh-inside-a-test-body
    object: inventory/model-denied-file-level-ssh.yaml
    inventory:
    - inventory/model-denied-file-level-ssh.yaml
    assertions:
    - violations: 1
  - name: denied-test-dials-the-guest
    object: inventory/model-denied-test-dial.yaml
    inventory:
    - inventory/model-denied-test-dial.yaml
    assertions:
    - violations: 1
  - name: denied-a-proxy-that-dials-the-guest-directly
    object: inventory/model-denied-direct-proxy.yaml
    inventory:
    - inventory/model-denied-direct-proxy.yaml
    assertions:
    - violations: 1
  - name: denied-a-test-ssh-without-a-tunnel
    object: inventory/model-denied-test-ssh-without-a-tunnel.yaml
    inventory:
    - inventory/model-denied-test-ssh-without-a-tunnel.yaml
    assertions:
    - violations: 1
  - name: denied-a-direct-ssh-beside-a-relayed-one-in-the-same-file
    object: inventory/model-denied-two-tests-one-file.yaml
    inventory:
    - inventory/model-denied-two-tests-one-file.yaml
    assertions:
    - violations: 1
  - name: denied-a-direct-ssh-beside-an-unused-relay-callee
    object: inventory/model-denied-relay-callee.yaml
    inventory:
    - inventory/model-denied-relay-callee.yaml
    assertions:
    - violations: 1
  - name: denied-a-direct-test-ssh-under-a-relay-comment
    object: inventory/model-denied-relay-comment.yaml
    inventory:
    - inventory/model-denied-relay-comment.yaml
    assertions:
    - violations: 1
  - name: denied-a-proxy-that-dials-the-guest-over-socat-tcp4
    object: inventory/model-denied-socat-tcp4.yaml
    inventory:
    - inventory/model-denied-socat-tcp4.yaml
    assertions:
    - violations: 1
  - name: denied-a-proxy-that-opens-ssl-to-the-guest
    object: inventory/model-denied-openssl.yaml
    inventory:
    - inventory/model-denied-openssl.yaml
    assertions:
    - violations: 1
  - name: denied-a-proxy-that-opens-a-socket-to-the-guest
    object: inventory/model-denied-python-socket.yaml
    inventory:
    - inventory/model-denied-python-socket.yaml
    assertions:
    - violations: 1
  - name: denied-an-scp-that-reaches-the-guest-directly
    object: inventory/model-denied-scp.yaml
    inventory:
    - inventory/model-denied-scp.yaml
    assertions:
    - violations: 1
  - name: denied-an-ssh-inside-a-shell-string
    object: inventory/model-denied-sh-c-ssh.yaml
    inventory:
    - inventory/model-denied-sh-c-ssh.yaml
    assertions:
    - violations: 1
  - name: denied-a-test-that-dials-a-literal-guest-address
    object: inventory/model-denied-test-dial-literal.yaml
    inventory:
    - inventory/model-denied-test-dial-literal.yaml
    assertions:
    - violations: 1
  - name: allowed-a-test-that-dials-a-target-the-binding-excepts
    object: inventory/model-allowed-test-dial-local.yaml
    inventory:
    - inventory/model-allowed-test-dial-local.yaml
    assertions:
    - violations: 0
  - name: denied-a-declared-flow-that-names-no-relay
    object: inventory/model-denied-declared-direct.yaml
    inventory:
    - inventory/model-denied-declared-direct.yaml
    assertions:
    - violations: 1
  - name: allowed-a-declared-flow-over-a-relay-channel
    object: inventory/model-allowed-declared-relay.yaml
    inventory:
    - inventory/model-allowed-declared-relay.yaml
    assertions:
    - violations: 0
  - name: allowed-an-ssh-to-a-host-that-is-not-the-guest
    object: inventory/model-allowed-ssh-github.yaml
    inventory:
    - inventory/model-allowed-ssh-github.yaml
    assertions:
    - violations: 0
