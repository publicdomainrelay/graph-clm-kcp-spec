apiVersion: test.gatekeeper.sh/v1alpha1
kind: Suite
metadata:
  name: rfp-relay-only-guest-ssh
tests:
- name: rfp-relay-only-guest-ssh
  template: ../../dist/rfp-relay-only-guest-ssh.yaml
  constraint: ../../constraints/rfp-relay-only-guest-ssh.yaml
  cases:
  - name: allowed-relayed-ssh
    object: inventory/model-allowed.yaml
    inventory:
    - inventory/model-allowed.yaml
    assertions:
    - violations: 0
  - name: allowed-an-unnamed-proxy-is-still-a-relay
    object: inventory/model-allowed-unnamed-proxy.yaml
    inventory:
    - inventory/model-allowed-unnamed-proxy.yaml
    assertions:
    - violations: 0
  - name: allowed-iroh-is-a-relay
    object: inventory/model-allowed-iroh-proxy.yaml
    inventory:
    - inventory/model-allowed-iroh-proxy.yaml
    assertions:
    - violations: 0
  - name: denied-ssh-inside-a-test-body
    object: inventory/model-denied-file-level-ssh.yaml
    inventory:
    - inventory/model-denied-file-level-ssh.yaml
    assertions:
    - violations: 1
  - name: denied-test-dials-the-guest
    object: inventory/model-denied-test-dial.yaml
    inventory:
    - inventory/model-denied-test-dial.yaml
    assertions:
    - violations: 1
  - name: denied-a-proxy-that-dials-the-guest-directly
    object: inventory/model-denied-direct-proxy.yaml
    inventory:
    - inventory/model-denied-direct-proxy.yaml
    assertions:
    - violations: 1
  - name: denied-a-test-ssh-without-a-tunnel
    object: inventory/model-denied-test-ssh-without-a-tunnel.yaml
    inventory:
    - inventory/model-denied-test-ssh-without-a-tunnel.yaml
    assertions:
    - violations: 1
  - name: denied-a-direct-ssh-beside-a-relayed-one-in-the-same-file
    object: inventory/model-denied-two-tests-one-file.yaml
    inventory:
    - inventory/model-denied-two-tests-one-file.yaml
    assertions:
    - violations: 1
