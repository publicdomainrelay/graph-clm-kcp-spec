apiVersion: test.gatekeeper.sh/v1alpha1
kind: Suite
metadata:
  name: rfp-host-reach-in
tests:
- name: rfp-host-reach-in
  template: ../../dist/rfp-host-reach-in.yaml
  constraint: ../../constraints/rfp-host-reach-in.yaml
  cases:
  - name: allowed-guest-report-only
    object: inventory/model-allowed.yaml
    inventory:
    - inventory/model-allowed.yaml
    assertions:
    - violations: 0
  - name: denied-host-initiated-network-flow
    object: inventory/model-denied.yaml
    inventory:
    - inventory/model-denied.yaml
    assertions:
    - violations: 1
  - name: denied-a-declared-reach-in-before-any-code
    object: inventory/model-declared-denied.yaml
    inventory:
    - inventory/model-declared-denied.yaml
    assertions:
    - violations: 1
  - name: denied-host-ssh-into-the-guest
    object: inventory/model-denied-effect.yaml
    inventory:
    - inventory/model-denied-effect.yaml
    assertions:
    - violations: 1
  - name: denied-container-inspect-for-the-address
    object: inventory/model-denied-unknown-inspect.yaml
    inventory:
    - inventory/model-denied-unknown-inspect.yaml
    assertions:
    - violations: 1
  - name: denied-a-fetch-to-an-unresolved-target
    object: inventory/model-denied-unknown-fetch.yaml
    inventory:
    - inventory/model-denied-unknown-fetch.yaml
    assertions:
    - violations: 1
  - name: denied-a-dial-to-the-guest-ssh-port
    object: inventory/model-denied-unknown-dial.yaml
    inventory:
    - inventory/model-denied-unknown-dial.yaml
    assertions:
    - violations: 1
  - name: allowed-a-target-the-binding-excepts
    object: inventory/model-allowed-exception.yaml
    inventory:
    - inventory/model-allowed-exception.yaml
    assertions:
    - violations: 0
