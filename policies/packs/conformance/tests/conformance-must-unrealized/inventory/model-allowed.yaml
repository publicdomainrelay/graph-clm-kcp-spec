apiVersion: specs.publicdomainrelay.dev/v1alpha1
kind: ArchitectureModel
metadata:
  name: greenfield-market
  namespace: default
spec:
  repository: greenfield-market
  components:
  - name: guest
    roles: [guest]
    context: guest
    source: declared
  effects:
  - id: e1
    kind: http.handle
    component: host
    file: host/mod.ts
    line: 10
  flows:
  - from: guest
    to: host
    initiator: guest
    channel: relay
    carries: [network-info]
    purpose: network-discovery
    level: MUST
    source: both
    evidence: [e1]
  - from: guest
    to: host
    initiator: guest
    purpose: telemetry
    level: SHOULD
    source: declared
  triggers: []
