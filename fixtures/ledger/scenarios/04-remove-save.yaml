# Difficulty 2: a removal. The storage stops declaring a method, so the delta
# carries one removed interface and the graded surface is what the index must
# stop observing. The removal is a merge directive: a merge by key can add and
# change an entry but only a directive can take one away. Only the interface is
# named, because its name comes from the code and the ids of the requirements
# are the model's choice when the code -> spec half ran live; the drift
# scenario human-removes-save is where the requirement goes too. The store's own
# test used the method, so the change has to carry it too or the gate fails.
name: remove-save
context: storage
difficulty: 2
description: remove an exported method and the test that used it
specPatch:
  interfaces:
    - {"$patch": "delete", "name": "Store.Save"}
expectedInterfaces: []
expectedRemovedInterfaces: ["Store.Save"]
expectedDeltaEntries: 1
acceptance:
  - path: storage/acceptance_load_test.go
    contents: |
      package storage

      import (
      	"os"
      	"path/filepath"
      	"testing"
      )

      func TestAcceptanceLoad(t *testing.T) {
      	path := filepath.Join(t.TempDir(), "ledger.json")
      	body := `[{"account":"cash","amount":100,"memo":"opening"}]`
      	if err := os.WriteFile(path, []byte(body), 0o644); err != nil {
      		t.Fatal(err)
      	}
      	store, err := Load(path)
      	if err != nil {
      		t.Fatalf("Load = %v", err)
      	}
      	got := store.All()
      	if len(got) != 1 || got[0].Account != "cash" || got[0].Amount != 100 {
      		t.Fatalf("loaded = %+v", got)
      	}
      }
realize:
  - patch:
      path: storage/storage_test.go
      find: |
        import (
        	"path/filepath"
        	"testing"

        	"example.com/ledger/domain"
        )
      replace: |
        import (
        	"os"
        	"path/filepath"
        	"testing"

        	"example.com/ledger/domain"
        )
  - patch:
      path: storage/json.go
      find: |
        // Save writes the store's entries to a JSON file.
        func (s *Store) Save(path string) error {
        	s.mu.Lock()
        	defer s.mu.Unlock()
        	encoded, err := json.MarshalIndent(s.entries, "", "  ")
        	if err != nil {
        		return err
        	}
        	return os.WriteFile(path, append(encoded, '\n'), 0o644)
        }

      replace: ""
  - patch:
      path: storage/storage_test.go
      find: |
        func TestSaveAndLoadRoundTrip(t *testing.T) {
        	path := filepath.Join(t.TempDir(), "ledger.json")
        	store := New()
        	store.Add(domain.Entry{Account: "cash", Amount: 100, Memo: "opening"})
        	if err := store.Save(path); err != nil {
        		t.Fatalf("Save = %v", err)
        	}
        	loaded, err := Load(path)
        	if err != nil {
        		t.Fatalf("Load = %v", err)
        	}
        	got := loaded.All()
        	if len(got) != 1 || got[0].Account != "cash" || got[0].Amount != 100 || got[0].Memo != "opening" {
        		t.Fatalf("loaded = %+v", got)
        	}
        }
      replace: |
        func TestLoadReadsWhatWasWritten(t *testing.T) {
        	path := filepath.Join(t.TempDir(), "ledger.json")
        	body := `[{"account":"cash","amount":100,"memo":"opening"}]`
        	if err := os.WriteFile(path, []byte(body), 0o644); err != nil {
        		t.Fatal(err)
        	}
        	loaded, err := Load(path)
        	if err != nil {
        		t.Fatalf("Load = %v", err)
        	}
        	got := loaded.All()
        	if len(got) != 1 || got[0].Account != "cash" || got[0].Amount != 100 || got[0].Memo != "opening" {
        		t.Fatalf("loaded = %+v", got)
        	}
        }
