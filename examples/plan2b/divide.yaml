# The second, independent spec edit of the sequential example: the calc
# package gains Divide, minutes after it gained Subtract. It is realized on
# the branch Subtract already landed on, so it must not race or conflict with
# the first realization.
realize:
  calc:
    - patch:
        path: calc/calc.go
        find: |
          // Subtract returns the difference of two integers.
          func Subtract(a, b int) int {
          	return a - b
          }
        replace: |
          // Subtract returns the difference of two integers.
          func Subtract(a, b int) int {
          	return a - b
          }

          // Divide returns the quotient of two integers.
          func Divide(a, b int) int {
          	return a / b
          }
    - write:
        path: calc/divide_test.go
        contents: |
          package calc

          import "testing"

          func TestDivide(t *testing.T) {
          	if got := Divide(6, 3); got != 2 {
          		t.Fatalf("Divide(6, 3) = %d, want 2", got)
          	}
          }
