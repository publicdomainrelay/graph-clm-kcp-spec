defaultEnforcement: deny
repository: deno-kcp
roles:
  guest:
    declared: true
    globs:
    - deploy/examples/*.yaml
    - deploy/examples/*/*/*.yaml
    targets:
      symbols:
      - DenoPod
      - deno.computer
  host:
    globs:
    - api/*/*.go
    - cmd/*/*.go
    - internal/*/*.go
    - internal/*/*/*/*.go
    targets:
      hosts:
      - '*.svc.kcp.local'
      symbols:
      - DenoPod
      - deno.computer
  relay:
    targets:
      hosts:
      - relay.default.relay.svc.kcp.local
      symbols:
      - dnsshim
      - dnsShim
      - serviceResolver
      - websocat
      - fedproxy
  requester:
    targets:
      hosts:
      - pds.default.*.svc.kcp.local
      - bidder.default.*.svc.kcp.local
      nsids:
      - com.atproto.*
      symbols:
      - reportUrl
      - verifier
      - bidder
      - createAccount
  test:
    globs:
    - test/*/*.go
testGlobs:
- test/*/*.go
version: "1"
vocabulary:
  channels:
    relay:
    - websocat
    - fedproxy
    - dumbpipe
    - iroh connect
    - tunnel-subscriber
    - dnsshim
    - dnsShim
  events:
    workload-report:
    - DenoPod
    - deno.computer
    - status.phase
  payloads:
    service-name:
    - svc.kcp.local
    - ServiceDomain
    - FQDN
    - serviceResolver
  purposes:
    service-discovery:
    - dnsshim
    - dnsShim
    - serviceResolver
    - buildServices
