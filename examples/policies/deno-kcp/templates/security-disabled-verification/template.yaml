apiVersion: templates.gatekeeper.sh/v1
kind: ConstraintTemplate
metadata:
  name: securitydisabledverification
  annotations:
    specs.publicdomainrelay.dev/title: "an added line turns off certificate verification"
    specs.publicdomainrelay.dev/level: MUST
    specs.publicdomainrelay.dev/severity: error
    specs.publicdomainrelay.dev/origin: "deno-kcp opa-first-stab policies/change_security/security-disabled-verification and the disabled_verification_pattern its policy.rego defines"
    specs.publicdomainrelay.dev/calibration: "the pattern is the origin's disabled_verification_pattern with two changes. The curl arm is trimmed to the -k flag cluster, and --validate=false is dropped: kubectl's schema validation is not TLS verification, and a deno-kcp baseline found three kubectl apply --validate=false lines the origin's pattern flagged. The pattern set is --insecure (which covers --insecure-skip-tls-verify), InsecureSkipVerify, rejectUnauthorized: false, NODE_TLS_REJECT_UNAUTHORIZED=0 and --tls-verify=false. RESULTS.md found the real instance at accept.sh:141, curl -skS, in a change whose whole purpose was to move two host checks from http to https, so a fetch that trusts any certificate proves what the http fetch proved. A comment line is skipped, because the origin's code.is_comment guard had no counterpart here; a row matches once even when several patterns hit it; patterns, commentPatterns and allowPatterns are parameters. The same rule has a known intentional case, a self-signed probe of a local kcp or service with curl -sk, which a repository silences with allowPatterns."
spec:
  crd:
    spec:
      names:
        kind: SecurityDisabledVerification
      validation:
        openAPIV3Schema:
          type: object
          properties:
            disabledVerificationPatterns:
              type: array
              items:
                type: string
            commentPatterns:
              type: array
              items:
                type: string
            allowPatterns:
              type: array
              items:
                type: string
  targets:
    - target: admission.k8s.gatekeeper.sh
