apiVersion: templates.gatekeeper.sh/v1
kind: ConstraintTemplate
metadata:
  name: relayonlyssh
  annotations:
    specs.publicdomainrelay.dev/title: "integration tests ssh to a guest only over the relay"
    specs.publicdomainrelay.dev/level: MUST
    specs.publicdomainrelay.dev/severity: error
    specs.publicdomainrelay.dev/origin: "hydradb examples/policies/atproto-market relay-only-ssh (plan 0008 phase B, P-relay)"
    specs.publicdomainrelay.dev/calibration: "the template is the atproto-market relay-only-ssh, re-bound for deno-kcp. deno-kcp has no ssh site today, so the rule guards the shape: a Go integration test that reaches a DenoPod must carry a ProxyCommand that is not a direct dial, and must never dial a guest address or run nc/curl at one. sshPattern is Go's exec.Command(\"ssh\"), testGlobs is test/*/*.go, and driverIdentifiers names the example runner the tests drive."
spec:
  crd:
    spec:
      names:
        kind: RelayOnlySsh
      validation:
        openAPIV3Schema:
          type: object
          properties:
            testGlobs:
              type: array
              items:
                type: string
            driverIdentifiers:
              type: string
            sshPattern:
              type: string
            proxyCommandPattern:
              type: string
            directProxyPatterns:
              type: array
              items:
                type: string
            directDialPatterns:
              type: array
              items:
                type: string
            edgeKinds:
              type: array
              items:
                type: string
  targets:
    - target: admission.k8s.gatekeeper.sh
