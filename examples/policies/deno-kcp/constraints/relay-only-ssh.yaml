apiVersion: constraints.gatekeeper.sh/v1beta1
kind: RelayOnlySsh
metadata:
  name: relay-only-ssh
spec:
  enforcementAction: deny
  match:
    kinds:
    - apiGroups:
      - specs.publicdomainrelay.dev
      kinds:
      - CodeGraph
  parameters:
    testGlobs:
    - test/*/*.go
    driverIdentifiers: liveExample|exampleFiles|runComputeContract
    sshPattern: exec\.Command\(\s*"ssh"
    proxyCommandPattern: ProxyCommand
    directProxyPatterns:
    - '\b(nc|ncat|netcat)\b'
    - 'socat[^\n]*TCP:'
    - '/dev/tcp/'
    - '(\s|["''])-[WJ](\s|["''])'
    directDialPatterns:
    - net\.Dial\([^)]*[Gg]uest
    - exec\.Command\(\s*"nc"
    - curl[^\n]*guest
    edgeKinds:
    - calls
    - imports
    - references
    - contains
    - instantiates
    - implements
    - extends
