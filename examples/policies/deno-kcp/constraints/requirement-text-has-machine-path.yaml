apiVersion: constraints.gatekeeper.sh/v1beta1
kind: RequirementTextHasMachinePath
metadata:
  name: requirement-text-has-machine-path
spec:
  enforcementAction: deny
  match:
    kinds:
    - apiGroups:
      - specs.publicdomainrelay.dev
      kinds:
      - SpecChange
  parameters:
    machinePathPatterns:
    - /(?:home|Users|root|tmp|mnt|opt|srv)/[A-Za-z0-9._@+-]+
