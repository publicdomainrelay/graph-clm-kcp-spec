apiVersion: templates.gatekeeper.sh/v1
kind: ConstraintTemplate
metadata:
  name: guestreportcloudinit
  annotations:
    specs.publicdomainrelay.dev/title: "cloud-init makes the guest publish its address outbound"
    specs.publicdomainrelay.dev/level: MUST
spec:
  crd:
    spec:
      names:
        kind: GuestReportCloudInit
      validation:
        openAPIV3Schema:
          type: object
          properties:
            guestGlobs:
              type: array
              items:
                type: string
            reportPattern:
              type: string
  targets:
    - target: admission.k8s.gatekeeper.sh
