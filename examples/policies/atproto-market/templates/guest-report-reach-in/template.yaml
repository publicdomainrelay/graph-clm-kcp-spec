apiVersion: templates.gatekeeper.sh/v1
kind: ConstraintTemplate
metadata:
  name: guestreportreachin
  annotations:
    specs.publicdomainrelay.dev/title: "the network emitter never reaches into the guest"
    specs.publicdomainrelay.dev/level: MUST
spec:
  crd:
    spec:
      names:
        kind: GuestReportReachIn
      validation:
        openAPIV3Schema:
          type: object
          properties:
            hostGlobs:
              type: array
              items:
                type: string
            emitterPatterns:
              type: string
            reachInPatterns:
              type: array
              items:
                type: string
            edgeKinds:
              type: array
              items:
                type: string
  targets:
    - target: admission.k8s.gatekeeper.sh
