apiVersion: templates.gatekeeper.sh/v1
kind: ConstraintTemplate
metadata:
  name: guestreportdrivenemission
  annotations:
    specs.publicdomainrelay.dev/title: "the guest network identity is emitted from an inbound guest report"
    specs.publicdomainrelay.dev/level: MUST
spec:
  crd:
    spec:
      names:
        kind: GuestReportDrivenEmission
      validation:
        openAPIV3Schema:
          type: object
          properties:
            hostGlobs:
              type: array
              items:
                type: string
            emitterPatterns:
              type: string
            handlerPatterns:
              type: string
            edgeKinds:
              type: array
              items:
                type: string
  targets:
    - target: admission.k8s.gatekeeper.sh
