      := specd.model_effects[_]\n\teffect.kind == \"net.dial\"\n\tspecd.component_in_role(effect.component,
      tester_role)\n\tdial_reaches_the_guest(effect)\n\tmsg := sprintf(\"the test
      dials the guest directly: %s:%d\", [effect.file, object.get(effect, \"line\",
      0)])\n\tdetails := {\"effect\": effect, \"file\": effect.file, \"line\": object.get(effect,
      \"line\", 0)}\n}\n\n# dial_reaches_the_guest is the test-side half of the host
      rule: a dial to the\n# guest, and a dial whose target the model could not resolve,
      are both\n# reach-ins. The binding names the exceptions -- the targets a test
      may dial.\ndial_reaches_the_guest(effect) {\n\tflow := dial_flow(effect)\n\tspecd.acted_on_in_role(flow,
      guest_role)\n}\n\ndial_reaches_the_guest(effect) {\n\tflow := dial_flow(effect)\n\tspecd.acted_on(flow)
      == \"unknown\"\n\tnot dial_exception(effect)\n}\n\ndial_reaches_the_guest(effect)
      {\n\tnot dial_flow(effect)\n\tnot dial_exception(effect)\n}\n\ndial_flow(effect)
      = flow {\n\tflow := specd.model_flows[_]\n\tflow.evidence[_] == effect.id\n}\n\ndial_exception(effect)
      {\n\tpattern := dial_exception_patterns[_]\n\tglob.match(pattern, [\"/\"], effect.file)\n}\n\ndial_exception(effect)
      {\n\tpattern := dial_exception_patterns[_]\n\tvalue := attrs(effect)[_]\n\tcontains(lower(value),
      lower(pattern))\n}\n\ndial_exception_patterns := object.get(specd.model_vocabulary,
      \"reachInExceptions\", [])\n\n# Rule 1 holds at spec time too (review 0006 B9):
      the effects a declaration\n# will produce do not exist yet, so the clause reads
      the declared flow itself.\n# A declaration that sends a non-guest initiator
      at the guest over a channel\n# that names no relay term is the reach-in the
      rule forbids, declared. The\n# check needs the binding to name its relay terms
      under channels/<relayClass>;\n# a binding that does not is recorded as a limit
      in docs/policies.md.\nviolation[specd.violation(msg, details)] {\n\tflow :=
      specd.model_flows[_]\n\tspecd.declared(flow)\n\tnot specd.initiator_in_role(flow,
      guest_role)\n\tspecd.acted_on_in_role(flow, guest_role)\n\trelay_class_declared\n\tnot
      declared_relay(flow)\n\tmsg := sprintf(\"the declared flow %s -> %s reaches
      the guest over channel %q, which names no relay; a guest is reached only through
      a relay, so declare the flow over a channel the binding lists under channels/%s\",\n\t\t[flow.from,
      flow.to, object.get(flow, \"channel\", \"\"), relay_class])\n\tdetails := {\"flow\":
      flow, \"from\": flow.from, \"to\": flow.to, \"channel\": object.get(flow, \"channel\",
      \"\"), \"source\": object.get(flow, \"source\", \"\")}\n}\n\nrelay_class_declared
      {\n\tcount(specd.vocabulary_terms(\"channels\", relay_class)) > 0\n}\n\ndeclared_relay(flow)
      {\n\tterm := specd.vocabulary_terms(\"channels\", relay_class)[_]\n\tspecd.term_in(object.get(flow,
      \"channel\", \"\"), term)\n}\n"
