    rego: "package rfprelayonlyguestssh\n\nimport data.lib.specd\n\nguest_role :=
      object.get(input.parameters, \"guestRole\", \"guest\")\n\ntester_role := object.get(input.parameters,
      \"testRole\", \"test\")\n\nrelay_class := object.get(input.parameters, \"relayClass\",
