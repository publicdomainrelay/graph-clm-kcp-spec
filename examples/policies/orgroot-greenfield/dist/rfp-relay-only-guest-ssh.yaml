      {\n\tselected := selected_edges(kinds)\n\tout := {vertex | vertex := selected[_].source}
      | {vertex | vertex := selected[_].target}\n}\n\nadjacency(kinds) = graph {\n\tselected
      := selected_edges(kinds)\n\tgraph := {source: targets |\n\t\tsource := vertices(kinds)[_]\n\t\ttargets
      := [target | other := selected[_]; other.source == source; target := other.target]\n\t}\n}\n\nreverse_adjacency(kinds)
      = graph {\n\tselected := selected_edges(kinds)\n\tgraph := {target: sources
      |\n\t\ttarget := vertices(kinds)[_]\n\t\tsources := [source | other := selected[_];
      other.target == target; source := other.source]\n\t}\n}\n\nreachable_from(ids,
      kinds) = out {\n\tout := graph.reachable(adjacency(kinds), ids)\n}\n\nreaching(ids,
      kinds) = out {\n\tout := graph.reachable(reverse_adjacency(kinds), ids)\n}\n\nclosure_from(ids,
      kinds) = out {\n\tout := reachable_from(ids, kinds) | {id | id := ids[_]}\n}\n\nclosure_reaching(ids,
      kinds) = out {\n\tout := reaching(ids, kinds) | {id | id := ids[_]}\n}\n\npaths_between(ids,
      kinds) = out {\n\tout := graph.reachable_paths(adjacency(kinds), ids)\n}\n\nlines_matching(path,
      pattern) = out {\n\tlines := split(code_graph.spec.texts[path], \"\\n\")\n\tout
      := [{\"line\": index + 1, \"text\": line} | line := lines[index]; re_match(pattern,
      line)]\n}\n\nfiles_matching_text(pattern) = out {\n\tout := [file.path |\n\t\tfile
      := code_graph.spec.files[_]\n\t\tre_match(pattern, code_graph.spec.texts[file.path])\n\t]\n}\n\nnode_text_matches(node,
      pattern) {\n\tre_match(pattern, node.text)\n}\n\ndefault effects = []\n\neffects
      = out {\n\tout := code_graph.spec.effects\n}\n\neffects_of(kind) = out {\n\tout
      := [effect | effect := effects[_]; effect.kind == kind]\n}\n\neffects_of_component(component,
      kind) = out {\n\tout := [effect | effect := effects[_]; effect.kind == kind;
      effect.component == component]\n}\n\neffects_in(globs) = out {\n\tpaths := {path
      | path := files_matching(globs)[_].path}\n\tout := [effect | effect := effects[_];
      paths[effect.file]]\n}\n\neffect_targets(kind) = out {\n\tout := [target |\n\t\teffect
      := effects_of(kind)[_]\n\t\ttarget := effect.attrs.target\n\t\ttarget != \"\"\n\t]\n}\n\ndefault
      architecture_model = {\"spec\": {\"components\": [], \"effects\": [], \"flows\":
      [], \"triggers\": []}}\n\narchitecture_model = obj {\n\tobj := data.inventory.namespace[namespace][api_version][\"ArchitectureModel\"][repository_name]\n}\n\ndefault
      model_components = []\n\nmodel_components = out {\n\tout := architecture_model.spec.components\n}\n\ndefault
      model_flows = []\n\nmodel_flows = out {\n\tout := architecture_model.spec.flows\n}\n\ndefault
      model_triggers = []\n\nmodel_triggers = out {\n\tout := architecture_model.spec.triggers\n}\n\ncomponents_with_role(role)
      = out {\n\tout := [component | component := model_components[_]; component.roles[_]
      == role]\n}\n\nroles_of(component) = out {\n\tout := [role | entry := model_components[_];
      entry.name == component; role := entry.roles[_]]\n}\n\nflows_where(filter) =
      out {\n\tout := [flow | flow := model_flows[_]; flow_filter_matches(flow, filter)]\n}\n\nflow_filter_matches(flow,
      filter) {\n\tnot flow_filter_key_fails(flow, filter)\n}\n\nflow_filter_key_fails(flow,
      filter) {\n\tkey := [name | _ = filter[name]][_]\n\tnot flow_filter_key_matches(flow,
      filter, key)\n}\n\nflow_filter_key_matches(flow, filter, \"from\") {\n\tflow.from
      == filter.from\n}\n\nflow_filter_key_matches(flow, filter, \"to\") {\n\tflow.to
      == filter.to\n}\n\nflow_filter_key_matches(flow, filter, \"initiator\") {\n\tflow.initiator
      == filter.initiator\n}\n\nflow_filter_key_matches(flow, filter, \"channel\")
      {\n\tflow.channel == filter.channel\n}\n\nflow_filter_key_matches(flow, filter,
      \"purpose\") {\n\tflow.purpose == filter.purpose\n}\n\nflow_filter_key_matches(flow,
      filter, \"source\") {\n\tflow.source == filter.source\n}\n\nflow_filter_key_matches(flow,
      filter, \"carries\") {\n\tis_string(filter.carries)\n\tflow.carries[_] == filter.carries\n}\n\nflow_filter_key_matches(flow,
      filter, \"carries\") {\n\tis_array(filter.carries)\n\twanted := filter.carries[_]\n\tflow.carries[_]
      == wanted\n}\n\ntriggered_by(effect_id) = out {\n\tout := [trigger | trigger
      := model_triggers[_]; trigger.to == effect_id]\n}\n\ndefault model_effects =
      []\n\nmodel_effects = out {\n\tout := architecture_model.spec.effects\n}\n\nmodel_effect(id)
      = out {\n\tout := model_effects[_]\n\tout.id == id\n}\n\ndefault model_vocabulary
      = {}\n\nmodel_vocabulary = obj {\n\tobj := object.get(architecture_model.spec,
      \"vocabulary\", {})\n}\n\ndefault model_roles = []\n\nmodel_roles = out {\n\tout
      := object.get(architecture_model.spec, \"roles\", [])\n}\n\n# vocabulary_terms
      names the concrete terms a binding wrote for one class of\n# one group: vocabulary_terms(\"events\",
      \"network-report\").\nvocabulary_terms(group, class) = out {\n\tout := object.get(object.get(model_vocabulary,
      group, {}), class, [])\n}\n\n# component_in_role is the role of a component,
      by the roles the model gave it\n# or by its name when the model named it after
      the role alone.\ncomponent_in_role(component, role) {\n\troles_of(component)[_]
      == role\n}\n\ncomponent_in_role(component, role) {\n\tcomponent == role\n}\n\ninitiator_in_role(flow,
      role) {\n\tinitiator_of(flow) == role\n}\n\ninitiator_in_role(flow, role) {\n\tentry
      := model_components[_]\n\tentry.name == initiator_of(flow)\n\tentry.roles[_]
      == role\n}\n\nacted_on_in_role(flow, role) {\n\tacted_on(flow) == role\n}\n\nacted_on_in_role(flow,
      role) {\n\tentry := model_components[_]\n\tentry.name == acted_on(flow)\n\tentry.roles[_]
      == role\n}\n\n# file_in_role says whose file a path is: a component that carries
      the role\n# owns it when one of the globs the binding gave that role matches
      the path. It\n# is how a rule that reads a CodeDiff tells the guest's files
      from the rest.\nfile_in_role(path, role) {\n\tcomponent := model_components[_]\n\tcomponent.roles[_]
      == role\n\tpattern := object.get(component, \"globs\", [])[_]\n\tglob.match(pattern,
