      == \"ssh.connect\"\n\tnot specd.component_in_role(effect.component, guest_role)\n\treaches_the_guest(effect)\n\tnot
      relayed(effect)\n\tmsg := sprintf(\"ssh from %s reaches the guest directly:
      %s:%d; a guest is reached only through a relay, so give the ssh a ProxyCommand
      that goes through any transport -- the org relay, fedproxy, websocat, iroh,
      dumbpipe, cloudflared or an unnamed tunnel\",\n\t\t[effect.component, effect.file,
      object.get(effect, \"line\", 0)])\n\tdetails := {\"effect\": effect, \"file\":
      effect.file, \"line\": object.get(effect, \"line\", 0)}\n}\n\n# reaches_the_guest
      reads the ssh's own destination, then the flow the model\n# built for it. An
      ssh whose destination the model cannot read is treated as\n# the guest: a repository
      that does not bind its guest's addresses is guarded\n# rather than trusted.
