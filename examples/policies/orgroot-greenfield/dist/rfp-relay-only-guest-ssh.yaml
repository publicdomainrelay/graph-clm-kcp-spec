      {\n\tssh_host(effect) != \"\"\n}\n\nssh_host(effect) = host {\n\thost := object.get(attrs(effect),
      \"host\", \"\")\n\thost != \"\"\n} else = host {\n\thost := object.get(attrs(effect),
      \"destination\", \"\")\n\thost != \"\"\n} else = host {\n\traw := object.get(attrs(effect),
      \"target\", \"\")\n\traw != \"\"\n\thost := without_user(raw)\n}\n\nwithout_user(raw)
      = host {\n\tparts := split(raw, \"@\")\n\tcount(parts) == 2\n\thost := parts[1]\n}\n\nwithout_user(raw)
      = host {\n\tparts := split(raw, \"@\")\n\tcount(parts) == 1\n\thost := parts[0]\n}\n\n#
      relayed is a property of the ssh's own arguments and of nothing else. A relay\n#
      word in the enclosing function, in a function the ssh calls, or on the line\n#
      above it is not this ssh's relay: the exemption a relay earns is earned by\n#
      the call itself.\nrelayed(effect) {\n\tobject.get(attrs(effect), \"proxyJump\",
      \"\") != \"\"\n}\n\nrelayed(effect) {\n\tobject.get(attrs(effect), \"sshConfig\",
      \"\") != \"\"\n}\n\nrelayed(effect) {\n\tkey := object.keys(attrs(effect))[_]\n\tcontains(lower(key),
      \"transport\")\n}\n\nrelayed(effect) {\n\tproxy := object.get(attrs(effect),
      \"proxyCommand\", \"\")\n\tproxy != \"\"\n\tnot proxy_dials_the_guest(effect,
      proxy)\n}\n\n# proxy_dials_the_guest reads the destination of the proxy command
      itself. nc,\n# socat, openssl s_client, a python socket, /dev/tcp and an inner
      ssh -W all\n# dial an address; when that address is the guest's, is the ssh's
      own target, is\n# %h, or is something the model cannot read, the ssh is a direct
      connection\n# wearing a proxy. Any other proxy -- a named transport, a jumphost,
      a SOCKS\n# hop, a helper the model could not name -- is a relay.\nproxy_dials_the_guest(effect,
      proxy) {\n\ttarget := proxy_targets(proxy)[_]\n\tguest_destination(effect, target)\n}\n\nproxy_targets(proxy)
      = out {\n\tout := {target |\n\t\tpattern := proxy_target_patterns[_]\n\t\tmatch
      := regex.find_all_string_submatch_n(pattern, proxy, 1)[_]\n\t\ttarget := match[1]\n\t\ttarget
      != \"\"\n\t}\n}\n\nproxy_target_patterns := [\n\t\"(?:^|[ /\\\"'`(])(?:nc\\\\.openbsd|nc\\\\.traditional|ncat|netcat|nc)[
      \\t]+(?:-[^ \\t]+[ \\t]+)*([^ \\t\\\"'`]+)[ \\t]+(?:%p|[0-9]+)\",\n\t\"(?:TCP4|TCP6|TCP-CONNECT|TCP):([^
      \\t:\\\"'`]+)\",\n\t\"s_client[^\\n]*?-connect[ \\t]+([^ \\t:\\\"'`]+)\",\n\t\"/dev/tcp/([^/
      \\t\\\"'`]+)\",\n\t\"(?:create_connection|\\\\bconnect)\\\\([ \\t]*\\\\(?[ \\t]*[\\\"'`]([^\\\"'`]+)\",\n\t\"\\\\bssh\\\\b[^\\n]*?-W[
      \\t]+[^ \\t\\\"'`]+[ \\t]+([^ \\t\\\"'`]+)\",\n]\n\nguest_destination(effect,
