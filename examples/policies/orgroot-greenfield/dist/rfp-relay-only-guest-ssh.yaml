      -- is not this repository's guest and is left alone.\nreaches_the_guest(effect)
      {\n\tnot has_ssh_host(effect)\n}\n\nreaches_the_guest(effect) {\n\tssh_host(effect)
      == guest_role\n}\n\nreaches_the_guest(effect) {\n\tspecd.component_in_role(ssh_host(effect),
