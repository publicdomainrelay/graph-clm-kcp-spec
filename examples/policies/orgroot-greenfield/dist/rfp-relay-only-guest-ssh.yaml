      target) {\n\ttarget == guest_role\n}\n\nguest_destination(effect, target) {\n\tspecd.component_in_role(target,
      guest_role)\n}\n\nguest_destination(effect, target) {\n\thas_ssh_host(effect)\n\ttarget
