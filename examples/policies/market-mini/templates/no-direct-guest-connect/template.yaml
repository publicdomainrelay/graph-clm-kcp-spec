apiVersion: templates.gatekeeper.sh/v1
kind: ConstraintTemplate
metadata:
  name: nodirectguestconnect
  annotations:
    specs.publicdomainrelay.dev/title: "integration tests must not dial a guest directly"
    specs.publicdomainrelay.dev/level: MUST
spec:
  crd:
    spec:
      names:
        kind: NoDirectGuestConnect
      validation:
        openAPIV3Schema:
          type: object
          properties:
            globs:
              type: array
              items:
                type: string
            pattern:
              type: string
  targets:
    - target: admission.k8s.gatekeeper.sh
