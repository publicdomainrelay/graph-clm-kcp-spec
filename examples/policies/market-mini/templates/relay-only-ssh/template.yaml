apiVersion: templates.gatekeeper.sh/v1
kind: ConstraintTemplate
metadata:
  name: relayonlyssh
  annotations:
    specs.publicdomainrelay.dev/title: "integration tests ssh to a guest only over the relay"
    specs.publicdomainrelay.dev/level: MUST
    specs.publicdomainrelay.dev/calibration: "a relay is anything that is not a direct connection: an ssh reachable from a test driver is denied when it carries no ProxyCommand or one that only dials the guest (nc/ncat/netcat, socat over TCP:, /dev/tcp/, ssh -W or -J straight to the guest). Any other proxy command passes, named or not. directDialPatterns keeps its own denial for a test that dials a guest address."
spec:
  crd:
    spec:
      names:
        kind: RelayOnlySsh
      validation:
        openAPIV3Schema:
          type: object
          properties:
            testGlobs:
              type: array
              items:
                type: string
            driverIdentifiers:
              type: string
            sshPattern:
              type: string
            proxyCommandPattern:
              type: string
            directProxyPatterns:
              type: array
              items:
                type: string
            directDialPatterns:
              type: array
              items:
                type: string
            edgeKinds:
              type: array
              items:
                type: string
  targets:
    - target: admission.k8s.gatekeeper.sh
