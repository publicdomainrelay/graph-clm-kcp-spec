apiVersion: test.gatekeeper.sh/v1alpha1
kind: Suite
metadata:
  name: relay-only-ssh
tests:
  - name: relay-only-ssh
    template: ../../dist/relay-only-ssh.yaml
    constraint: ../../constraints/relay-only-ssh.yaml
    cases:
      - name: allowed
        object: inventory/codegraph-allowed.yaml
        inventory:
          - inventory/codegraph-allowed.yaml
        assertions:
          - violations: 0
      - name: allowed-unnamed-transport
        object: inventory/codegraph-allowed-unnamed-transport.yaml
        inventory:
          - inventory/codegraph-allowed-unnamed-transport.yaml
        assertions:
          - violations: 0
      - name: denied-direct-dial
        object: inventory/codegraph-denied.yaml
        inventory:
          - inventory/codegraph-denied.yaml
        assertions:
          - violations: 3
