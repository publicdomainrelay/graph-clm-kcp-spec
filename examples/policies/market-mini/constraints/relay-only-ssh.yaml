apiVersion: constraints.gatekeeper.sh/v1beta1
kind: RelayOnlySsh
metadata:
  name: relay-only-ssh
spec:
  enforcementAction: deny
  match:
    kinds:
    - apiGroups:
      - specs.publicdomainrelay.dev
      kinds:
      - CodeGraph
  parameters:
    testGlobs:
    - test/**
    driverIdentifiers: createBidder|runComputeContract
    sshPattern: new Deno\.Command\(\s*"ssh"
    proxyCommandPattern: ProxyCommand
    indirectPattern: '(ProxyJump=-|-J["''`,\s]|["''`]-F["''`,\s]|ssh -W[[:space:]])'
    directProxyPatterns:
    - '\b(nc|ncat|netcat|nc\.openbsd)\b'
    - 'socat[^\n]*TCP'
    - '/dev/tcp/'
    - 's_client[^\n]*-connect'
    directDialPatterns:
    - Deno\.connect\(\{[^}]*guest
    - '["'']-p["'']\s*,\s*String\('
    - new Deno\.Command\(\s*["'']nc["'']
    - curl[^\n]*guest
    edgeKinds:
    - calls
    - imports
    - references
    - contains
    - instantiates
    - implements
    - extends
