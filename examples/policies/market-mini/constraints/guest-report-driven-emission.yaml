apiVersion: constraints.gatekeeper.sh/v1beta1
kind: GuestReportDrivenEmission
metadata:
  name: guest-report-driven-emission
spec:
  enforcementAction: deny
  match:
    kinds:
    - apiGroups:
      - specs.publicdomainrelay.dev
      kinds:
      - CodeGraph
  parameters:
    hostGlobs:
    - hono-bidder/**
    - lib/compute-provider/**
    emitterPatterns: REGISTER_IDENTITY|emitRegisterIdentity|computeIdentity
    subject: the guest identity
    handlerPatterns: OnNetworkReport|IdentityReport|on-network|guest-report
    edgeKinds:
    - calls
    - imports
    - references
    - contains
    - instantiates
    - implements
    - extends
