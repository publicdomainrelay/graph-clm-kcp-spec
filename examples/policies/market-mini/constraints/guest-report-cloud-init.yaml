apiVersion: constraints.gatekeeper.sh/v1beta1
kind: GuestReportCloudInit
metadata:
  name: guest-report-cloud-init
spec:
  enforcementAction: deny
  match:
    kinds:
    - apiGroups:
      - specs.publicdomainrelay.dev
      kinds:
      - CodeGraph
  parameters:
    guestGlobs:
    - lib/cloud-init/**
    reportPattern: guest-report|reportUrl|on-network
