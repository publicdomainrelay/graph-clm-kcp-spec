apiVersion: specs.publicdomainrelay.dev/v1alpha1
kind: Repository
metadata:
  name: calc
  namespace: default
spec:
  path: fixtures/calc
  branch: main
  verify: ["go", "test", "./..."]
---
apiVersion: specs.publicdomainrelay.dev/v1alpha1
kind: SystemContext
metadata:
  name: calc
  namespace: default
spec:
  repository: calc
  upstream: self
  intent: |
    The calc package is the smallest complete unit of the spec loop: two
    integer operations behind one exported surface, so an agent can be asked
    for a change and the verify command can decide whether it landed.
  requirements:
    - id: r.add-two-ints
      level: MUST
      text: Add returns the sum of two integers.
      codeRefs: ["function:Add", "file:calc/calc.go"]
    - id: r.multiply-two-ints
      level: MUST
      text: Multiply returns the product of two integers.
      codeRefs: ["function:Multiply", "file:calc/calc.go"]
    - id: r.reject-overflow
      level: MAY
      text: Operations may report overflow instead of wrapping.
  interfaces:
    - name: Add
      kind: function
      signature: "(a, b int) int"
      file: calc/calc.go
    - name: Multiply
      kind: function
      signature: "(a, b int) int"
      file: calc/calc.go
  codeRefs: ["function:Add", "function:Multiply", "file:calc/calc.go"]
---
apiVersion: specs.publicdomainrelay.dev/v1alpha1
kind: SystemContext
metadata:
  name: cmd-calc
  namespace: default
spec:
  repository: calc
  upstream: sc.calc
  overlay: [sc.calc]
  intent: |
    A command line front end over the calc package. It exists to prove the ref
    syntax carries a real dependency: the CLI cannot be specified without the
    library it wraps.
  requirements:
    - id: r.read-two-operands
      level: MUST
      text: The CLI reads two integers and an operator from the arguments.
      codeRefs: ["file:cmd/calc/main.go"]
  codeRefs: ["file:cmd/calc/main.go"]
