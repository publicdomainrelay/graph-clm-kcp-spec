# The deterministic agent of the phase 6 failing example: it writes a Subtract
# whose test cannot pass, so the repository's verify command rejects the change.
# The point is what the controller does with that: phase Failed, branch kept,
# spec untouched, and the verify output fed into the next attempt.
realize:
  calc:
    - patch:
        path: calc/calc.go
        find: |
          func Multiply(a, b int) int {
          	return a * b
          }
        replace: |
          func Multiply(a, b int) int {
          	return a * b
          }

          func Subtract(a, b int) int {
          	return a + b
          }
    - write:
        path: calc/subtract_test.go
        contents: |
          package calc

          import "testing"

          func TestSubtract(t *testing.T) {
          	if got := Subtract(5, 3); got != 2 {
          		t.Fatalf("Subtract(5, 3) = %d, want 2", got)
          	}
          }
